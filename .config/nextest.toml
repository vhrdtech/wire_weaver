[profile.default]
slow-timeout = { period = "3s", terminate-after = 1 }

# CI runners (and coverage instrumentation) are slower, give tests more time before killing them
[profile.ci]
slow-timeout = { period = "15s", terminate-after = 2 }
fail-fast = false

# property and random-buffer tests run hundreds of cases each, the LogStore and ww_settings power-cut tests one per
# write: give them more time, keep 3 s for everything else
[[profile.default.overrides]]
filter = '(package(shrink_wrap_c) & binary(cross)) | (package(shrink_wrap) & (binary(latched_reads) | binary(sub_byte) | binary(ref_vec_skip))) | (package(ww_stream) & test(/power_cut_/)) | (package(ww_settings) & binary(power_cut))'
slow-timeout = { period = "15s", terminate-after = 1 }

# re-parses every saved API snapshot's crate (ww_global and all of ww_stdlib), about 2.5 s in debug, 6 s at load 2 per core
[[profile.default.overrides]]
filter = 'package(wire_weaver_core) & test(snapshots_are_up_to_date)'
slow-timeout = { period = "15s", terminate-after = 1 }

# the kitchen-sink round trip encodes and decodes every type of the series, 1.2 s alone: over 3 s on a loaded PC
[[profile.default.overrides]]
filter = 'package(shrink_wrap) & test(series::type_tests::kitchen_round_trips)'
slow-timeout = { period = "15s", terminate-after = 1 }

# encodes a 65535-item Series (the most a Series takes) to check the dynamic decoder's budget, 1.3 s alone
[[profile.default.overrides]]
filter = 'package(ww_self) & test(fuzz_series::tests::amplification_is_bounded)'
slow-timeout = { period = "15s", terminate-after = 1 }

# fuzz-like loops over generated inputs, each a round trip and several dynamic decodes: 1.2-2.5 s alone in debug
# (fuzz_series' 140 inputs and random_bytes_never_panic 0.5 s, 2.6-2.9 s with the PC at load 2 per core), over 3 s on a loaded PC
[[profile.default.overrides]]
filter = '(package(shrink_wrap) & (test(series::type_tests::fuzz_like) | test(series::type_tests::random_bytes_never_panic))) | (package(ww_self) & (test(fuzz_bundle::tests::random_inputs) | test(fuzz_series::tests::generated_items_and_random_bytes)))'
slow-timeout = { period = "15s", terminate-after = 1 }

# `just test-power-cut`: ww_settings power cuts at every step in release, tens of seconds per test
[profile.power-cut]
slow-timeout = { period = "60s", terminate-after = 5 }
fail-fast = false

[[profile.power-cut.overrides]]
filter = 'package(ww_settings)'
slow-timeout = { period = "60s", terminate-after = 5 }
