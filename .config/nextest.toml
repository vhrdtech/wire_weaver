# Timeouts here are hang detectors, not speed checks: a test is marked SLOW after 15 s and killed after 30 s. They
# are wide enough that a loaded PC (many builds at once, load well above the core count) can't fail the gate with a
# test that would pass on a quiet one. A test's speed is looked at by itself, with `--stress-count` under load.
# setup scripts: the scratch test root below
experimental = ["setup-scripts"]

[profile.default]
slow-timeout = { period = "15s", terminate-after = 2 }

# Every test runs on a scratch WireWeaver root, state directory and no fetch (`.config/test-home.sh`): none reads or
# changes ~/.wire_weaver, none reaches the network.
[scripts.setup.test-home]
command = { command-line = ".config/test-home.sh", relative-to = "workspace-root" }

[[profile.default.scripts]]
filter = "all()"
setup = "test-home"

# The layer lint prints why it skipped ww_tools/ (no lock, or sources not fetched): shown on a pass too
[[profile.default.overrides]]
filter = 'package(layers_lint) & test(=no_upward_crate_edges)'
success-output = "immediate"

# CI runners (and coverage instrumentation) are slower: never less time than the default
[profile.ci]
slow-timeout = { period = "15s", terminate-after = 2 }
fail-fast = false

[[profile.ci.scripts]]
filter = "all()"
setup = "test-home"

# The layer lint prints why it skipped ww_tools/ (no lock, or sources not fetched): shown on a pass too
[[profile.ci.overrides]]
filter = 'package(layers_lint) & test(=no_upward_crate_edges)'
success-output = "immediate"

# `just test-power-cut`: ww_settings power cuts at every step in release, tens of seconds per test
[profile.power-cut]
slow-timeout = { period = "60s", terminate-after = 5 }
fail-fast = false

[[profile.power-cut.overrides]]
filter = 'package(ww_settings)'
slow-timeout = { period = "60s", terminate-after = 5 }

[[profile.power-cut.scripts]]
filter = "all()"
setup = "test-home"
