# Timeouts here are hang detectors, not speed checks: a test is marked SLOW after 15 s and killed after 30 s. They
# are wide enough that a loaded PC (many builds at once, load well above the core count) can't fail the gate with a
# test that would pass on a quiet one. A test's speed is looked at by itself, with `--stress-count` under load.
[profile.default]
slow-timeout = { period = "15s", terminate-after = 2 }

# CI runners (and coverage instrumentation) are slower: never less time than the default
[profile.ci]
slow-timeout = { period = "15s", terminate-after = 2 }
fail-fast = false

# `just test-power-cut`: ww_settings power cuts at every step in release, tens of seconds per test
[profile.power-cut]
slow-timeout = { period = "60s", terminate-after = 5 }
fail-fast = false

[[profile.power-cut.overrides]]
filter = 'package(ww_settings)'
slow-timeout = { period = "60s", terminate-after = 5 }
