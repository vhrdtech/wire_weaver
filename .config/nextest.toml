[profile.default]
slow-timeout = { period = "3s", terminate-after = 1 }

# CI runners (and coverage instrumentation) are slower, give tests more time before killing them
[profile.ci]
slow-timeout = { period = "15s", terminate-after = 2 }
fail-fast = false

# property and random-buffer tests run hundreds of cases each: give them more time, keep 3 s for everything else
[[profile.default.overrides]]
filter = '(package(shrink_wrap_c) & binary(cross)) | (package(shrink_wrap) & (binary(latched_reads) | binary(sub_byte)))'
slow-timeout = { period = "15s", terminate-after = 1 }
