name: CI

# Based on https://github.com/ameknite/rust-ci-cd-template/blob/main/.github/workflows/ci.yaml
# clippy and rustdoc use --all-features to cover feature gated code. Tests can't: with `defmt` enabled, host test
# binaries fail to link, as there is no defmt global logger (undefined `_defmt_write`, ...).

on:
  merge_group:
  workflow_dispatch:
  workflow_call:
  pull_request:
  push:
    branches: [master]

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          components: rustfmt
          cache: false
      - run: cargo fmt --all --check

  cargo-sort:
    name: cargo sort
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-sort
      # --grouped keeps the blank line separated groups in [workspace.dependencies]
      - run: cargo sort --workspace --grouped --check

  typos:
    name: typos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: crate-ci/typos@v1

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libudev-dev
      - uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          components: clippy
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  doc:
    name: rustdoc
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v7
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libudev-dev
      - uses: actions-rust-lang/setup-rust-toolchain@v2
      - run: cargo doc --workspace --no-deps --all-features

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 so the frozen golden bytes guard (TEST-24) can find the merge base with origin/master
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libudev-dev
      - uses: actions-rust-lang/setup-rust-toolchain@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      # on push to master, origin/master is already HEAD, so the default merge-base lookup in the frozen golden
      # bytes guard (TEST-24) would compare the corpus with itself; CONFORMANCE_BASE names the pushed range's
      # actual prior commit instead (empty on other events, where the default lookup is right: a PR's
      # origin/master still differs from HEAD; event.before is the all-zero sentinel on a branch's first push,
      # meaning there is no prior commit to compare against either).
      - run: cargo nextest run --workspace --all-targets --profile ci
        env:
          CONFORMANCE_BASE: ${{ github.event_name == 'push' && github.event.before || '' }}
      # a firmware's SeriesStore sizes, with the number types up to 32 bits only
      - run: cargo nextest run -p ww_numeric --no-default-features --features u32,i32,f32 --test store --test integer --profile ci
      - run: cargo nextest run -p ww_si --no-default-features --features time,electrical,u32,i32,f32 --test store --test narrow --profile ci
      # nextest does not run doctests
      - run: cargo test --workspace --doc

  miri:
    name: miri (observe cells)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          toolchain: nightly
          components: miri, rust-src
          cache: false
      - run: cargo +nightly miri test -p shrink_wrap --lib cells_tests
      - run: cargo +nightly miri test -p ww_stream --features std --lib cells_tests
        env:
          MIRIFLAGS: -Zmiri-many-seeds=0..16

  # the conformance matrix's Python consumer (TEST-23); the derive, dynamic and C consumers run in `test`
  conformance-py:
    name: conformance (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libudev-dev
      - uses: actions-rust-lang/setup-rust-toolchain@v2
      - uses: astral-sh/setup-uv@v10.2.0
      - run: uv run --group dev pytest -q tests/test_conformance.py
        working-directory: wire_weaver_py

  # ww_lz4's blocks decoded by C liblz4 (python-lz4)
  lz4-c:
    name: ww_lz4 against liblz4
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v2
      - uses: astral-sh/setup-uv@v10.2.0
      - run: cargo run -q -p ww_lz4 --example liblz4_vectors | uv run -q --script ww_lz4/tests/liblz4/check.py

  # the docs site's own Markdown extensions (docs_ext: the `bits` fence)
  docs-ext:
    name: docs extensions (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
      - run: uv run --group dev pytest -q docs_ext

  coverage:
    name: coverage
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 so the frozen golden bytes guard (TEST-24) can find the merge base with origin/master
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libudev-dev
      - uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          components: llvm-tools-preview
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov,cargo-nextest
      # see the `test` job for why CONFORMANCE_BASE is set this way (TEST-24)
      - run: cargo llvm-cov nextest --workspace --profile ci --lcov --output-path lcov.info
        env:
          CONFORMANCE_BASE: ${{ github.event_name == 'push' && github.event.before || '' }}
      - uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: lcov.info
          fail_ci_if_error: false

  semver-checks:
    name: semver checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libudev-dev
      - uses: actions-rust-lang/setup-rust-toolchain@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-semver-checks
      # Only crates already on crates.io have a baseline to compare against, never published ones would fail.
      # Default features only: older releases don't build with all of them (defmt).
      - name: cargo semver-checks
        run: |
          packages=()
          for name in $(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.publish != []) | .name'); do
            code=$(curl -s -o /dev/null -w '%{http_code}' -A 'wire_weaver CI (github.com/vhrdtech/wire_weaver)' \
              "https://crates.io/api/v1/crates/$name")
            if [ "$code" = 200 ]; then
              packages+=(--package "$name")
            else
              echo "::notice::skipping $name, not on crates.io ($code)"
            fi
          done
          cargo semver-checks "${packages[@]}" --default-features

  mcu:
    name: check mcu workspace
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          cache-workspaces: mcu
          target: thumbv6m-none-eabi,thumbv7em-none-eabihf
      - run: cargo check --workspace --exclude ww_ecc_flash
        working-directory: mcu
      - run: cargo check -p ww_ecc_flash --features nmi-handler --target thumbv6m-none-eabi
        working-directory: mcu
      - run: cargo check -p ww_ecc_flash --features stm32h7 --target thumbv7em-none-eabihf
        working-directory: mcu
      - run: cargo test -p ww_ecc_flash --features stm32h7
        working-directory: mcu
      - run: cargo test -p ww_ecc_flash --features stm32g0
        working-directory: mcu

  examples-mcu:
    name: check ${{ matrix.board }} ${{ matrix.args }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - board: mcu_qemu
          - board: nucleo_h743zi2
          - board: usb_stm32h725ig
          - board: nucleo_g0b1re
            args: --features usb
          - board: nucleo_g0b1re
            args: --no-default-features --features nucleo_g0b1re,rtt_target
          - board: ecc_flash_g0b1
            args: --bins
    steps:
      - uses: actions/checkout@v7
      # toolchain (nightly) and target come from the board's rust-toolchain.toml
      - uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          rust-src-dir: examples_mcu/${{ matrix.board }}
          cache-workspaces: examples_mcu/${{ matrix.board }}
          # nightly toolchain, new lints should not break the build
          build-warnings: warn
      - run: cargo check ${{ matrix.args }}
        working-directory: examples_mcu/${{ matrix.board }}
