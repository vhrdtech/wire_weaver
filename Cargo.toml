
[workspace]
resolver = "3"
members = [
    #    "wire_weaver_tool",
    "examples/*",
    "shrink_wrap_c",
    "stm32_dfu_host",
    "tests/*",
    "wire_weaver",
    "wire_weaver_cli",
    "wire_weaver_client",
    "wire_weaver_core",
    "wire_weaver_derive",
    "wire_weaver_evolution",
    "wire_weaver_py",
    "ww_api",
    "ww_book",
    "ww_client_server",
    "ww_clock_sync",
    "ww_device",
    "ww_framer",
    "ww_hub",
    "ww_hub_api",
    "ww_link",
    "ww_local_socket",
    "ww_lz4",
    "ww_plugin",
    "ww_self",
    "ww_settings/*",
    "ww_snapshots",
    "ww_stream",
    "ww_tap",
    "ww_tape_bundle",
    "ww_timebase",
]

exclude = [
    "examples/compare_wire_formats",
    "examples_mcu",
    "fuzz",
    "tests/thermo_api_old",
    "wire_weaver_tool",
]

[workspace.package]
version = "0.5.0"
authors = ["Roman Isaikin <romix.lab@gmail.com>"]
description = "WireWeaver is a wire format and API code generator for resource constrained systems."
edition = "2024"
repository = "https://github.com/vhrdtech/wire_weaver"
license = "MIT"

[workspace.lints.cargo]
unused_workspace_dependencies = "deny"

[workspace.lints.rust]
# `cargo fuzz` builds with `--cfg fuzzing`: ww_self and ww_stream gate their fuzz entry points on it
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(fuzzing)'] }

[workspace.dependencies]
anyhow = "1"
atomic-waker = { version = "1.1", features = ["portable-atomic"] }
cargo_metadata = "0.23"
cc = "1.2"
clap = "4.5"
clap_complete = "4.6"
cnt = "0.4"
cnt_core = "0.5"
console = "0.16"
convert_case = "0.11"
crc = "3.4"
crossterm = "0.29"
defmt = "1.1"
# memoised snapshots handed out as references for as long as the resolver lives (ww_snapshots)
elsa = "1.11"
embassy-futures = "0.1"
embedded-storage-async = "0.4.2"
# gzip of a .crate or repository archive, pure Rust (miniz_oxide)
flate2 = { version = "1.1", default-features = false, features = ["rust_backend"] }
futures-core = { version = "0.3", default-features = false, features = ["alloc"] }
hex = { version = "0.4", default-features = false }
hex-literal = "1"
interprocess = { version = "2.4", features = ["tokio"] }
# commands of the ww command line register themselves from their own crate and module
inventory = "0.3"
libc = "0.2"
# exact: ww_tape pins it, its lz4 payload columns must compress to the same bytes
lz4_flex = { version = "=0.14.0", default-features = false, features = ["safe-decode", "checked-decode"] }
nusb = { version = "0.2", features = ["tokio"] }
portable-atomic = { version = "1.15", default-features = false, features = ["require-cas"] }
proc-macro-crate = "3"
proc-macro2 = "1.0"
proptest = "1.11"
pyo3 = "0.29"
quote = "1.0"
ron = { version = "0.12", features = ["integer128"] }
rustix = { version = "1", default-features = false, features = ["std", "termios"] }
semver = "1.0"
serde = { version = "1.0", default-features = false, features = ["derive"] }
serde_json = "1.0"
sha2 = "0.11"
strum = "0.28"
strum_macros = "0.28"
syn = { version = "3", features = ["full", "extra-traits"] }
# the entries of a .crate or repository archive (ww_snapshots fetch)
tar = { version = "0.4", default-features = false }
thiserror = "2"
tokio = "1.54" # interprocess 2.4 calls AsyncFd::register_with_interest, new in 1.54 (it declares 1.36)
toml = "1"
toml_edit = "0.25"
tracing = "0.1"
tracing-subscriber = "0.3"
# HTTPS for the snapshot fetch, TLS through rustls only (no system TLS); its provider ring is a C and assembly crate, see AGENTS.md
ureq = { version = "3.5", default-features = false, features = ["rustls"] }
widestring = "1"
windows-sys = "0.61"

# exact_units and shrink_wrap live in their own repositories, taken by git: Cargo.lock pins the commit
# (`cargo update -p exact_units` / `-p shrink_wrap` moves it); to build against a local checkout, put a [patch] in
# .cargo/config.toml of the worktree (never committed), as the commented-out one below shows
exact_units = { version = "0.1.0", git = "https://github.com/romixlab/exact_units", default-features = false }
shrink_wrap = { version = "0.2.0", git = "https://github.com/romixlab/shrink_wrap", default-features = false }
# the docs site's WireWeaver highlighter (DOC-11), vendored into docs/ and checked by tests/docs_highlight: by git
# from ww_lsp, which owns it; Cargo.lock pins the commit
ww_highlight = { git = "https://github.com/romixlab/ww_lsp" }

# the base types and identity crates (layer 2) live in vhrdtech/ww_base, taken by git: Cargo.lock pins the commit
# (`cargo update -p ww_si` moves them all)
ww_crc = { version = "0.5.0", git = "https://github.com/vhrdtech/ww_base" }
ww_date_time = { version = "0.1.0", git = "https://github.com/vhrdtech/ww_base", default-features = false }
ww_error = { version = "0.1.0", git = "https://github.com/vhrdtech/ww_base", default-features = false }
ww_global = { version = "0.2.0", git = "https://github.com/vhrdtech/ww_base" }
ww_keyed = { version = "0.1.0", git = "https://github.com/vhrdtech/ww_base", default-features = false }
ww_numeric = { version = "0.3.0", git = "https://github.com/vhrdtech/ww_base", default-features = false }
ww_si = { version = "0.5.0", git = "https://github.com/vhrdtech/ww_base", default-features = false }
ww_version = { version = "0.2.0", git = "https://github.com/vhrdtech/ww_base", default-features = false }

# the tape block format (layer 3) lives in vhrdtech/ww_tape, taken by git: Cargo.lock pins the commit
# (`cargo update -p ww_tape` moves it)
ww_tape = { version = "0.1.0", git = "https://github.com/vhrdtech/ww_tape", default-features = false }

# framework crates, versioned together via [workspace.package] version
wire_weaver = { version = "0.5.0", path = "./wire_weaver", default-features = false }
wire_weaver_client = { version = "0.5.0", path = "./wire_weaver_client" }
wire_weaver_core = { version = "0.5.0", path = "./wire_weaver_core" }
wire_weaver_derive = { version = "0.5.0", path = "./wire_weaver_derive" }
wire_weaver_evolution = { version = "0.5.0", path = "./wire_weaver_evolution", default-features = false }
wire_weaver_py = { version = "0.5.0", path = "./wire_weaver_py" }
ww_api = { version = "0.5.0", path = "./ww_api", default-features = false }
ww_book = { version = "0.5.0", path = "./ww_book" }
ww_clock_sync = { version = "0.5.0", path = "./ww_clock_sync" }
ww_device = { version = "0.5.0", path = "./ww_device" }
ww_framer = { version = "0.5.0", path = "./ww_framer", default-features = false }
ww_hub = { version = "0.5.0", path = "./ww_hub" }
ww_link = { version = "0.5.0", path = "./ww_link", default-features = false }
ww_local_socket = { version = "0.5.0", path = "./ww_local_socket", default-features = false }
# Its own repo since CLT-21; a registry version once picoboot_host is on crates.io.
ww_picoboot = { package = "picoboot_host", git = "https://github.com/vhrdtech/picoboot_host", tag = "v0.1.0", default-features = false }
ww_settings = { version = "0.5.0", path = "./ww_settings/ww_settings" }
ww_settings_derive = { version = "0.5.0", path = "./ww_settings/ww_settings_derive" }
ww_snapshots = { version = "0.5.0", path = "./ww_snapshots" }
# CLT-34: a crate of its own like picoboot_host, to move to its own repo.
ww_stm32_dfu = { package = "stm32_dfu_host", version = "0.1.0", path = "./stm32_dfu_host", default-features = false }
ww_stream = { version = "0.5.0", path = "./ww_stream", default-features = false }

# framework-level base types, each crate has its own version
ww_client_server = { version = "0.2.0", path = "./ww_client_server", default-features = false }
ww_hub_api = { version = "0.1.0", path = "./ww_hub_api", default-features = false }
ww_lz4 = { version = "0.1.0", path = "./ww_lz4" }
ww_plugin = { version = "0.1.0", path = "./ww_plugin" }
ww_self = { version = "0.3.0", path = "./ww_self" }
ww_tap = { version = "0.1.0", path = "./ww_tap", default-features = false }
ww_tape_bundle = { version = "0.1.0", path = "./ww_tape_bundle" }
ww_timebase = { version = "0.1.0", path = "./ww_timebase", default-features = false }

# examples and tests, not published
args_evolution_api = { version = "0.1.0", path = "./tests/args_evolution_api" }
array_of_streams_api = { version = "0.1.0", path = "./tests/array_of_streams_api" }
blinky = { version = "0.1.0", path = "./examples/blinky" }
blinky_api = { version = "0.1.0", path = "./examples/blinky_api" }
blinky_api_evolved = { version = "0.1.1", path = "./examples/blinky_api_evolved" }
bounded_api = { version = "0.1.0", path = "./tests/bounded_api" }
cfg_variants_api = { version = "0.1.0", path = "./tests/cfg_variants_api" }
cfg_variants_narrow_api = { version = "0.1.0", path = "./tests/cfg_variants_narrow_api", default-features = false, features = ["std"] }
common_error = { version = "0.1.0", path = "./tests/common_error" }
common_error_api = { version = "0.1.0", path = "./tests/common_error_api" }
conformance_api = { version = "0.1.0", path = "./tests/conformance_api" }
consts_api = { version = "0.1.0", path = "./tests/consts_api" }
credit_sink_api = { version = "0.1.0", path = "./tests/credit_sink_api" }
cross_version_api = { version = "0.4.0", path = "./tests/cross_version_api" }
cross_version_old_api = { version = "0.3.0", path = "./tests/cross_version_old_api" }
customary_api = { version = "0.1.0", path = "./tests/customary_api" }
dispatch_golden_api = { version = "0.1.0", path = "./tests/dispatch_golden_api" }
dynamic_api = { version = "0.1.0", path = "./tests/dynamic_api" }
fan_api = { version = "0.1.0", path = "./tests/fan_api" }
flash_budget_api = { version = "0.1.0", path = "./tests/flash_budget_api", default-features = false }
follow_reboot_api = { version = "0.1.0", path = "./tests/follow_reboot_api" }
generics_api = { version = "0.1.0", path = "./tests/generics_api" }
global_boot_api = { version = "0.1.0", path = "./tests/global_boot_api" }
global_fixture_api = { version = "0.1.0", path = "./tests/global_fixture_api" }
hub_api = { version = "0.1.0", path = "./tests/hub_api" }
hub_pytest_device_api = { version = "0.1.0", path = "./tests/hub_pytest_device_api" }
hub_reconnect_api = { version = "0.1.0", path = "./tests/hub_reconnect_api" }
introspect_compressed_api = { version = "0.1.0", path = "./tests/introspect_compressed_api" }
io_timebase_api = { version = "0.1.0", path = "./tests/io_timebase_api" }
keyed = { version = "0.1.0", path = "./tests/keyed" }
keyed_api = { version = "0.1.0", path = "./tests/keyed_api" }
large_messages_api = { version = "0.1.0", path = "./tests/large_messages_api" }
local_trait_api = { version = "0.1.0", path = "./examples/local_trait_api" }
methods_api = { version = "0.1.0", path = "./tests/methods_api" }
module_paths_api = { version = "0.1.0", path = "./tests/module_paths_api" }
multi_req_api = { version = "0.1.0", path = "./tests/multi_req_api" }
multi_root_api = { version = "0.1.0", path = "./tests/multi_root_api" }
observe_api = { version = "0.1.0", path = "./tests/observe_api" }
observe_arrays_api = { version = "0.1.0", path = "./tests/observe_arrays_api" }
observe_batched_api = { version = "0.1.0", path = "./tests/observe_batched_api" }
properties_api = { version = "0.1.0", path = "./tests/properties_api" }
quantities_api = { version = "0.1.0", path = "./tests/quantities_api" }
recursive_api = { version = "0.1.0", path = "./tests/recursive_api" }
series_api = { version = "0.1.0", path = "./tests/series_api" }
settings_api = { version = "0.1.0", path = "./examples/settings_api" }
shared_sub_level_api = { version = "0.1.0", path = "./tests/shared_sub_level_api" }
shrink_wrap_c = { version = "0.1.0", path = "./shrink_wrap_c" }
skipped_dep_api = { version = "0.1.0", path = "./tests/skipped_dep_api", default-features = false }
standalone_api = { version = "0.1.0", path = "./tests/standalone_api" }
standalone_units = { version = "0.1.0", path = "./tests/standalone_units" }
streams_api = { version = "0.1.0", path = "./tests/streams_api" }
streams_batched_api = { version = "0.1.0", path = "./tests/streams_batched_api" }
streams_borrowed_error_api = { version = "0.1.0", path = "./tests/streams_borrowed_error_api" }
streams_reliable_api = { version = "0.1.0", path = "./tests/streams_reliable_api" }
tap_api = { version = "0.1.0", path = "./tests/tap_api" }
tests_common = { version = "0.1.0", path = "./tests/tests_common" }
# one API crate at three wire lines, and its first revisions outside the workspace (EVO-28)
thermo_api = { version = "6.0.0", path = "./tests/thermo_api" }
# firmware of the first revision of lines 5 and 6, built from the crate of that time (EVO-42)
thermo_api_5_0_0 = { package = "thermo_api", version = "5.0.0", path = "./tests/thermo_api_old/5_0_0" }
thermo_devices = { version = "0.1.0", path = "./tests/thermo_devices" }
traits_api = { version = "0.1.0", path = "./tests/traits_api" }
