
[workspace]
resolver = "3"
members = [
    #    "wire_weaver_tool",
    "examples/*",
    "shrink_wrap_c",
    "stm32_dfu_host",
    "tests/*",
    "wire_weaver",
    "wire_weaver_cli",
    "wire_weaver_client",
    "wire_weaver_client_benchmarks",
    "wire_weaver_core",
    "wire_weaver_derive",
    "wire_weaver_evolution",
    "wire_weaver_py",
    "wire_weaver_server",
    "ww_api",
    "ww_book",
    "ww_byte_stream",
    "ww_calloop",
    "ww_client_server",
    "ww_clock_sync",
    "ww_device",
    "ww_dns_sd",
    "ww_framer",
    "ww_hub",
    "ww_hub_api",
    "ww_json",
    "ww_link",
    "ww_local_socket",
    "ww_lz4",
    "ww_plugin",
    "ww_quantity",
    "ww_self",
    "ww_settings/*",
    "ww_snapshots",
    "ww_stream",
    "ww_tap",
    "ww_timebase",
    "ww_trace_context",
]

exclude = [
    "examples/compare_wire_formats",
    "examples_mcu",
    "fuzz",
    "tests/thermo_api_old",
    "wire_weaver_tool",
]

[workspace.package]
version = "0.6.0"
authors = ["Roman Isaikin <romix.lab@gmail.com>"]
description = "WireWeaver is a wire format and API code generator for resource constrained systems."
edition = "2024"
rust-version = "1.99"
repository = "https://github.com/vhrdtech/wire_weaver"
homepage = "https://ww.vhrd.tech/"
license = "MIT"

[workspace.lints.cargo]
unused_workspace_dependencies = "deny"

[workspace.lints.rust]
# Only the crates layers.toml marks `unsafe = true` allow it, in a [lints] table of their own (unsafe-allow-list).
unsafe_code = "forbid"
# `cargo fuzz` builds with `--cfg fuzzing`: ww_self and ww_stream gate their fuzz entry points on it
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(fuzzing)'] }

[workspace.dependencies]
anyhow = { version = "1", default-features = false, features = ["std"] }
atomic-waker = { version = "1.1", default-features = false, features = ["portable-atomic"] }
# the event loop of ww_calloop: its timers and file descriptor readiness
calloop = { version = "0.14", default-features = false }
cargo_metadata = { version = "0.23", default-features = false }
cargo_toml = { version = "1.0", default-features = false }
cc = { version = "1.2", default-features = false }
clap = { version = "4.5", default-features = false, features = ["color", "error-context", "help", "std", "suggestions", "usage"] }
clap_complete = { version = "4.6", default-features = false }
cnt = { version = "0.4", default-features = false }
cnt_core = { version = "0.5.3", git = "https://github.com/romixlab/cnt", default-features = false }
console = { version = "0.16", default-features = false, features = ["ansi-parsing", "std", "unicode-width"] }
convert_case = { version = "0.11", default-features = false }
crossterm = { version = "0.29", default-features = false, features = ["events", "windows"] }
darling = { version = "0.24", default-features = false, features = ["suggestions"] }
defmt = { version = "1.1", default-features = false }
edge-http = { version = "0.8", default-features = false }
edge-ws = { version = "0.8", default-features = false }
either = { version = "1", default-features = false, features = ["std"] }
# memoised snapshots handed out as references for as long as the resolver lives (ww_snapshots)
elsa = { version = "1.11", default-features = false }
embassy-futures = { version = "0.1", default-features = false }
embassy-net = { version = "0.9", default-features = false }
embassy-sync = { version = "0.8", default-features = false }
embassy-time = { version = "0.5", default-features = false }
embedded-sdmmc-types = { version = "0.1", default-features = false }
embedded-storage-async = { version = "0.4.2", default-features = false }
# gzip of a .crate or repository archive, pure Rust (miniz_oxide)
flate2 = { version = "1.1", default-features = false, features = ["rust_backend"] }
futures-channel = { version = "0.3", default-features = false }
futures-core = { version = "0.3", default-features = false, features = ["alloc"] }
futures-lite = { version = "2.6", default-features = false, features = ["std"] }
futures-util = { version = "0.3", default-features = false }
hex = { version = "0.4", default-features = false }
hex-literal = { version = "1", default-features = false }
httparse = { version = "1.10", default-features = false }
human-repr = { version = "1.1", default-features = false }
# interface addresses and indices (ww_dns_sd)
if-addrs = { version = "0.15", default-features = false }
indicatif = { version = "0.18", default-features = false, features = ["unicode-width"] }
interprocess = { version = "2.4", default-features = false, features = ["tokio"] }
# commands of the ww command line register themselves from their own crate and module
inventory = { version = "0.3", default-features = false }
# validates the values of the JSON codec against its schemas in tests (ww_json), no remote or file references
jsonschema = { version = "0.63", default-features = false }
libc = { version = "0.2", default-features = false, features = ["std"] }
log = { version = "0.4", default-features = false }
# exact: ww_tape pins it, its lz4 payload columns must compress to the same bytes
lz4_flex = { version = "=0.14.0", default-features = false, features = ["safe-decode", "checked-decode"] }
# the in-process mDNS responder (ww_dns_sd), runtime free; its async API is off
mdns-sd = { version = "0.22", default-features = false }
nusb = { version = "0.2", default-features = false, features = ["tokio"] }
object = { version = "0.40", default-features = false }
pathsearch = { version = "0.2", default-features = false }
portable-atomic = { version = "1.15", default-features = false, features = ["require-cas"] }
probe-rs = { version = "0.32", default-features = false }
proc-macro-crate = { version = "3", default-features = false }
proc-macro2 = { version = "1.0", default-features = false, features = ["proc-macro"] }
proptest = { version = "1.11", default-features = false, features = ["std"] }
pyo3 = { version = "0.29", default-features = false, features = ["macros"] }
quote = { version = "1.0", default-features = false, features = ["proc-macro"] }
regex = { version = "1.12", default-features = false, features = ["perf", "std", "unicode"] }
ron = { version = "0.12", default-features = false, features = ["integer128", "std"] }
rtt-target = { version = "0.6", default-features = false }
# Cargo's hash of a git URL, the name of its checkout directory (ww_snapshots)
rustc-stable-hash = { version = "0.1", default-features = false }
rustix = { version = "1", default-features = false, features = ["std", "termios"] }
semver = { version = "1.0", default-features = false, features = ["std"] }
serde = { version = "1.0", default-features = false, features = ["derive"] }
serde-reflection = { version = "0.7", default-features = false }
serde_json = { version = "1.0", default-features = false, features = ["std"] }
sha2 = { version = "0.11", default-features = false }
shlex = { version = "2", default-features = false, features = ["std"] }
strum = { version = "0.28", default-features = false, features = ["std"] }
subprocess = { version = "1.2", default-features = false }
syn = { version = "3", default-features = false, features = ["clone-impls", "extra-traits", "full", "parsing", "printing", "proc-macro"] }
# the entries of a .crate or repository archive (ww_snapshots fetch)
tar = { version = "0.4", default-features = false }
thiserror = { version = "2", default-features = false, features = ["std"] }
tokio = { version = "1.54", default-features = false } # interprocess 2.4 calls AsyncFd::register_with_interest, new in 1.54 (it declares 1.36)
tokio-tungstenite = { version = "0.30", default-features = false, features = ["connect"] }
# futures-io streams over tokio ones (`compat`): byte-stream transports on tokio sockets, pipes and processes
tokio-util = { version = "0.7", default-features = false, features = ["compat"] }
toml = { version = "1", default-features = false, features = ["parse", "serde", "std"] }
toml_edit = { version = "0.25", default-features = false }
tracing = { version = "0.1", default-features = false, features = ["std"] }
tracing-subscriber = { version = "0.3", default-features = false, features = ["ansi", "fmt", "smallvec", "std", "tracing-log"] }
trybuild = { version = "1", default-features = false }
# HTTPS for the snapshot fetch, TLS through rustls only (no system TLS); its provider ring is a C and assembly crate, see AGENTS.md
ureq = { version = "3.5", default-features = false, features = ["rustls"] }
widestring = { version = "1", default-features = false, features = ["std"] }
windows-sys = { version = "0.61", default-features = false }
# Avahi over D-Bus (ww_dns_sd avahi): async proxies driven by zbus::block_on on its own runtime
zbus = { version = "6", default-features = false, features = ["default-rt", "proxy"] }

# exact_units and shrink_wrap live in their own repositories, taken by git: Cargo.lock pins the commit
# (`cargo update -p exact_units` / `-p shrink_wrap` moves it); to build against a local checkout, put a [patch] in
# .cargo/config.toml of the worktree (never committed), as the commented-out one below shows
exact_units = { version = "0.1.0", git = "https://github.com/romixlab/exact_units", default-features = false }
shrink_wrap = { version = "0.2.0", git = "https://github.com/romixlab/shrink_wrap", default-features = false }
# the docs site's WireWeaver highlighter (DOC-11), vendored into docs/ and checked by tests/docs_highlight: by git
# from ww_lsp, which owns it; Cargo.lock pins the commit
ww_highlight = { version = "0.1.0", git = "https://github.com/romixlab/ww_lsp", default-features = false }

# the base types and identity crates (layer 2) live in vhrdtech/ww_base, taken by git: Cargo.lock pins the commit
# (`cargo update -p ww_si` moves them all)
ww_crc = { version = "0.5.0", git = "https://github.com/vhrdtech/ww_base", default-features = false }
ww_date_time = { version = "0.1.0", git = "https://github.com/vhrdtech/ww_base", default-features = false }
ww_error = { version = "0.1.0", git = "https://github.com/vhrdtech/ww_base", default-features = false }
ww_global = { version = "0.2.0", git = "https://github.com/vhrdtech/ww_base", default-features = false }
ww_keyed = { version = "0.1.0", git = "https://github.com/vhrdtech/ww_base", default-features = false }
ww_numeric = { version = "0.3.0", git = "https://github.com/vhrdtech/ww_base", default-features = false }
ww_si = { version = "0.5.0", git = "https://github.com/vhrdtech/ww_base", default-features = false }
ww_version = { version = "0.2.0", git = "https://github.com/vhrdtech/ww_base", default-features = false }

# framework crates, versioned together via [workspace.package] version
wire_weaver = { version = "0.6.0", path = "./wire_weaver", default-features = false }
wire_weaver_client = { version = "0.6.0", path = "./wire_weaver_client", default-features = false }
wire_weaver_core = { version = "0.6.0", path = "./wire_weaver_core" }
wire_weaver_derive = { version = "0.6.0", path = "./wire_weaver_derive" }
wire_weaver_evolution = { version = "0.6.0", path = "./wire_weaver_evolution", default-features = false }
wire_weaver_py = { version = "0.6.0", path = "./wire_weaver_py" }
wire_weaver_server = { version = "0.6.0", path = "./wire_weaver_server" }
ww_api = { version = "0.6.0", path = "./ww_api", default-features = false }
ww_book = { version = "0.6.0", path = "./ww_book" }
ww_byte_stream = { version = "0.6.0", path = "./ww_byte_stream" }
ww_calloop = { version = "0.6.0", path = "./ww_calloop" }
ww_clock_sync = { version = "0.6.0", path = "./ww_clock_sync" }
ww_device = { version = "0.6.0", path = "./ww_device" }
ww_dns_sd = { version = "0.6.0", path = "./ww_dns_sd", default-features = false }
ww_framer = { version = "0.6.0", path = "./ww_framer", default-features = false }
ww_hub = { version = "0.6.0", path = "./ww_hub" }
ww_link = { version = "0.6.0", path = "./ww_link", default-features = false }
ww_local_socket = { version = "0.6.0", path = "./ww_local_socket", default-features = false }
# Its own repo since CLT-21; a registry version once picoboot_host is on crates.io.
ww_picoboot = { package = "picoboot_host", version = "0.1.0", git = "https://github.com/vhrdtech/picoboot_host", tag = "v0.1.0", default-features = false }
ww_settings = { version = "0.6.0", path = "./ww_settings/ww_settings" }
ww_settings_derive = { version = "0.6.0", path = "./ww_settings/ww_settings_derive" }
ww_snapshots = { version = "0.6.0", path = "./ww_snapshots" }
# CLT-34: a crate of its own like picoboot_host, to move to its own repo.
ww_stm32_dfu = { package = "stm32_dfu_host", version = "0.1.0", path = "./stm32_dfu_host", default-features = false }
ww_stream = { version = "0.6.0", path = "./ww_stream", default-features = false }

# framework-level base types, each crate has its own version
ww_client_server = { version = "0.2.0", path = "./ww_client_server", default-features = false }
ww_hub_api = { version = "0.1.0", path = "./ww_hub_api", default-features = false }
ww_json = { version = "0.1.0", path = "./ww_json" }
ww_lz4 = { version = "0.1.0", path = "./ww_lz4" }
ww_plugin = { version = "0.1.0", path = "./ww_plugin" }
ww_quantity = { version = "0.1.0", path = "./ww_quantity" }
ww_self = { version = "0.3.0", path = "./ww_self" }
ww_tap = { version = "0.1.0", path = "./ww_tap", default-features = false }
ww_timebase = { version = "0.1.0", path = "./ww_timebase", default-features = false }
ww_trace_context = { version = "0.1.0", path = "./ww_trace_context", default-features = false }

# examples and tests, not published
args_evolution_api = { version = "0.1.0", path = "./tests/args_evolution_api" }
array_of_streams_api = { version = "0.1.0", path = "./tests/array_of_streams_api" }
blinky = { version = "0.1.0", path = "./examples/blinky" }
blinky_api = { version = "0.1.0", path = "./examples/blinky_api" }
