ww_counters = { version = "0.1.0", path = "./ww_stdlib/ww_counters", default-features = false }
ww_date_time = { version = "0.1.0", path = "./ww_stdlib/ww_date_time", default-features = false }
ww_dfu = { version = "0.1.0", path = "./ww_stdlib/ww_dfu", default-features = false }
ww_error = { version = "0.1.0", path = "./ww_stdlib/ww_error", default-features = false }
ww_firmware_info = { version = "0.1.0", path = "./ww_stdlib/ww_firmware_info", default-features = false }
ww_gpio = { version = "0.1.0", path = "./ww_stdlib/ww_gpio", default-features = false }
ww_gpio_hl = { version = "0.1.0", path = "./ww_stdlib/ww_gpio_hl" }
ww_i2c = { version = "0.1.0", path = "./ww_stdlib/ww_i2c", default-features = false }
ww_indication = { version = "0.1.0", path = "./ww_stdlib/ww_indication", default-features = false }
ww_interned = { version = "0.1.0", path = "./ww_stdlib/ww_interned", default-features = false }
ww_log = { version = "0.1.0", path = "./ww_stdlib/ww_log", default-features = false }
ww_logic_analyzer = { version = "0.1.0", path = "./ww_stdlib/ww_logic_analyzer", default-features = false }
ww_memory = { version = "0.1.0", path = "./ww_stdlib/ww_memory", default-features = false }
ww_numeric = { version = "0.2.0", path = "./ww_stdlib/ww_numeric", default-features = false }
ww_onewire = { version = "0.1.0", path = "./ww_stdlib/ww_onewire", default-features = false }
ww_pin_diag = { version = "0.1.0", path = "./ww_stdlib/ww_pin_diag", default-features = false }
ww_pwm = { version = "0.1.0", path = "./ww_stdlib/ww_pwm", default-features = false }
ww_recorder = { version = "0.1.0", path = "./ww_stdlib/ww_recorder", default-features = false }
ww_sd = { version = "0.1.0", path = "./ww_stdlib/ww_sd", default-features = false }
ww_si = { version = "0.2.0", path = "./ww_stdlib/ww_si", default-features = false }
ww_signal_generator = { version = "0.1.0", path = "./ww_stdlib/ww_signal_generator", default-features = false }
ww_spi = { version = "0.1.0", path = "./ww_stdlib/ww_spi", default-features = false }
ww_timebase = { version = "0.1.0", path = "./ww_stdlib/ww_timebase", default-features = false }
ww_uart = { version = "0.1.0", path = "./ww_stdlib/ww_uart", default-features = false }
ww_uid = { version = "0.1.0", path = "./ww_stdlib/ww_uid", default-features = false }
ww_user_info = { version = "0.1.0", path = "./ww_stdlib/ww_user_info", default-features = false }
ww_version = { version = "0.2.0", path = "./ww_stdlib/ww_version", default-features = false }

# examples and tests, not published
all_gpio_api = { version = "0.1.0", path = "./examples/all_gpio_api" }
