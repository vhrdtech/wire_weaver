
[workspace]
resolver = "3"
members = [
    #    "wire_weaver_tool",
    "examples/*",
    "shrink_wrap/*",
    "tests/*",
    "wire_weaver",
    "wire_weaver_cli",
    "wire_weaver_client",
    "wire_weaver_core",
    "wire_weaver_derive",
    "wire_weaver_py",
    "wire_weaver_snapshots",
    "ww_defmt_logger",
    "ww_device",
    "ww_framer",
    "ww_global",
    "ww_link",
    "ww_self",
    "ww_stdlib/*",
    "ww_stream",
]

exclude = ["examples_mcu", "fuzz", "wire_weaver_tool"]

[workspace.package]
version = "0.5.0"
authors = ["Roman Isaikin <romix.lab@gmail.com>"]
description = "WireWeaver is a wire format and API code generator for resource constrained systems."
edition = "2024"
repository = "https://github.com/vhrdtech/wire_weaver"
license = "MIT"

[workspace.dependencies]
anyhow = "1"
cc = "1.2"
clap = "4.5"
cnt = "0.4"
# The cnt repo next to this one (~/git/cnt): word sources and terminal views of cnt 0.5, not on crates.io yet
cnt_core = { version = "0.4.1", path = "../cnt/cnt_core" }
cnt_view = { version = "0.4.1", path = "../cnt/cnt_view" }
console = "0.16"
convert_case = "0.11"
defmt = "1.1"
defmt-decoder = "1.1"
hex = { version = "0.4", default-features = false }
hex-literal = "1"
nusb = { version = "0.2", features = ["tokio"] }
proc-macro2 = "1.0"
proptest = "1.11"
pyo3 = "0.29"
quote = "1.0"
relative-path = "2.0"
ron = "0.12"
semver = "1.0"
serde = { version = "1.0", default-features = false, features = ["derive"] }
serde_json = "1.0"
sha2 = "0.11"
strum = "0.28"
strum_macros = "0.28"
syn = { version = "3", features = ["full", "extra-traits"] }
thiserror = "2"
tokio = "1"
tracing-subscriber = "0.3"

# framework crates, versioned together via [workspace.package] version (shrink_wrap* have their own)
shrink_wrap = { version = "0.2.0", path = "./shrink_wrap/shrink_wrap", default-features = false }
shrink_wrap_derive = { version = "0.2.0", path = "./shrink_wrap/shrink_wrap_derive" }
wire_weaver = { version = "0.5.0", path = "./wire_weaver", default-features = false }
wire_weaver_client = { version = "0.5.0", path = "./wire_weaver_client" }
wire_weaver_core = { version = "0.5.0", path = "./wire_weaver_core" }
wire_weaver_derive = { version = "0.5.0", path = "./wire_weaver_derive" }
wire_weaver_snapshots = { version = "0.5.0", path = "./wire_weaver_snapshots" }
ww_defmt_logger = { version = "0.5.0", path = "./ww_defmt_logger" }
ww_device = { version = "0.5.0", path = "./ww_device" }
ww_framer = { version = "0.5.0", path = "./ww_framer", default-features = false }
ww_link = { version = "0.5.0", path = "./ww_link", default-features = false }
# Its own repo since CLT-21; a registry version once picoboot_host is on crates.io.
ww_picoboot = { package = "picoboot_host", git = "https://github.com/vhrdtech/picoboot_host", branch = "main", default-features = false }
ww_stream = { version = "0.5.0", path = "./ww_stream", default-features = false }

# framework-level base types, each crate has its own version
ww_global = { version = "0.2.0", path = "./ww_global" }
ww_self = { version = "0.2.0", path = "./ww_self" }

# ww_stdlib, each crate has its own version
ww_adc = { version = "0.1.0", path = "./ww_stdlib/ww_adc", default-features = false }
ww_board_info = { version = "0.1.0", path = "./ww_stdlib/ww_board_info", default-features = false }
ww_client_server = { version = "0.2.0", path = "./ww_stdlib/ww_client_server", default-features = false }
ww_counters = { version = "0.1.0", path = "./ww_stdlib/ww_counters", default-features = false }
ww_date_time = { version = "0.1.0", path = "./ww_stdlib/ww_date_time", default-features = false }
ww_dfu = { version = "0.1.0", path = "./ww_stdlib/ww_dfu", default-features = false }
ww_error = { version = "0.1.0", path = "./ww_stdlib/ww_error", default-features = false }
ww_firmware_info = { version = "0.1.0", path = "./ww_stdlib/ww_firmware_info", default-features = false }
ww_gpio = { version = "0.1.0", path = "./ww_stdlib/ww_gpio", default-features = false }
ww_gpio_hl = { version = "0.1.0", path = "./ww_stdlib/ww_gpio_hl" }
ww_i2c = { version = "0.1.0", path = "./ww_stdlib/ww_i2c", default-features = false }
ww_log = { version = "0.1.0", path = "./ww_stdlib/ww_log", default-features = false }
ww_logic_analyzer = { version = "0.1.0", path = "./ww_stdlib/ww_logic_analyzer", default-features = false }
ww_memory = { version = "0.1.0", path = "./ww_stdlib/ww_memory", default-features = false }
ww_numeric = { version = "0.2.0", path = "./ww_stdlib/ww_numeric", default-features = false }
ww_onewire = { version = "0.1.0", path = "./ww_stdlib/ww_onewire", default-features = false }
ww_pwm = { version = "0.1.0", path = "./ww_stdlib/ww_pwm", default-features = false }
ww_si = { version = "0.1.0", path = "./ww_stdlib/ww_si", default-features = false }
ww_signal_generator = { version = "0.1.0", path = "./ww_stdlib/ww_signal_generator", default-features = false }
ww_spi = { version = "0.1.0", path = "./ww_stdlib/ww_spi", default-features = false }
ww_timebase = { version = "0.1.0", path = "./ww_stdlib/ww_timebase", default-features = false }
ww_uart = { version = "0.1.0", path = "./ww_stdlib/ww_uart", default-features = false }
ww_uid = { version = "0.1.0", path = "./ww_stdlib/ww_uid", default-features = false }
ww_user_info = { version = "0.1.0", path = "./ww_stdlib/ww_user_info", default-features = false }
ww_version = { version = "0.2.0", path = "./ww_stdlib/ww_version", default-features = false }

# examples and tests, not published
all_gpio_api = { version = "0.1.0", path = "./examples/all_gpio_api" }
array_of_streams_api = { version = "0.1.0", path = "./tests/array_of_streams_api" }
blinky = { version = "0.1.0", path = "./examples/blinky" }
blinky_api = { version = "0.1.0", path = "./examples/blinky_api" }
blinky_api_evolved = { version = "0.1.1", path = "./examples/blinky_api_evolved" }
board_info_api = { version = "0.1.0", path = "./tests/board_info_api" }
bounded_api = { version = "0.1.0", path = "./tests/bounded_api" }
common_error_api = { version = "0.1.0", path = "./tests/common_error_api" }
counters_api = { version = "0.1.0", path = "./tests/counters_api" }
consts_api = { version = "0.1.0", path = "./tests/consts_api" }
credit_sink_api = { version = "0.1.0", path = "./tests/credit_sink_api" }
cross_version_api = { version = "0.4.0", path = "./tests/cross_version_api" }
cross_version_old_api = { version = "0.3.0", path = "./tests/cross_version_old_api" }
defmt_log_api = { version = "0.1.0", path = "./examples/defmt_log_api", default-features = false }
dfu_api = { version = "0.1.0", path = "./tests/dfu_api" }
dfu_app_api = { version = "0.1.0", path = "./tests/dfu_app_api" }
dfu_lean_app_api = { version = "0.1.0", path = "./tests/dfu_lean_app_api" }
dfu_updater_api = { version = "0.1.0", path = "./tests/dfu_updater_api" }
dynamic_api = { version = "0.1.0", path = "./tests/dynamic_api" }
firmware_info_api = { version = "0.1.0", path = "./tests/firmware_info_api" }
io_adc_api = { version = "0.1.0", path = "./tests/io_adc_api" }
io_gpio_api = { version = "0.1.0", path = "./tests/io_gpio_api" }
io_i2c_api = { version = "0.1.0", path = "./tests/io_i2c_api" }
io_onewire_api = { version = "0.1.0", path = "./tests/io_onewire_api" }
io_pwm_api = { version = "0.1.0", path = "./tests/io_pwm_api" }
io_spi_api = { version = "0.1.0", path = "./tests/io_spi_api" }
io_timebase_api = { version = "0.1.0", path = "./tests/io_timebase_api" }
io_uart_api = { version = "0.1.0", path = "./tests/io_uart_api" }
log_defmt_api = { version = "0.1.0", path = "./tests/log_defmt_api" }
methods_api = { version = "0.1.0", path = "./tests/methods_api" }
properties_api = { version = "0.1.0", path = "./tests/properties_api" }
series_api = { version = "0.1.0", path = "./tests/series_api" }
streams_api = { version = "0.1.0", path = "./tests/streams_api" }
streams_borrowed_error_api = { version = "0.1.0", path = "./tests/streams_borrowed_error_api" }
streams_reliable_api = { version = "0.1.0", path = "./tests/streams_reliable_api" }
tests_common = { version = "0.1.0", path = "./tests/tests_common" }
traits_api = { version = "0.1.0", path = "./tests/traits_api" }
uart_api = { version = "0.1.0", path = "./examples/uart_api" }
uid_api = { version = "0.1.0", path = "./tests/uid_api" }
user_info_api = { version = "0.1.0", path = "./tests/user_info_api" }

[patch.crates-io]
wire_weaver = { path = "./wire_weaver" }
wire_weaver_core = { path = "./wire_weaver_core" }
