# [patch."https://github.com/romixlab/shrink_wrap"]
# shrink_wrap = { path = "../shrink_wrap/shrink_wrap" }
# shrink_wrap_derive = { path = "../shrink_wrap/shrink_wrap_derive" }

[patch.crates-io]
wire_weaver = { path = "./wire_weaver" }
wire_weaver_core = { path = "./wire_weaver_core" }

[profile.deploy]
inherits = "release"
incremental = true

[profile.dev]
debug = false
