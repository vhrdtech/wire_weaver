
[workspace]
resolver = "3"
members = [
    #    "wire_weaver_tool",
    "examples/*",
    "shrink_wrap/*",
    "stm32_dfu_host",
    "tests/*",
    "wire_weaver",
    "wire_weaver_cli",
    "wire_weaver_client",
    "wire_weaver_core",
    "wire_weaver_derive",
    "wire_weaver_py",
    "wire_weaver_snapshots",
    "ww_bus_slave",
    "ww_clock_sync",
    "ww_defmt_logger",
    "ww_device",
    "ww_framer",
    "ww_global",
    "ww_hub",
    "ww_hub_api",
    "ww_link",
    "ww_local_socket",
    "ww_lz4",
    "ww_pin_probe",
    "ww_report",
    "ww_self",
    "ww_settings/*",
    "ww_stdlib/*",
    "ww_stream",
    "ww_tap",
    "ww_tape",
]

exclude = ["examples/compare_wire_formats", "examples_mcu", "fuzz", "wire_weaver_tool"]

[workspace.package]
version = "0.5.0"
authors = ["Roman Isaikin <romix.lab@gmail.com>"]
description = "WireWeaver is a wire format and API code generator for resource constrained systems."
edition = "2024"
repository = "https://github.com/vhrdtech/wire_weaver"
license = "MIT"

[workspace.dependencies]
anyhow = "1"
atomic-waker = { version = "1.1", features = ["portable-atomic"] }
cc = "1.2"
clap = "4.5"
clap_complete = "4.6"
cnt = "0.4"
cnt_core = "0.5"
cnt_view = "0.5"
console = "0.16"
convert_case = "0.11"
crc = "3.4"
defmt = "1.1"
defmt-decoder = "1.1"
embassy-futures = "0.1"
embedded-storage-async = "0.4.2"
hex = { version = "0.4", default-features = false }
hex-literal = "1"
interprocess = { version = "2.4", features = ["tokio"] }
libc = "0.2"
lz4_flex = { version = "0.14", default-features = false, features = ["safe-decode", "checked-decode"] }
nusb = { version = "0.2", features = ["tokio"] }
portable-atomic = { version = "1.15", default-features = false, features = ["require-cas"] }
proc-macro2 = "1.0"
proptest = "1.11"
pyo3 = "0.29"
quote = "1.0"
ron = "0.12"
semver = "1.0"
serde = { version = "1.0", default-features = false, features = ["derive"] }
serde_json = "1.0"
sha2 = "0.11"
strum = "0.28"
strum_macros = "0.28"
syn = { version = "3", features = ["full", "extra-traits"] }
thiserror = "2"
tokio = "1.54" # interprocess 2.4 calls AsyncFd::register_with_interest, new in 1.54 (it declares 1.36)
toml = "1"
toml_edit = "0.25"
tracing-subscriber = "0.3"
widestring = "1"
windows-sys = "0.61"

# framework crates, versioned together via [workspace.package] version (shrink_wrap* have their own)
shrink_wrap = { version = "0.2.0", path = "./shrink_wrap/shrink_wrap", default-features = false }
shrink_wrap_derive = { version = "0.2.0", path = "./shrink_wrap/shrink_wrap_derive" }
wire_weaver = { version = "0.5.0", path = "./wire_weaver", default-features = false }
wire_weaver_client = { version = "0.5.0", path = "./wire_weaver_client" }
wire_weaver_core = { version = "0.5.0", path = "./wire_weaver_core" }
wire_weaver_derive = { version = "0.5.0", path = "./wire_weaver_derive" }
wire_weaver_snapshots = { version = "0.5.0", path = "./wire_weaver_snapshots" }
ww_bus_slave = { version = "0.5.0", path = "./ww_bus_slave" }
ww_clock_sync = { version = "0.5.0", path = "./ww_clock_sync" }
ww_defmt_logger = { version = "0.5.0", path = "./ww_defmt_logger" }
ww_device = { version = "0.5.0", path = "./ww_device" }
ww_framer = { version = "0.5.0", path = "./ww_framer", default-features = false }
ww_hub = { version = "0.5.0", path = "./ww_hub" }
ww_link = { version = "0.5.0", path = "./ww_link", default-features = false }
ww_local_socket = { version = "0.5.0", path = "./ww_local_socket", default-features = false }
# Its own repo since CLT-21; a registry version once picoboot_host is on crates.io.
ww_picoboot = { package = "picoboot_host", git = "https://github.com/vhrdtech/picoboot_host", tag = "v0.1.0", default-features = false }
ww_pin_probe = { version = "0.5.0", path = "./ww_pin_probe" }
ww_report = { version = "0.5.0", path = "./ww_report" }
ww_settings = { version = "0.5.0", path = "./ww_settings/ww_settings" }
ww_settings_derive = { version = "0.5.0", path = "./ww_settings/ww_settings_derive" }
# CLT-34: a crate of its own like picoboot_host, to move to its own repo.
ww_stm32_dfu = { package = "stm32_dfu_host", version = "0.1.0", path = "./stm32_dfu_host", default-features = false }
ww_stream = { version = "0.5.0", path = "./ww_stream", default-features = false }

# framework-level base types, each crate has its own version
ww_global = { version = "0.2.0", path = "./ww_global" }
ww_hub_api = { version = "0.1.0", path = "./ww_hub_api", default-features = false }
ww_lz4 = { version = "0.1.0", path = "./ww_lz4" }
ww_self = { version = "0.3.0", path = "./ww_self" }
ww_tap = { version = "0.1.0", path = "./ww_tap", default-features = false }
ww_tape = { version = "0.1.0", path = "./ww_tape", default-features = false }

# ww_stdlib, each crate has its own version
ww_adc = { version = "0.1.0", path = "./ww_stdlib/ww_adc", default-features = false }
ww_block = { version = "0.1.0", path = "./ww_stdlib/ww_block", default-features = false }
ww_board_info = { version = "0.3.0", path = "./ww_stdlib/ww_board_info", default-features = false }
