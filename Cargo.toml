# to develop exact_units or shrink_wrap side by side, checkouts next to this one (in .cargo/config.toml):
# [patch."https://github.com/romixlab/exact_units"]
# exact_units = { path = "../exact_units" }
# [patch."https://github.com/romixlab/shrink_wrap"]
# shrink_wrap = { path = "../shrink_wrap/shrink_wrap" }
# shrink_wrap_derive = { path = "../shrink_wrap/shrink_wrap_derive" }

[patch.crates-io]
wire_weaver = { path = "./wire_weaver" }
wire_weaver_core = { path = "./wire_weaver_core" }

[profile.deploy]
inherits = "release"
incremental = true
