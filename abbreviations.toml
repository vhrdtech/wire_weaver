# The book's abbreviations, one long form per key, read by vhrd_zensical.abbreviations: every use of a key in a
# page's prose shows its long form on hover, so prose writes the abbreviation alone. Abbreviations every reader knows
# (API, CPU, USB, JSON, ...) stay plain and are not listed. Feature ids (SW-3, EVO-12) are not abbreviations: an area
# whose name is also an id prefix stays out of this file.
ADC = "analog-to-digital converter"
ALP = "Adaptive Lossless floating-Point compression"
CAN = "Controller Area Network"
CRC = "cyclic redundancy check"
DAC = "digital-to-analog converter"
DFU = "device firmware update"
DMA = "direct memory access"
DWT = "Data Watchpoint and Trace unit"
ECC = "error-correcting code"
ELF = "Executable and Linkable Format"
FIFO = "first in, first out"
FOC = "field-oriented control"
GPIO = "general-purpose input and output"
GUI = "graphical user interface"
I2C = "Inter-Integrated Circuit bus"
LAN = "local area network"
LSB = "least significant bit"
LTO = "link-time optimization"
MCU = "microcontroller unit"
MSB = "most significant bit"
MTU = "maximum transmission unit"
NOR = "NOR flash memory"
OTA = "over-the-air update"
PHY = "physical-layer transceiver"
PWM = "pulse-width modulation"
RISC = "reduced instruction set computer"
ROM = "read-only memory"
RPC = "remote procedure call"
RTT = "Real-Time Transfer, SEGGER's debug-probe channel"
RX = "receive"
SD = "Secure Digital card"
SHA = "Secure Hash Algorithm"
SPI = "Serial Peripheral Interface"
TX = "transmit"
UART = "universal asynchronous receiver-transmitter"
ULPI = "UTMI+ Low Pin Interface"
