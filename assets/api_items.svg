<svg xmlns="http://www.w3.org/2000/svg" width="720" height="300" viewBox="0 0 720 300" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <title>The four kinds of items of an API trait</title>
  <desc>Four rows between a host and a device. A method: a request goes to the device and a reply comes back. A property: the host reads it, getting the value back, or writes it. A stream: values go from the device to the host, one after another. A sink: values go from the host to the device.</desc>
  <defs>
    <marker id="ai-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f5f99"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="720" height="300" rx="10" fill="#ffffff"/>

  <rect x="150" y="20" width="110" height="266" rx="8" fill="#eef2f7" stroke="#222"/>
  <text x="205" y="44" text-anchor="middle" font-weight="bold" fill="#222">Host</text>
  <rect x="560" y="20" width="110" height="266" rx="8" fill="#eef2f7" stroke="#222"/>
  <text x="615" y="44" text-anchor="middle" font-weight="bold" fill="#222">Device</text>

  <g font-weight="bold" fill="#222">
    <text x="20" y="90">method</text>
    <text x="20" y="150">property</text>
    <text x="20" y="210">stream</text>
    <text x="20" y="262">sink</text>
  </g>

  <!-- method -->
  <line x1="262" y1="78" x2="556" y2="78" stroke="#1f5f99" stroke-width="2" marker-end="url(#ai-arrow)"/>
  <text x="410" y="72" text-anchor="middle" fill="#1f5f99" font-family="monospace">set_led(true)</text>
  <line x1="558" y1="98" x2="264" y2="98" stroke="#1f5f99" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#ai-arrow)"/>
  <text x="410" y="114" text-anchor="middle" fill="#1f5f99" font-family="monospace">false</text>

  <!-- property -->
  <line x1="262" y1="146" x2="556" y2="146" stroke="#1f5f99" stroke-width="2" marker-end="url(#ai-arrow)"/>
  <text x="410" y="140" text-anchor="middle" fill="#1f5f99">read or write gain</text>
  <line x1="558" y1="160" x2="264" y2="160" stroke="#1f5f99" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#ai-arrow)"/>
  <text x="410" y="176" text-anchor="middle" fill="#1f5f99">the value, or OK</text>

  <!-- stream -->
  <g stroke="#1f5f99" stroke-width="2">
    <line x1="558" y1="206" x2="480" y2="206" marker-end="url(#ai-arrow)"/>
    <line x1="458" y1="206" x2="380" y2="206" marker-end="url(#ai-arrow)"/>
    <line x1="358" y1="206" x2="264" y2="206" marker-end="url(#ai-arrow)"/>
  </g>
  <text x="410" y="226" text-anchor="middle" fill="#1f5f99">readings, one after another</text>

  <!-- sink -->
  <g stroke="#1f5f99" stroke-width="2">
    <line x1="262" y1="258" x2="340" y2="258" marker-end="url(#ai-arrow)"/>
    <line x1="362" y1="258" x2="440" y2="258" marker-end="url(#ai-arrow)"/>
    <line x1="462" y1="258" x2="556" y2="258" marker-end="url(#ai-arrow)"/>
  </g>
  <text x="410" y="278" text-anchor="middle" fill="#1f5f99">commands, one after another</text>
</svg>
