<svg xmlns="http://www.w3.org/2000/svg" width="720" height="330" viewBox="0 0 720 330" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <title>The crates of the blinky example</title>
  <desc>blinky_api holds the trait. blinky_device depends on it and holds the server and handlers; it runs in the simulated device on the PC with a printed LED and in the Nucleo firmware with the pin PA5. blinky depends on blinky_api and holds the host client; host programs use it. Host and device talk over WebSocket on the PC and over USB with the board.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#222"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="720" height="330" rx="10" fill="#ffffff"/>

  <!-- the API crate -->
  <rect x="270" y="20" width="180" height="54" rx="6" fill="#fdf3e1" stroke="#222"/>
  <g text-anchor="middle" fill="#222">
    <text x="360" y="42" font-weight="bold">blinky_api</text>
    <text x="360" y="62">the API trait</text>
  </g>

  <!-- device and host crates -->
  <rect x="60" y="120" width="220" height="54" rx="6" fill="#eef2f7" stroke="#222"/>
  <rect x="440" y="120" width="220" height="54" rx="6" fill="#eef2f7" stroke="#222"/>
  <g text-anchor="middle" fill="#222">
    <text x="170" y="142" font-weight="bold">blinky_device</text>
    <text x="170" y="162">server, handlers, serve()</text>
    <text x="550" y="142" font-weight="bold">blinky</text>
    <text x="550" y="162">client, simulated()</text>
  </g>
  <g stroke="#222" fill="none">
    <line x1="170" y1="120" x2="300" y2="77" marker-end="url(#arrow)"/>
    <line x1="550" y1="120" x2="420" y2="77" marker-end="url(#arrow)"/>
  </g>
  <g fill="#555" font-size="12">
    <text x="200" y="96">depends on</text>
    <text x="462" y="96">depends on</text>
  </g>

  <!-- where the device code runs -->
  <rect x="20" y="230" width="150" height="70" rx="6" fill="#ffffff" stroke="#222" stroke-dasharray="5 3"/>
  <rect x="190" y="230" width="150" height="70" rx="6" fill="#ffffff" stroke="#222" stroke-dasharray="5 3"/>
  <rect x="470" y="230" width="190" height="70" rx="6" fill="#ffffff" stroke="#222" stroke-dasharray="5 3"/>
  <g text-anchor="middle" fill="#222">
    <text x="95" y="254" font-weight="bold">blinky_sim</text>
    <text x="95" y="272">on the PC</text>
    <text x="95" y="290">LED: a printed line</text>
    <text x="265" y="254" font-weight="bold">usb_blinky</text>
    <text x="265" y="272">on the Nucleo</text>
    <text x="265" y="290">LED: pin PA5</text>
    <text x="565" y="254" font-weight="bold">blinky_host</text>
    <text x="565" y="272">your host program</text>
    <text x="565" y="290">ww, Python</text>
  </g>
  <g stroke="#222" fill="none">
    <line x1="140" y1="174" x2="100" y2="227" marker-end="url(#arrow)"/>
    <line x1="200" y1="174" x2="250" y2="227" marker-end="url(#arrow)"/>
    <line x1="550" y1="174" x2="560" y2="227" marker-end="url(#arrow)"/>
  </g>
  <g fill="#555" font-size="12">
    <text x="64" y="206">runs in</text>
    <text x="232" y="206">runs in</text>
    <text x="562" y="206">used by</text>
  </g>

  <!-- the link -->
  <line x1="343" y1="265" x2="466" y2="265" stroke="#2e6db0" stroke-width="2" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <g text-anchor="middle" fill="#2e6db0" font-size="12">
    <text x="405" y="254">WebSocket or USB</text>
    <text x="405" y="284">requests, replies</text>
  </g>
</svg>
