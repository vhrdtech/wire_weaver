<svg xmlns="http://www.w3.org/2000/svg" width="720" height="260" viewBox="0 0 720 260" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <title>Where the code and outputs of a page come from</title>
  <desc>A compiled source with marked sections is included into a page with a snippet line. A golden test runs the example and writes its output into docs/generated, which the page includes the same way. The docs build fails on a missing section, just test fails on a stale output, and just book-check fails on a bare code fence or an output that no page includes.</desc>
  <defs>
    <marker id="bs-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f5f99"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="720" height="260" rx="10" fill="#ffffff"/>

  <g text-anchor="middle">
    <rect x="30" y="30" width="220" height="60" rx="8" fill="#eef2f7" stroke="#222"/>
    <text x="140" y="55" font-weight="bold" fill="#222">compiled source</text>
    <text x="140" y="75" fill="#555" font-family="monospace" font-size="12">// --8&lt;-- [start:NAME]</text>

    <rect x="30" y="150" width="220" height="60" rx="8" fill="#eef2f7" stroke="#222"/>
    <text x="140" y="175" font-weight="bold" fill="#222">golden test</text>
    <text x="140" y="195" fill="#555" font-family="monospace" font-size="12">book_outputs::check</text>

    <rect x="290" y="150" width="170" height="60" rx="8" fill="#eef2f7" stroke="#222"/>
    <text x="375" y="175" font-weight="bold" fill="#222">docs/generated/</text>
    <text x="375" y="195" fill="#555" font-size="12">transcripts, bytes, figures</text>

    <rect x="510" y="80" width="180" height="70" rx="8" fill="#fbeee6" stroke="#b03a2e"/>
    <text x="600" y="108" font-weight="bold" fill="#b03a2e">page</text>
    <text x="600" y="128" fill="#555" font-family="monospace" font-size="12">--8&lt;-- "path:NAME"</text>
  </g>

  <path d="M250,60 L505,105" fill="none" stroke="#1f5f99" stroke-width="2" marker-end="url(#bs-arrow)"/>
  <text x="380" y="70" text-anchor="middle" fill="#1f5f99" font-size="12">included section</text>
  <line x1="250" y1="180" x2="286" y2="180" stroke="#1f5f99" stroke-width="2" marker-end="url(#bs-arrow)"/>
  <path d="M460,170 L505,135" fill="none" stroke="#1f5f99" stroke-width="2" marker-end="url(#bs-arrow)"/>
  <text x="150" y="125" fill="#1f5f99" font-size="12">runs the example</text>
  <line x1="140" y1="92" x2="140" y2="146" stroke="#1f5f99" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#bs-arrow)"/>

  <text x="30" y="242" fill="#222" font-size="12">A missing section fails the build; a stale output fails just test; a bare fence or an unused output fails just book-check.</text>
</svg>
