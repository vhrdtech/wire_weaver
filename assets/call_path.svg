<svg xmlns="http://www.w3.org/2000/svg" width="720" height="360" viewBox="0 0 720 360" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <title>The path of a call of set_led(true)</title>
  <desc>Four lanes: the host program, the generated client, the device's generated server, and the handler. The host calls set_led(true); the client encodes the argument and the method's number into a request; the transport carries it; the server decodes the argument and calls set_led with on = true; the handler returns false; the server encodes a reply; the client decodes it and returns false.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#222"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="720" height="360" rx="10" fill="#ffffff"/>

  <!-- host and device halves -->
  <rect x="20" y="14" width="330" height="330" rx="8" fill="#f6f8fb"/>
  <rect x="370" y="14" width="330" height="330" rx="8" fill="#fbf6ee"/>
  <g fill="#555" font-size="12" text-anchor="middle">
    <text x="185" y="334">host: your program and the generated client</text>
    <text x="535" y="334">device: the generated server and your handler</text>
  </g>

  <!-- lanes -->
  <g text-anchor="middle" font-weight="bold" fill="#222">
    <rect x="40" y="28" width="130" height="30" rx="6" fill="#eef2f7" stroke="#222"/>
    <text x="105" y="48">Host program</text>
    <rect x="200" y="28" width="130" height="30" rx="6" fill="#eef2f7" stroke="#222"/>
    <text x="265" y="48">Client</text>
    <rect x="390" y="28" width="130" height="30" rx="6" fill="#eef2f7" stroke="#222"/>
    <text x="455" y="48">Server</text>
    <rect x="550" y="28" width="130" height="30" rx="6" fill="#fdf3e1" stroke="#222"/>
    <text x="615" y="48">Handler</text>
  </g>
  <g stroke="#999" stroke-dasharray="4 4">
    <line x1="105" y1="58" x2="105" y2="310"/>
    <line x1="265" y1="58" x2="265" y2="310"/>
    <line x1="455" y1="58" x2="455" y2="310"/>
    <line x1="615" y1="58" x2="615" y2="310"/>
  </g>

  <!-- request -->
  <g stroke="#222" fill="none">
    <line x1="105" y1="90" x2="261" y2="90" marker-end="url(#arrow)"/>
    <line x1="265" y1="130" x2="451" y2="130" marker-end="url(#arrow)" stroke="#2e6db0" stroke-width="2"/>
    <line x1="455" y1="170" x2="611" y2="170" marker-end="url(#arrow)"/>
  </g>
  <g fill="#222">
    <text x="185" y="84" text-anchor="middle">set_led(true)</text>
    <text x="360" y="121" text-anchor="middle" fill="#2e6db0">request: method 2, on = true</text>
    <text x="535" y="164" text-anchor="middle">set_led(cx, true)</text>
  </g>
  <g fill="#555" font-size="12">
    <text x="272" y="108">1. encode</text>
    <text x="366" y="148">2. transport</text>
    <text x="462" y="188">3. decode, dispatch</text>
  </g>

  <!-- reply -->
  <g stroke="#222" fill="none" stroke-dasharray="6 4">
    <line x1="615" y1="215" x2="459" y2="215" marker-end="url(#arrow)"/>
    <line x1="455" y1="255" x2="269" y2="255" marker-end="url(#arrow)" stroke="#2e6db0" stroke-width="2"/>
    <line x1="265" y1="295" x2="109" y2="295" marker-end="url(#arrow)"/>
  </g>
  <g fill="#222">
    <text x="535" y="209" text-anchor="middle">Ready(false)</text>
    <text x="360" y="249" text-anchor="middle" fill="#2e6db0">reply: false</text>
    <text x="185" y="289" text-anchor="middle">Ok(false)</text>
  </g>
  <g fill="#555" font-size="12">
    <text x="560" y="233">4. the handler runs</text>
    <text x="366" y="273">5. encode, transport</text>
    <text x="150" y="313">6. decode</text>
  </g>
</svg>
