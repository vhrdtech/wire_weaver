<svg xmlns="http://www.w3.org/2000/svg" width="720" height="300" viewBox="0 0 720 300" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <title>How ww learns a device's API</title>
  <desc>ww connects to the device. The device has its API description built in by ww_codegen with introspect. It sends the description once per API; ww keeps it in a cache in ~/.wire_weaver, keyed by the API's hash. ww prints the API tree from the description and encodes calls with it, which the device answers.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#222"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="720" height="300" rx="10" fill="#ffffff"/>

  <!-- ww -->
  <rect x="30" y="40" width="230" height="200" rx="8" fill="#eef2f7" stroke="#222"/>
  <text x="145" y="64" text-anchor="middle" font-weight="bold" fill="#222">ww or Python</text>
  <rect x="50" y="80" width="190" height="34" rx="6" fill="#ffffff" stroke="#222"/>
  <text x="145" y="102" text-anchor="middle" fill="#222">API description</text>
  <g fill="#222" font-size="12">
    <text x="50" y="146">prints the tree:  ww introspect</text>
    <text x="50" y="168">encodes calls:    ww call</text>
    <text x="50" y="190">checks arguments before sending</text>
  </g>

  <!-- cache -->
  <rect x="50" y="252" width="190" height="34" rx="6" fill="#ffffff" stroke="#222" stroke-dasharray="5 3"/>
  <text x="145" y="274" text-anchor="middle" fill="#222" font-size="12">cache: ~/.wire_weaver/</text>
  <path d="M 50 97 C 10 97, 10 269, 46 269" fill="none" stroke="#222" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
  <text x="14" y="190" font-size="12" fill="#555" transform="rotate(-90 14 190)">by API hash</text>

  <!-- device -->
  <rect x="460" y="40" width="230" height="200" rx="8" fill="#fbf6ee" stroke="#222"/>
  <text x="575" y="64" text-anchor="middle" font-weight="bold" fill="#222">Device</text>
  <rect x="480" y="80" width="190" height="34" rx="6" fill="#ffffff" stroke="#222"/>
  <text x="575" y="102" text-anchor="middle" fill="#222">API description</text>
  <g fill="#222" font-size="12">
    <text x="480" y="146">built in by ww_codegen!</text>
    <text x="480" y="168">with introspect = "with_docs"</text>
    <text x="480" y="208">handlers answer the calls</text>
  </g>

  <!-- arrows -->
  <line x1="476" y1="97" x2="244" y2="97" stroke="#2e6db0" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="360" y="89" text-anchor="middle" fill="#2e6db0">1. sent once per API</text>
  <line x1="264" y1="168" x2="456" y2="168" stroke="#222" marker-end="url(#arrow)"/>
  <text x="360" y="160" text-anchor="middle" fill="#222">2. calls</text>
  <line x1="456" y1="204" x2="264" y2="204" stroke="#222" stroke-dasharray="6 4" marker-end="url(#arrow)"/>
  <text x="360" y="222" text-anchor="middle" fill="#222">3. replies</text>
</svg>
