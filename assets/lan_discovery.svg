<svg xmlns="http://www.w3.org/2000/svg" width="740" height="290" viewBox="0 0 740 290" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <title>A device announces itself on the LAN and a host finds it</title>
  <desc>A WebSocket device announces a record on the local network over multicast DNS: instance name, port, path and API. The host's Discovery listens, keeps a list of servers, and the config picks one by name and builds the ws URL from its current address. After a new DHCP lease the record changes and the next connect attempt uses the new address.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b03a2e"/></marker>
  </defs>
  <rect x="0" y="0" width="740" height="290" rx="10" fill="#ffffff"/>
  <rect x="20" y="30" width="220" height="110" rx="6" fill="#eef2f7" stroke="#222"/>
  <text x="130.0" y="73.0" text-anchor="middle" fill="#222" font-size="12">Device</text>
  <text x="130.0" y="90.0" text-anchor="middle" fill="#222" font-size="12">serves ws://ADDRESS:8080/ww</text>
  <text x="130.0" y="107.0" text-anchor="middle" fill="#222" font-size="12">and announces it with Advertiser</text>
  <rect x="260" y="30" width="220" height="110" rx="6" fill="#fdf3e0" stroke="#222"/>
  <text x="370.0" y="73.0" text-anchor="middle" fill="#222" font-size="12">The local network</text>
  <text x="370.0" y="90.0" text-anchor="middle" fill="#222" font-size="12">multicast DNS</text>
  <text x="370.0" y="107.0" text-anchor="middle" fill="#222" font-size="12">service _wireweaver._tcp</text>
  <rect x="500" y="30" width="220" height="110" rx="6" fill="#eef2f7" stroke="#222"/>
  <text x="610.0" y="73.0" text-anchor="middle" fill="#222" font-size="12">Host program</text>
  <text x="610.0" y="90.0" text-anchor="middle" fill="#222" font-size="12">Discovery::start() keeps</text>
  <text x="610.0" y="107.0" text-anchor="middle" fill="#222" font-size="12">a list of the servers found</text>
  <line x1="240" y1="85" x2="258" y2="85" stroke="#222" marker-end="url(#arrow)"/>
  <line x1="480" y1="85" x2="498" y2="85" stroke="#222" marker-end="url(#arrow)"/>
  <rect x="20" y="170" width="220" height="80" rx="6" fill="#f2f4f7" stroke="#222"/>
  <text x="130.0" y="198.0" text-anchor="middle" fill="#222" font-size="12">The record</text>
  <text x="130.0" y="215.0" text-anchor="middle" fill="#222" font-size="12">name, port, path /ww,</text>
  <text x="130.0" y="232.0" text-anchor="middle" fill="#222" font-size="12">api blinky_api@0.1.0</text>
  <rect x="500" y="170" width="220" height="80" rx="6" fill="#e8f3ea" stroke="#222"/>
  <text x="610.0" y="198.0" text-anchor="middle" fill="#222" font-size="12">The client config</text>
  <text x="610.0" y="215.0" text-anchor="middle" fill="#222" font-size="12">websocket_urls_from(</text>
  <text x="610.0" y="232.0" text-anchor="middle" fill="#222" font-size="12">Select::Name(..))</text>
  <line x1="130" y1="140" x2="130" y2="168" stroke="#222" stroke-dasharray="6 4" marker-end="url(#arrow)"/>
  <line x1="610" y1="140" x2="610" y2="168" stroke="#222" stroke-dasharray="6 4" marker-end="url(#arrow)"/>
  <text x="370" y="205" fill="#222" text-anchor="middle" font-size="12">after a new DHCP lease the record changes:</text>
  <text x="370" y="223" fill="#222" text-anchor="middle" font-size="12">the next connect attempt asks again</text>
</svg>
