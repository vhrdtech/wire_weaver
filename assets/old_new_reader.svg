<svg xmlns="http://www.w3.org/2000/svg" width="720" height="300" viewBox="0 0 720 300" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <title>Old and new readers on old and new bytes</title>
  <desc>A two by two grid. Rows: the bytes of the first firmware's reading, without pressure, and of the next firmware's reading, with pressure. Columns: the first gateway's Reading and the next gateway's Reading. The first gateway reads both and ignores the pressure it doesn't know. The next gateway reads the first firmware's bytes with pressure None, its default, and the next firmware's bytes with the pressure.</desc>
  <rect x="0" y="0" width="720" height="300" rx="10" fill="#ffffff"/>

  <!-- column heads -->
  <g text-anchor="middle" font-weight="bold" fill="#222">
    <rect x="250" y="20" width="220" height="44" rx="6" fill="#eef2f7" stroke="#222"/>
    <text x="360" y="39">first gateway</text>
    <text x="360" y="56" font-weight="normal" font-family="Menlo, Consolas, monospace" font-size="12">Reading</text>
    <rect x="480" y="20" width="220" height="44" rx="6" fill="#eef2f7" stroke="#222"/>
    <text x="590" y="39">next gateway</text>
    <text x="590" y="56" font-weight="normal" font-family="Menlo, Consolas, monospace" font-size="12">v2::Reading</text>
  </g>

  <!-- row heads -->
  <g font-weight="bold" fill="#222">
    <rect x="20" y="76" width="220" height="96" rx="6" fill="#eef2f7" stroke="#222"/>
    <text x="34" y="100">first firmware sends</text>
    <text x="34" y="124" font-weight="normal">station, temperature,</text>
    <text x="34" y="142" font-weight="normal">humidity, battery_low</text>
    <text x="34" y="160" font-weight="normal" font-family="Menlo, Consolas, monospace" font-size="12">9 bytes</text>
    <rect x="20" y="184" width="220" height="96" rx="6" fill="#eef2f7" stroke="#222"/>
    <text x="34" y="208">next firmware sends</text>
    <text x="34" y="232" font-weight="normal">the same, and pressure</text>
    <text x="34" y="268" font-weight="normal" font-family="Menlo, Consolas, monospace" font-size="12">12 bytes</text>
  </g>

  <!-- cells -->
  <g stroke="#222">
    <rect x="250" y="76" width="220" height="96" rx="6" fill="#d7e8d0"/>
    <rect x="480" y="76" width="220" height="96" rx="6" fill="#d7e8d0"/>
    <rect x="250" y="184" width="220" height="96" rx="6" fill="#d7e8d0"/>
    <rect x="480" y="184" width="220" height="96" rx="6" fill="#d7e8d0"/>
  </g>
  <g fill="#222">
    <text x="264" y="100" font-weight="bold">reads every field</text>
    <text x="264" y="124">the type it was built for</text>

    <text x="494" y="100" font-weight="bold">reads every field</text>
    <text x="494" y="124">pressure is missing:</text>
    <text x="494" y="142">it reads as its default,</text>
    <text x="494" y="160" font-family="Menlo, Consolas, monospace" font-size="12">None</text>

    <text x="264" y="208" font-weight="bold">reads the fields it knows</text>
    <text x="264" y="232">pressure comes after them;</text>
    <text x="264" y="250">the reader skips it</text>

    <text x="494" y="208" font-weight="bold">reads every field</text>
    <text x="494" y="232">pressure is</text>
    <text x="494" y="250" font-family="Menlo, Consolas, monospace" font-size="12">Some(1013.2 hPa)</text>
  </g>
</svg>
