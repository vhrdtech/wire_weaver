<svg xmlns="http://www.w3.org/2000/svg" width="740" height="430" viewBox="0 0 740 430" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <title>The layers a call goes through on each transport</title>
  <desc>A stack of layers, the same on the host and on the device. The generated client and the link layer are the same for USB, RTT, WebSocket and UDP. The framer packs messages into packets for USB, UDP and RTT, and WebSocket does not use it. The medium differs: USB bulk endpoints, RTT ring buffers read by a debug probe, WebSocket over TCP, and UDP datagrams.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b03a2e"/></marker>
  </defs>
  <rect x="0" y="0" width="740" height="430" rx="10" fill="#ffffff"/>
  <rect x="40" y="20" width="659" height="44" rx="6" fill="#e8f3ea" stroke="#222"/>
  <text x="369.5" y="38.5" text-anchor="middle" fill="#222">Generated client on the host, generated server on the device</text>
  <text x="369.5" y="55.5" text-anchor="middle" fill="#222">read_once().call()  -&gt;  your handler</text>
  <rect x="40" y="84" width="659" height="44" rx="6" fill="#eef2f7" stroke="#222"/>
  <text x="369.5" y="102.5" text-anchor="middle" fill="#222">Link layer (ww_link)</text>
  <text x="369.5" y="119.5" text-anchor="middle" fill="#222">link setup, version check, pings, timeouts: the same on every medium</text>
  <text x="116.0" y="158" fill="#222" text-anchor="middle" font-weight="bold">USB</text>
  <line x1="116.0" y1="128" x2="116.0" y2="142" stroke="#222" marker-end="url(#arrow)"/>
  <text x="285.0" y="158" fill="#222" text-anchor="middle" font-weight="bold">RTT</text>
  <line x1="285.0" y1="128" x2="285.0" y2="142" stroke="#222" marker-end="url(#arrow)"/>
  <text x="454.0" y="158" fill="#222" text-anchor="middle" font-weight="bold">WebSocket</text>
  <line x1="454.0" y1="128" x2="454.0" y2="142" stroke="#222" marker-end="url(#arrow)"/>
  <text x="623.0" y="158" fill="#222" text-anchor="middle" font-weight="bold">UDP</text>
  <line x1="623.0" y1="128" x2="623.0" y2="142" stroke="#222" marker-end="url(#arrow)"/>
  <rect x="40" y="168" width="152" height="60" rx="6" fill="#eef2f7" stroke="#222"/>
  <text x="116.0" y="186.0" text-anchor="middle" fill="#222" font-size="12">framer: packets</text>
  <text x="116.0" y="203.0" text-anchor="middle" fill="#222" font-size="12">packs small messages</text>
  <text x="116.0" y="220.0" text-anchor="middle" fill="#222" font-size="12">splits big ones</text>
  <rect x="209" y="168" width="152" height="60" rx="6" fill="#eef2f7" stroke="#222"/>
  <text x="285.0" y="186.0" text-anchor="middle" fill="#222" font-size="12">framer: stream mode</text>
  <text x="285.0" y="203.0" text-anchor="middle" fill="#222" font-size="12">packs small messages</text>
  <text x="285.0" y="220.0" text-anchor="middle" fill="#222" font-size="12">splits big ones</text>
  <rect x="378" y="168" width="152" height="60" rx="6" fill="#ffffff" stroke="#222" stroke-dasharray="5 4"/>
  <text x="454.0" y="186.0" text-anchor="middle" fill="#222" font-size="12">no framer</text>
  <text x="454.0" y="203.0" text-anchor="middle" fill="#222" font-size="12">one message per</text>
  <text x="454.0" y="220.0" text-anchor="middle" fill="#222" font-size="12">WebSocket message</text>
  <rect x="547" y="168" width="152" height="60" rx="6" fill="#eef2f7" stroke="#222"/>
  <text x="623.0" y="186.0" text-anchor="middle" fill="#222" font-size="12">framer: datagrams</text>
  <text x="623.0" y="203.0" text-anchor="middle" fill="#222" font-size="12">packs small messages</text>
  <text x="623.0" y="220.0" text-anchor="middle" fill="#222" font-size="12">splits big ones</text>
  <rect x="40" y="246" width="152" height="50" rx="6" fill="#fdf3e0" stroke="#222"/>
  <text x="116.0" y="267.5" text-anchor="middle" fill="#222" font-size="12">USB bulk endpoints</text>
  <text x="116.0" y="284.5" text-anchor="middle" fill="#222" font-size="12">IN and OUT</text>
  <rect x="209" y="246" width="152" height="50" rx="6" fill="#fdf3e0" stroke="#222"/>
  <text x="285.0" y="267.5" text-anchor="middle" fill="#222" font-size="12">RTT ring buffers</text>
  <text x="285.0" y="284.5" text-anchor="middle" fill="#222" font-size="12">in the device's RAM</text>
  <rect x="378" y="246" width="152" height="50" rx="6" fill="#fdf3e0" stroke="#222"/>
  <text x="454.0" y="267.5" text-anchor="middle" fill="#222" font-size="12">TCP connection</text>
  <text x="454.0" y="284.5" text-anchor="middle" fill="#222" font-size="12">carrying WebSocket</text>
  <rect x="547" y="246" width="152" height="50" rx="6" fill="#fdf3e0" stroke="#222"/>
  <text x="623.0" y="267.5" text-anchor="middle" fill="#222" font-size="12">UDP datagrams</text>
  <text x="623.0" y="284.5" text-anchor="middle" fill="#222" font-size="12">no connection</text>
  <rect x="40" y="314" width="152" height="36" rx="6" fill="#f2f4f7" stroke="#222"/>
  <text x="116.0" y="337.0" text-anchor="middle" fill="#222" font-size="12">USB cable</text>
  <rect x="209" y="314" width="152" height="36" rx="6" fill="#f2f4f7" stroke="#222"/>
  <text x="285.0" y="337.0" text-anchor="middle" fill="#222" font-size="12">debug probe (SWD)</text>
  <rect x="378" y="314" width="152" height="36" rx="6" fill="#f2f4f7" stroke="#222"/>
  <text x="454.0" y="337.0" text-anchor="middle" fill="#222" font-size="12">Ethernet or Wi-Fi</text>
  <rect x="547" y="314" width="152" height="36" rx="6" fill="#f2f4f7" stroke="#222"/>
  <text x="623.0" y="337.0" text-anchor="middle" fill="#222" font-size="12">Ethernet or Wi-Fi</text>
  <line x1="116.0" y1="228" x2="116.0" y2="246" stroke="#222" marker-end="url(#arrow)"/>
  <line x1="116.0" y1="296" x2="116.0" y2="314" stroke="#222" marker-end="url(#arrow)"/>
  <line x1="285.0" y1="228" x2="285.0" y2="246" stroke="#222" marker-end="url(#arrow)"/>
  <line x1="285.0" y1="296" x2="285.0" y2="314" stroke="#222" marker-end="url(#arrow)"/>
  <line x1="454.0" y1="228" x2="454.0" y2="246" stroke="#222" marker-end="url(#arrow)"/>
  <line x1="454.0" y1="296" x2="454.0" y2="314" stroke="#222" marker-end="url(#arrow)"/>
  <line x1="623.0" y1="228" x2="623.0" y2="246" stroke="#222" marker-end="url(#arrow)"/>
  <line x1="623.0" y1="296" x2="623.0" y2="314" stroke="#222" marker-end="url(#arrow)"/>
  <text x="40" y="382" fill="#222" font-size="12">The same stack runs on both ends of the line. Only the framer and the medium change with the transport.</text>
  <text x="40" y="402" fill="#222" font-style="italic" font-size="12">The in-process transport of tests puts a simulated medium in the bottom two rows.</text>
</svg>
