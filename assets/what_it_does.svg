<svg xmlns="http://www.w3.org/2000/svg" width="720" height="400" viewBox="0 0 720 400" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <title>The layers of one call, each an area of WireWeaver</title>
  <desc>A call goes down the host's layers, from your program, ww or Python, through the generated client, the framer and link layer and a transport, across the wire, and up the device's layers: the transport, the framer and link layer, the generated server and your handlers. The reply goes back the same way. ShrinkWrap encodes every message, and the evolution checker compares versions of the API.</desc>
  <defs>
    <marker id="wd-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f5f99"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="720" height="400" rx="10" fill="#ffffff"/>

  <text x="170" y="30" text-anchor="middle" font-weight="bold" fill="#222">Host</text>
  <text x="550" y="30" text-anchor="middle" font-weight="bold" fill="#222">Device</text>

  <!-- host column -->
  <g text-anchor="middle">
    <rect x="70" y="44" width="200" height="40" rx="6" fill="#fbeee6" stroke="#b03a2e"/>
    <text x="170" y="62" fill="#b03a2e">your program, ww, Python</text>
    <text x="170" y="77" fill="#555" font-size="11">Tools</text>
    <rect x="70" y="100" width="200" height="40" rx="6" fill="#eef2f7" stroke="#222"/>
    <text x="170" y="118" fill="#222">generated client</text>
    <text x="170" y="133" fill="#555" font-size="11">An API as a Rust trait</text>
    <rect x="70" y="156" width="200" height="40" rx="6" fill="#eef2f7" stroke="#222"/>
    <text x="170" y="174" fill="#222">framer and link layer</text>
    <text x="170" y="189" fill="#555" font-size="11">Getting connected</text>
    <rect x="70" y="212" width="200" height="40" rx="6" fill="#eef2f7" stroke="#222"/>
    <text x="170" y="230" fill="#222">transport</text>
    <text x="170" y="245" fill="#555" font-size="11">USB, UDP, WebSocket, RTT</text>
  </g>

  <!-- device column -->
  <g text-anchor="middle">
    <rect x="450" y="44" width="200" height="40" rx="6" fill="#fbeee6" stroke="#b03a2e"/>
    <text x="550" y="62" fill="#b03a2e">your handlers</text>
    <text x="550" y="77" fill="#555" font-size="11">standard library traits too</text>
    <rect x="450" y="100" width="200" height="40" rx="6" fill="#eef2f7" stroke="#222"/>
    <text x="550" y="118" fill="#222">generated server</text>
    <text x="550" y="133" fill="#555" font-size="11">no allocator, no OS</text>
    <rect x="450" y="156" width="200" height="40" rx="6" fill="#eef2f7" stroke="#222"/>
    <text x="550" y="174" fill="#222">framer and link layer</text>
    <text x="550" y="189" fill="#555" font-size="11">versions checked on connect</text>
    <rect x="450" y="212" width="200" height="40" rx="6" fill="#eef2f7" stroke="#222"/>
    <text x="550" y="230" fill="#222">transport</text>
    <text x="550" y="245" fill="#555" font-size="11">USB, UDP, WebSocket, RTT</text>
  </g>

  <!-- the call down, across, up -->
  <path d="M60,64 L40,64 L40,272 L360,272" fill="none" stroke="#1f5f99" stroke-width="2"/>
  <path d="M360,272 L680,272 L680,64 L660,64" fill="none" stroke="#1f5f99" stroke-width="2" marker-end="url(#wd-arrow)"/>
  <text x="360" y="266" text-anchor="middle" fill="#1f5f99">request</text>
  <text x="360" y="292" text-anchor="middle" fill="#1f5f99" font-size="12">reply: the same way back</text>

  <!-- areas that span every layer -->
  <rect x="40" y="312" width="640" height="32" rx="6" fill="#eef2f7" stroke="#222" stroke-dasharray="5 4"/>
  <text x="360" y="333" text-anchor="middle" fill="#222">ShrinkWrap encodes every message: arguments, replies, properties, stream items</text>
  <rect x="40" y="352" width="640" height="32" rx="6" fill="#eef2f7" stroke="#222" stroke-dasharray="5 4"/>
  <text x="360" y="373" text-anchor="middle" fill="#222">Evolution: old hosts and old firmware keep working; the checker says when they wouldn't</text>
</svg>
