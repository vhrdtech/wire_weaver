# The book's frame, checked by `ww-book check` (`just book-check`, and ww_book's tests in `just test`).
# `[[part]]`: the reading ramp, in nav order; every page of a part has its level, so next/next never steps down.
# `outside`: the top-level nav sections after the ramp, whose pages may have any level.
# `[bare_fences]`: pages still holding `rust` fences that are not includes of a compiled source, with their count,
# which may only go down. A chapter rewritten for the book drops its line.

outside = ["Reference", "Articles"]

[[part]]
title = "Introduction"
level = "basic"

