# Repositories whose pages are part of the book (ww_book, `just book-assemble`): pages live with their code. Each is
# found either through a package Cargo.lock pins (`package`; `pages` and `features` relative to that package's
# directory), or by its git URL and branch (`git`, `branch`; no revision is pinned, as for a git dependency: `pages`
# and `features` relative to the repository root of a checkout kept in ~/.cache/ww_book/, or $WW_BOOK_CHECKOUTS).
# `just book-assemble` fetches the branch and prints the commit it took; offline it takes the existing checkout.
# `into` is the directory under docs/ the pages go to, so their links to the rest of the book keep working.
# `name` is the repository's name as the Features page shows it, the package's (or the URL's last part) when left out.
# `features_page` is the file name the tracker gets under `into`, `features.md` when left out.
# `book` is the URL of a repository's own book, built apart from this one: its pages are not copied, only its tracker,
# whose links to them point into that book.

[[source]]
package = "shrink_wrap"
pages = "../docs"
into = "serdes"
features = "../FEATURES.md"

# ww_base: the pages of ww_si, ww_numeric, ww_version, ww_error, ww_date_time and the units, in the standard library
[[source]]
package = "ww_si"
name = "ww_base"
pages = "../docs"
into = "std_library"
features = "../FEATURES.md"

# ww_tape: its feature tracker; its pages are the ww_tape book (docs/tapes.md points there)
[[source]]
git = "https://github.com/vhrdtech/ww_tape"
branch = "main"
pages = "docs"
into = "tape"
features = "FEATURES.md"
book = "https://tape.vhrd.tech/"

# ww_stdlib: the pages of the standard library's API crates, helpers and tools; no crate of it is locked here
[[source]]
git = "https://github.com/vhrdtech/ww_stdlib"
branch = "main"
pages = "docs"
into = "std_library"
features = "FEATURES.md"
features_page = "stdlib_features.md"
