<svg xmlns="http://www.w3.org/2000/svg" width="720" height="250" viewBox="0 0 720 250" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <title>Changing the API and calling it from Python at once</title>
  <desc>Four steps in a loop: edit the trait and its handler; restart the simulated device or flash the board; the Python script connects and receives the new API description, since the API's hash changed; the script calls the new method. No Python code is generated or rebuilt.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#222"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="720" height="250" rx="10" fill="#ffffff"/>

  <g text-anchor="middle" fill="#222">
    <rect x="20" y="50" width="150" height="90" rx="8" fill="#fdf3e1" stroke="#222"/>
    <text x="95" y="76" font-weight="bold">1. Edit</text>
    <text x="95" y="98" font-size="12">fn led_toggle();</text>
    <text x="95" y="116" font-size="12">and its handler</text>

    <rect x="200" y="50" width="150" height="90" rx="8" fill="#fbf6ee" stroke="#222"/>
    <text x="275" y="76" font-weight="bold">2. Rebuild</text>
    <text x="275" y="98" font-size="12">restart blinky_sim</text>
    <text x="275" y="116" font-size="12">or flash the board</text>

    <rect x="380" y="50" width="150" height="90" rx="8" fill="#eef2f7" stroke="#222"/>
    <text x="455" y="76" font-weight="bold">3. Connect</text>
    <text x="455" y="98" font-size="12">a new API hash:</text>
    <text x="455" y="116" font-size="12">the new description</text>

    <rect x="560" y="50" width="150" height="90" rx="8" fill="#eef2f7" stroke="#222"/>
    <text x="635" y="76" font-weight="bold">4. Call</text>
    <text x="635" y="98" font-size="12">dev.led_toggle()</text>
  </g>
  <g stroke="#222" fill="none">
    <line x1="170" y1="95" x2="196" y2="95" marker-end="url(#arrow)"/>
    <line x1="350" y1="95" x2="376" y2="95" marker-end="url(#arrow)"/>
    <line x1="530" y1="95" x2="556" y2="95" marker-end="url(#arrow)"/>
    <path d="M 635 140 C 635 205, 95 205, 95 144" marker-end="url(#arrow)"/>
  </g>
  <text x="365" y="232" text-anchor="middle" fill="#555" font-size="12">the next change: no Python code is generated or rebuilt</text>
  <g fill="#555" font-size="12" text-anchor="middle">
    <text x="185" y="34">Rust: API crate and device</text>
    <text x="545" y="34">Python script</text>
  </g>
</svg>
