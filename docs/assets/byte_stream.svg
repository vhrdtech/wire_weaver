<svg xmlns="http://www.w3.org/2000/svg" width="720" height="330" viewBox="0 0 720 330" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <title>A client and a server over a byte stream</title>
  <desc>The client opens a byte stream: a TCP connection, or the stdin and stdout of a command. It first sends a preamble that names the service it wants. The server answers that it accepts, or refuses with a status such as UnknownService. After that both sides send messages, each with its length in front, in both directions.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b03a2e"/></marker>
  </defs>
  <rect x="0" y="0" width="720" height="330" rx="10" fill="#ffffff"/>
  <rect x="300" y="15" width="160" height="32" rx="6" fill="#eef2f7" stroke="#222"/>
  <text x="380.0" y="36.0" text-anchor="middle" fill="#222" font-weight="bold">Client</text>
  <rect x="540" y="15" width="160" height="32" rx="6" fill="#eef2f7" stroke="#222"/>
  <text x="620.0" y="36.0" text-anchor="middle" fill="#222" font-weight="bold">Server</text>
  <g stroke="#999" stroke-dasharray="4 4"><line x1="380" y1="47" x2="380" y2="310"/><line x1="620" y1="47" x2="620" y2="310"/></g>
  <text x="20" y="76" fill="#222" font-weight="bold" font-size="12">1. The client says what it wants</text>
  <line x1="380" y1="100" x2="616" y2="100" stroke="#222" marker-end="url(#arrow)"/>
  <text x="500" y="94" fill="#222" text-anchor="middle" font-size="12">preamble: service "journal"</text>
  <text x="20" y="136" fill="#222" font-weight="bold" font-size="12">2. The server accepts, or refuses at once</text>
  <line x1="620" y1="160" x2="384" y2="160" stroke="#222" marker-end="url(#arrow)"/>
  <text x="500" y="154" fill="#222" text-anchor="middle" font-size="12">accepted</text>
  <line x1="620" y1="190" x2="384" y2="190" stroke="#b03a2e" stroke-dasharray="6 4" marker-end="url(#arrow-red)"/>
  <text x="500" y="384" fill="#b03a2e" text-anchor="middle" font-size="12">or: UnknownService</text>
  <text x="20" y="228" fill="#222" font-weight="bold" font-size="12">3. Messages, each with its length in front</text>
  <line x1="380" y1="252" x2="616" y2="252" stroke="#222" marker-end="url(#arrow)"/>
  <text x="500" y="246" fill="#222" text-anchor="middle" font-size="12">length | link message</text>
  <line x1="620" y1="282" x2="384" y2="282" stroke="#222" marker-end="url(#arrow)"/>
  <text x="500" y="276" fill="#222" text-anchor="middle" font-size="12">length | link message</text>
</svg>
