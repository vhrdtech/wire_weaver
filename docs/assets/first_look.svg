<svg xmlns="http://www.w3.org/2000/svg" width="720" height="360" viewBox="0 0 720 360" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <title>Three terminals and one simulated device</title>
  <desc>Terminal 1 runs the simulated blinky device, listening at ws://127.0.0.1:8080/ww. Terminal 2 runs ww call led_on: the request goes over WebSocket to the device's generated server, which calls the led_on handler, and the device prints LED on. The reply () goes back to terminal 2. Terminal 3 runs a Python script against the same address.</desc>
  <defs>
    <marker id="fl-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f5f99"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="720" height="360" rx="10" fill="#ffffff"/>

  <!-- terminal 1: the device -->
  <rect x="30" y="30" width="300" height="300" rx="8" fill="#ffffff" stroke="#222"/>
  <rect x="30" y="30" width="300" height="26" rx="8" fill="#eef2f7" stroke="#222"/>
  <text x="180" y="48" text-anchor="middle" font-weight="bold" fill="#222">Terminal 1: the simulated device</text>
  <text x="44" y="78" font-family="monospace" font-size="12" fill="#222">$ cargo run -p blinky --example blinky_sim</text>
  <text x="44" y="96" font-family="monospace" font-size="12" fill="#555">blinky at ws://127.0.0.1:8080/ww</text>
  <rect x="60" y="124" width="240" height="40" rx="6" fill="#eef2f7" stroke="#222"/>
  <text x="180" y="149" text-anchor="middle" fill="#222">generated server</text>
  <rect x="60" y="196" width="240" height="40" rx="6" fill="#fbeee6" stroke="#b03a2e"/>
  <text x="180" y="221" text-anchor="middle" fill="#b03a2e" font-family="monospace">led_on handler</text>
  <line x1="180" y1="164" x2="180" y2="194" stroke="#1f5f99" stroke-width="2" marker-end="url(#fl-arrow)"/>
  <rect x="60" y="268" width="240" height="40" rx="6" fill="#ffffff" stroke="#999" stroke-dasharray="4 3"/>
  <text x="180" y="293" text-anchor="middle" fill="#222" font-family="monospace">LED on</text>
  <line x1="180" y1="236" x2="180" y2="266" stroke="#1f5f99" stroke-width="2" marker-end="url(#fl-arrow)"/>
  <text x="196" y="256" fill="#555" font-size="12">the simulated LED prints</text>

  <!-- terminal 2: ww -->
  <rect x="420" y="30" width="270" height="130" rx="8" fill="#ffffff" stroke="#222"/>
  <rect x="420" y="30" width="270" height="26" rx="8" fill="#eef2f7" stroke="#222"/>
  <text x="555" y="48" text-anchor="middle" font-weight="bold" fill="#222">Terminal 2: ww or a Rust program</text>
  <text x="434" y="84" font-family="monospace" font-size="12" fill="#222">$ ww --websocket ws://.. \</text>
  <text x="434" y="102" font-family="monospace" font-size="12" fill="#222">    call led_on</text>
  <text x="434" y="128" font-family="monospace" font-size="12" fill="#555">()</text>

  <!-- terminal 3: Python -->
  <rect x="420" y="200" width="270" height="130" rx="8" fill="#ffffff" stroke="#222"/>
  <rect x="420" y="200" width="270" height="26" rx="8" fill="#eef2f7" stroke="#222"/>
  <text x="555" y="218" text-anchor="middle" font-weight="bold" fill="#222">Terminal 3: Python</text>
  <text x="434" y="254" font-family="monospace" font-size="12" fill="#222">$ python blinky.py</text>
  <text x="434" y="272" font-family="monospace" font-size="12" fill="#555">BlinkyApi</text>
  <text x="434" y="290" font-family="monospace" font-size="12" fill="#555">  led_on() ..</text>

  <!-- request and reply -->
  <line x1="418" y1="94" x2="302" y2="138" stroke="#1f5f99" stroke-width="2" marker-end="url(#fl-arrow)"/>
  <text x="372" y="102" text-anchor="middle" fill="#1f5f99" font-size="12">request</text>
  <line x1="302" y1="150" x2="418" y2="124" stroke="#1f5f99" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#fl-arrow)"/>
  <text x="372" y="160" text-anchor="middle" fill="#1f5f99" font-size="12">reply</text>
  <line x1="418" y1="262" x2="302" y2="156" stroke="#999" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="372" y="230" text-anchor="middle" fill="#555" font-size="12">same address</text>
</svg>
