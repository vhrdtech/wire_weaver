<svg xmlns="http://www.w3.org/2000/svg" width="720" height="272" viewBox="0 0 720 272" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <title>The bytes of three messages of the sensor node</title>
  <desc>Each message starts with its discriminant in one nibble: 0 for Hello, 1 for Reading, 2 for Goodbye, then a nibble of padding. Hello has the node number 07 and the firmware 31 2e 30, then two lengths, 3 and 1, in its last byte. Reading has the reading's nine bytes, then its length 9 in two nibbles. Goodbye has nothing more.</desc>
  <defs>
    <marker id="sl-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#222"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="720" height="272" rx="10" fill="#ffffff"/>
  <text x="116" y="50" text-anchor="end" font-weight="bold" font-family="Menlo, Consolas, monospace" fill="#222">Hello</text>
  <rect x="130" y="30" width="16" height="30" fill="#d7e8d0" stroke="#222"/>
  <text x="138.0" y="50" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="12" fill="#222">0</text>
  <rect x="146" y="30" width="16" height="30" fill="#eeeeee" stroke="#222"/>
  <text x="154.0" y="50" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="12" fill="#222">0</text>
  <rect x="162" y="30" width="32" height="30" fill="#cfe0f3" stroke="#222"/>
  <text x="178.0" y="50" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="12" fill="#222">07</text>
  <text x="178.0" y="76" text-anchor="middle" font-size="12" fill="#222">node</text>
  <rect x="194" y="30" width="96" height="30" fill="#cfe0f3" stroke="#222"/>
  <text x="242.0" y="50" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="12" fill="#222">31 2e 30</text>
  <text x="242.0" y="76" text-anchor="middle" font-size="12" fill="#222">firmware</text>
  <rect x="290" y="30" width="32" height="30" fill="#f3e3c3" stroke="#222"/>
  <text x="306.0" y="50" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="12" fill="#222">3 1</text>
  <text x="306.0" y="76" text-anchor="middle" font-size="12" fill="#222">lengths</text>
  <text x="116" y="124" text-anchor="end" font-weight="bold" font-family="Menlo, Consolas, monospace" fill="#222">Reading</text>
  <rect x="130" y="104" width="16" height="30" fill="#d7e8d0" stroke="#222"/>
  <text x="138.0" y="124" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="12" fill="#222">1</text>
  <rect x="146" y="104" width="16" height="30" fill="#eeeeee" stroke="#222"/>
  <text x="154.0" y="124" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="12" fill="#222">0</text>
  <rect x="162" y="104" width="288" height="30" fill="#cfe0f3" stroke="#222"/>
  <text x="306.0" y="124" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="12" fill="#222">72 6f .. 30 04</text>
  <text x="306.0" y="150" text-anchor="middle" font-size="12" fill="#222">the reading's 9 bytes</text>
  <rect x="450" y="104" width="32" height="30" fill="#f3e3c3" stroke="#222"/>
  <text x="466.0" y="124" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="12" fill="#222">1 9</text>
  <text x="466.0" y="150" text-anchor="middle" font-size="12" fill="#222">length</text>
  <text x="116" y="198" text-anchor="end" font-weight="bold" font-family="Menlo, Consolas, monospace" fill="#222">Goodbye</text>
  <rect x="130" y="178" width="16" height="30" fill="#d7e8d0" stroke="#222"/>
  <text x="138.0" y="198" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="12" fill="#222">2</text>
  <rect x="146" y="178" width="16" height="30" fill="#eeeeee" stroke="#222"/>
  <text x="154.0" y="198" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="12" fill="#222">0</text>
  <rect x="130" y="245" width="14" height="14" fill="#d7e8d0" stroke="#222"/>
  <text x="150" y="256" font-size="12" fill="#222">discriminant</text>
  <rect x="250" y="245" width="14" height="14" fill="#eeeeee" stroke="#222"/>
  <text x="270" y="256" font-size="12" fill="#222">padding</text>
  <text x="350" y="256" font-size="12" fill="#222">one nibble per narrow cell; ww_repr = u4</text>
</svg>
