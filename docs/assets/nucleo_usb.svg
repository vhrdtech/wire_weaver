<svg xmlns="http://www.w3.org/2000/svg" width="720" height="320" viewBox="0 0 720 320" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <title>Wiring the Nucleo G0B1RE for USB</title>
  <desc>The Nucleo's ST-LINK USB connector goes to the PC: it flashes the firmware and powers the board. A USB breakout's D-, D+ and GND go to PA11, PA12 and GND of the STM32G0B1 on the ST morpho headers; its 5 V stays unconnected; its cable goes to the PC and carries WireWeaver. The user LED LD4 is on PA5.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#222"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="720" height="320" rx="10" fill="#ffffff"/>

  <!-- PC -->
  <rect x="560" y="40" width="140" height="240" rx="8" fill="#eef2f7" stroke="#222"/>
  <text x="630" y="64" text-anchor="middle" font-weight="bold" fill="#222">PC</text>
  <g fill="#222" font-size="12">
    <text x="574" y="104">probe-rs:</text>
    <text x="574" y="120">flash, log</text>
    <text x="574" y="214">ww, Python,</text>
    <text x="574" y="230">host programs</text>
  </g>

  <!-- Nucleo board -->
  <rect x="20" y="30" width="330" height="260" rx="8" fill="#f2f7ee" stroke="#222"/>
  <text x="34" y="52" font-weight="bold" fill="#222">Nucleo G0B1RE</text>
  <rect x="40" y="70" width="140" height="60" rx="6" fill="#ffffff" stroke="#222"/>
  <g text-anchor="middle" fill="#222">
    <text x="110" y="95" font-weight="bold">ST-LINK</text>
    <text x="110" y="114" font-size="12">USB connector</text>
  </g>
  <rect x="120" y="160" width="150" height="110" rx="6" fill="#ffffff" stroke="#222"/>
  <g fill="#222">
    <text x="195" y="182" text-anchor="middle" font-weight="bold">STM32G0B1RE</text>
    <text x="250" y="210" text-anchor="end" font-size="12">PA11 (D-)</text>
    <text x="250" y="230" text-anchor="end" font-size="12">PA12 (D+)</text>
    <text x="250" y="250" text-anchor="end" font-size="12">GND</text>
    <text x="134" y="250" font-size="12">PA5</text>
  </g>
  <circle cx="60" cy="246" r="8" fill="#4caf50" stroke="#222"/>
  <text x="60" y="275" text-anchor="middle" font-size="12" fill="#222">LD4</text>
  <line x1="130" y1="246" x2="70" y2="246" stroke="#222"/>
  <line x1="180" y1="100" x2="556" y2="100" stroke="#222" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="368" y="92" text-anchor="middle" fill="#222">USB cable: flashing and power</text>

  <!-- breakout -->
  <rect x="390" y="180" width="110" height="80" rx="6" fill="#fdf3e1" stroke="#222"/>
  <g fill="#222">
    <text x="445" y="172" text-anchor="middle" font-weight="bold">USB breakout</text>
    <text x="400" y="210" font-size="12">D-</text>
    <text x="400" y="230" font-size="12">D+</text>
    <text x="400" y="250" font-size="12">GND</text>
    <text x="460" y="250" font-size="12" fill="#888">5 V</text>
  </g>
  <g stroke="#2e6db0" stroke-width="2">
    <line x1="270" y1="206" x2="395" y2="206"/>
    <line x1="270" y1="226" x2="395" y2="226"/>
    <line x1="270" y1="246" x2="395" y2="246"/>
  </g>
  <text x="332" y="196" text-anchor="middle" font-size="12" fill="#2e6db0">wires</text>
  <line x1="500" y1="220" x2="556" y2="220" stroke="#222" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="528" y="212" text-anchor="middle" font-size="12" fill="#222">USB</text>
</svg>
