<svg xmlns="http://www.w3.org/2000/svg" width="720" height="380" viewBox="0 0 720 380" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <title>One API trait in, device code and host code out</title>
  <desc>An API crate holds one Rust trait. ww_codegen! turns it into a server on the device, where your handlers do the work, and a client on the host. Between them, requests and replies travel as shrink_wrap bytes over USB, UDP, WebSocket, RTT or a serial line. The ww tool and Python read the API from the device itself and need no generated code.</desc>
  <defs>
    <marker id="ov-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#222"/>
    </marker>
    <marker id="ov-arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f5f99"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="720" height="380" rx="10" fill="#ffffff"/>

  <!-- the API crate -->
  <rect x="220" y="20" width="280" height="84" rx="8" fill="#eef2f7" stroke="#222"/>
  <text x="360" y="42" text-anchor="middle" font-weight="bold" fill="#222">API crate</text>
  <text x="360" y="64" text-anchor="middle" font-family="monospace" fill="#222">#[ww_api_root]</text>
  <text x="360" y="82" text-anchor="middle" font-family="monospace" fill="#222">trait Blinky { fn led_on(); .. }</text>

  <!-- codegen arrows -->
  <line x1="290" y1="104" x2="160" y2="160" stroke="#222" stroke-width="1.5" marker-end="url(#ov-arrow)"/>
  <line x1="430" y1="104" x2="560" y2="160" stroke="#222" stroke-width="1.5" marker-end="url(#ov-arrow)"/>
  <text x="170" y="128" text-anchor="middle" fill="#555" font-family="monospace">ww_codegen!(server)</text>
  <text x="560" y="128" text-anchor="middle" fill="#555" font-family="monospace">ww_codegen!(client)</text>

  <!-- device -->
  <rect x="30" y="164" width="260" height="120" rx="8" fill="#ffffff" stroke="#222"/>
  <text x="160" y="186" text-anchor="middle" font-weight="bold" fill="#222">Device (firmware)</text>
  <rect x="50" y="198" width="220" height="32" rx="6" fill="#eef2f7" stroke="#222"/>
  <text x="160" y="219" text-anchor="middle" fill="#222">generated server</text>
  <rect x="50" y="238" width="220" height="32" rx="6" fill="#fbeee6" stroke="#b03a2e"/>
  <text x="160" y="259" text-anchor="middle" fill="#b03a2e">your handlers</text>

  <!-- host -->
  <rect x="430" y="164" width="260" height="120" rx="8" fill="#ffffff" stroke="#222"/>
  <text x="560" y="186" text-anchor="middle" font-weight="bold" fill="#222">Host (PC)</text>
  <rect x="450" y="198" width="220" height="32" rx="6" fill="#fbeee6" stroke="#b03a2e"/>
  <text x="560" y="219" text-anchor="middle" fill="#b03a2e">your host program</text>
  <rect x="450" y="238" width="220" height="32" rx="6" fill="#eef2f7" stroke="#222"/>
  <text x="560" y="259" text-anchor="middle" fill="#222">generated client</text>

  <!-- bytes between -->
  <line x1="292" y1="224" x2="428" y2="224" stroke="#1f5f99" stroke-width="2" marker-start="url(#ov-arrow-blue)" marker-end="url(#ov-arrow-blue)"/>
  <text x="360" y="214" text-anchor="middle" fill="#1f5f99">shrink_wrap bytes</text>
  <text x="360" y="244" text-anchor="middle" fill="#1f5f99" font-size="12">USB, UDP, WebSocket,</text>
  <text x="360" y="260" text-anchor="middle" fill="#1f5f99" font-size="12">RTT, serial</text>

  <!-- tools -->
  <rect x="430" y="310" width="260" height="50" rx="8" fill="#eef2f7" stroke="#222" stroke-dasharray="5 4"/>
  <text x="560" y="331" text-anchor="middle" font-weight="bold" fill="#222">ww and Python</text>
  <text x="560" y="349" text-anchor="middle" fill="#555" font-size="12">read the API from the device</text>
  <path d="M430,335 C340,335 300,320 270,290" fill="none" stroke="#1f5f99" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#ov-arrow-blue)"/>
</svg>
