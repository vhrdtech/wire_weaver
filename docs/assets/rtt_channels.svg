<svg xmlns="http://www.w3.org/2000/svg" width="720" height="330" viewBox="0 0 720 330" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <title>How RTT carries messages through a debug probe</title>
  <desc>The device's RAM holds three RTT channels: an up channel ww_up the device writes and the probe reads, a down channel ww_down the host writes through the probe, and a defmt log channel. The probe reads and writes them over SWD. The host program polls the probe every millisecond, so a call takes a few milliseconds.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b03a2e"/></marker>
  </defs>
  <rect x="0" y="0" width="720" height="330" rx="10" fill="#ffffff"/>
  <rect x="30" y="30" width="240" height="250" rx="6" fill="#f7f9fb" stroke="#222"/>
  <text x="150" y="52" fill="#222" text-anchor="middle" font-weight="bold">Device RAM</text>
  <rect x="50" y="70" width="200" height="52" rx="6" fill="#e8f3ea" stroke="#222"/>
  <text x="150.0" y="92.5" text-anchor="middle" fill="#222" font-size="12">up 1: ww_up</text>
  <text x="150.0" y="109.5" text-anchor="middle" fill="#222" font-size="12">device writes, 2048 bytes</text>
  <rect x="50" y="142" width="200" height="52" rx="6" fill="#fdf3e0" stroke="#222"/>
  <text x="150.0" y="164.5" text-anchor="middle" fill="#222" font-size="12">down 0: ww_down</text>
  <text x="150.0" y="181.5" text-anchor="middle" fill="#222" font-size="12">device reads, 2048 bytes</text>
  <rect x="50" y="214" width="200" height="52" rx="6" fill="#f2f4f7" stroke="#222" stroke-dasharray="5 4"/>
  <text x="150.0" y="236.5" text-anchor="middle" fill="#222" font-size="12">up 0: defmt</text>
  <text x="150.0" y="253.5" text-anchor="middle" fill="#222" font-size="12">log lines, not read by ww</text>
  <rect x="340" y="100" width="130" height="110" rx="6" fill="#eef2f7" stroke="#222"/>
  <text x="405.0" y="143.0" text-anchor="middle" fill="#222" font-size="12">Debug probe</text>
  <text x="405.0" y="160.0" text-anchor="middle" fill="#222" font-size="12">reads and writes</text>
  <text x="405.0" y="177.0" text-anchor="middle" fill="#222" font-size="12">the RAM over SWD</text>
  <rect x="550" y="100" width="150" height="110" rx="6" fill="#eef2f7" stroke="#222"/>
  <text x="625.0" y="143.0" text-anchor="middle" fill="#222" font-size="12">Host program</text>
  <text x="625.0" y="160.0" text-anchor="middle" fill="#222" font-size="12">polls the probe</text>
  <text x="625.0" y="177.0" text-anchor="middle" fill="#222" font-size="12">every 1 ms</text>
  <line x1="250" y1="96" x2="338" y2="120" stroke="#222" marker-end="url(#arrow)"/>
  <line x1="338" y1="190" x2="250" y2="168" stroke="#222" marker-end="url(#arrow)"/>
  <line x1="470" y1="130" x2="548" y2="130" stroke="#222" marker-end="url(#arrow)"/>
  <line x1="548" y1="180" x2="472" y2="180" stroke="#222" marker-end="url(#arrow)"/>
  <text x="404" y="90" fill="#222" text-anchor="middle" font-size="12">replies, events</text>
  <text x="404" y="232" fill="#222" text-anchor="middle" font-size="12">requests</text>
  <text x="510" y="122" fill="#222" text-anchor="middle" font-size="12">up</text>
  <text x="510" y="200" fill="#222" text-anchor="middle" font-size="12">down</text>
  <text x="30" y="312" fill="#222" font-style="italic" font-size="12">Nothing wakes the device when the host writes: it looks at ww_down on its own schedule, every 1 ms by default.</text>
</svg>
