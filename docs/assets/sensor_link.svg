<svg xmlns="http://www.w3.org/2000/svg" width="720" height="210" viewBox="0 0 720 210" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <title>A sensor node sends a reading over a radio link to a gateway</title>
  <desc>The sensor node, a microcontroller without a heap, writes a Reading into a buffer with to_ww_bytes. Nine bytes cross the radio link. The gateway, a PC, reads them as a borrowed Reading with from_ww_bytes, or as a ReadingOwned it keeps in a log with from_ww_bytes_owned.</desc>
  <defs>
    <marker id="sl-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#222"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="720" height="210" rx="10" fill="#ffffff"/>
  <rect x="20" y="40" width="230" height="150" rx="6" fill="#eef2f7" stroke="#222"/>
  <text x="135" y="30" text-anchor="middle" font-weight="bold" fill="#222">sensor node: a microcontroller</text>
  <text x="34" y="72" font-family="Menlo, Consolas, monospace" font-size="12" fill="#222">Reading { station: "roof", .. }</text>
  <text x="34" y="100"  font-size="12" fill="#222">no heap: a buffer of its own</text>
  <text x="34" y="128" font-family="Menlo, Consolas, monospace" font-size="12" fill="#222">to_ww_bytes(&amp;mut frame)</text>
  <text x="34" y="170" fill="#222">runs on a battery</text>
  <rect x="470" y="40" width="230" height="150" rx="6" fill="#eef2f7" stroke="#222"/>
  <text x="585" y="30" text-anchor="middle" font-weight="bold" fill="#222">gateway: a PC indoors</text>
  <text x="484" y="72" font-family="Menlo, Consolas, monospace" font-size="12" fill="#222">from_ww_bytes: Reading&lt;'i&gt;</text>
  <text x="484" y="100" font-family="Menlo, Consolas, monospace" font-size="12" fill="#222">from_ww_bytes_owned:</text>
  <text x="484" y="128"  font-size="12" fill="#222">  ReadingOwned, kept in a log</text>
  <text x="484" y="170" fill="#222">has an allocator</text>
  <line x1="252" y1="115" x2="466" y2="115" stroke="#222" stroke-dasharray="6 4" marker-end="url(#sl-arrow)"/>
  <text x="360" y="105" text-anchor="middle" fill="#222">radio link</text>
  <rect x="255" y="128" width="23" height="22" fill="#d7e8d0" stroke="#888"/>
  <text x="266.5" y="144" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="11" fill="#222">72</text>
  <rect x="278" y="128" width="23" height="22" fill="#d7e8d0" stroke="#888"/>
  <text x="289.5" y="144" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="11" fill="#222">6f</text>
  <rect x="301" y="128" width="23" height="22" fill="#d7e8d0" stroke="#888"/>
  <text x="312.5" y="144" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="11" fill="#222">6f</text>
  <rect x="324" y="128" width="23" height="22" fill="#d7e8d0" stroke="#888"/>
  <text x="335.5" y="144" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="11" fill="#222">66</text>
  <rect x="347" y="128" width="23" height="22" fill="#d7e8d0" stroke="#888"/>
  <text x="358.5" y="144" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="11" fill="#222">66</text>
  <rect x="370" y="128" width="23" height="22" fill="#d7e8d0" stroke="#888"/>
  <text x="381.5" y="144" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="11" fill="#222">08</text>
  <rect x="393" y="128" width="23" height="22" fill="#d7e8d0" stroke="#888"/>
  <text x="404.5" y="144" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="11" fill="#222">80</text>
  <rect x="416" y="128" width="23" height="22" fill="#d7e8d0" stroke="#888"/>
  <text x="427.5" y="144" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="11" fill="#222">30</text>
  <rect x="439" y="128" width="23" height="22" fill="#d7e8d0" stroke="#888"/>
  <text x="450.5" y="144" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="11" fill="#222">04</text>
  <text x="360" y="170" text-anchor="middle" fill="#222">9 bytes per reading</text>
</svg>
