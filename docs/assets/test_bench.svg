<svg xmlns="http://www.w3.org/2000/svg" width="720" height="290" viewBox="0 0 720 290" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <title>The bench supply's pytest bench</title>
  <desc>Two processes. The pytest process holds the tests and the dev fixture; the hub_device fixture starts the second process, bench_supply_hub_device, which holds the ww hub and the simulated bench supply. Each test connects through the hub's socket in a private runtime directory.</desc>
  <defs>
    <marker id="tb-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#222"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="720" height="290" rx="10" fill="#ffffff"/>

  <!-- pytest process -->
  <rect x="20" y="20" width="300" height="230" rx="8" fill="#eef2f7" stroke="#222"/>
  <text x="170" y="44" text-anchor="middle" font-weight="bold" fill="#222">pytest</text>
  <g fill="#ffffff" stroke="#1f5f99">
    <rect x="40" y="60" width="260" height="44" rx="6"/>
    <rect x="40" y="124" width="260" height="44" rx="6"/>
    <rect x="40" y="188" width="260" height="44" rx="6"/>
  </g>
  <g fill="#222" text-anchor="middle">
    <text x="170" y="80" font-family="monospace" font-size="12">test_output_refuses_...(dev)</text>
    <text x="170" y="96">one test, one fresh dev</text>
    <text x="170" y="144" font-family="monospace" font-size="12">dev</text>
    <text x="170" y="160">connects, resets channel 0</text>
    <text x="170" y="208" font-family="monospace" font-size="12">hub_device</text>
    <text x="170" y="224">starts the device, once per module</text>
  </g>
  <g stroke="#1f5f99" fill="none">
    <line x1="170" y1="124" x2="170" y2="108" marker-end="url(#tb-arrow)"/>
    <line x1="170" y1="188" x2="170" y2="172" marker-end="url(#tb-arrow)"/>
  </g>

  <!-- device process -->
  <rect x="400" y="20" width="300" height="230" rx="8" fill="#eef2f7" stroke="#222"/>
  <text x="550" y="44" text-anchor="middle" font-weight="bold" fill="#222">bench_supply_hub_device</text>
  <g fill="#ffffff" stroke="#1f5f99">
    <rect x="420" y="76" width="260" height="56" rx="6"/>
    <rect x="420" y="160" width="260" height="56" rx="6"/>
  </g>
  <g fill="#222" text-anchor="middle">
    <text x="550" y="100" font-weight="bold">ww hub</text>
    <text x="550" y="118">serves inproc:bench-supply</text>
    <text x="550" y="184" font-weight="bold">simulated bench supply</text>
    <text x="550" y="202">the same server code as the sim</text>
  </g>
  <line x1="550" y1="132" x2="550" y2="156" stroke="#1f5f99" marker-end="url(#tb-arrow)"/>

  <!-- connections -->
  <path d="M300,146 H360 V104 H416" fill="none" stroke="#222" marker-end="url(#tb-arrow)"/>
  <text x="330" y="138" fill="#555" font-size="12">hub.sock</text>
  <path d="M300,210 H380 V236 H416" fill="none" stroke="#222" stroke-dasharray="6 4" marker-end="url(#tb-arrow)"/>
  <text x="360" y="274" text-anchor="middle" fill="#555" font-size="12">cargo run, with WW_RUNTIME_DIR set to a temporary directory</text>

</svg>
