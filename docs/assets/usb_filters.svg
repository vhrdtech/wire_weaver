<svg xmlns="http://www.w3.org/2000/svg" width="720" height="315" viewBox="0 0 720 315" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <title>What the host reads from a USB device before opening it, and the filters that use it</title>
  <desc>A USB device has string descriptors: its VID and PID, manufacturer, product, serial number and a WireWeaver interface string holding the API id and an optional user label. Each filter of a client config looks at one of them, so the host picks a device without opening it.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b03a2e"/></marker>
  </defs>
  <rect x="0" y="0" width="720" height="315" rx="10" fill="#ffffff"/>
  <rect x="30" y="20" width="250" height="260" rx="6" fill="#f7f9fb" stroke="#222"/>
  <text x="155" y="44" fill="#222" text-anchor="middle" font-weight="bold">A device's descriptors</text>
  <rect x="46" y="64" width="218" height="30" rx="6" fill="#ffffff" stroke="#222"/>
  <text x="155.0" y="84.0" text-anchor="middle" fill="#222" font-size="12">VID:PID  c0de:cafe</text>
  <rect x="46" y="104" width="218" height="30" rx="6" fill="#ffffff" stroke="#222"/>
  <text x="155.0" y="124.0" text-anchor="middle" fill="#222" font-size="12">manufacturer</text>
  <rect x="46" y="144" width="218" height="30" rx="6" fill="#ffffff" stroke="#222"/>
  <text x="155.0" y="164.0" text-anchor="middle" fill="#222" font-size="12">product</text>
  <rect x="46" y="184" width="218" height="30" rx="6" fill="#ffffff" stroke="#222"/>
  <text x="155.0" y="204.0" text-anchor="middle" fill="#222" font-size="12">serial number</text>
  <rect x="46" y="224" width="218" height="30" rx="6" fill="#ffffff" stroke="#222"/>
  <text x="155.0" y="244.0" text-anchor="middle" fill="#222" font-size="12">API id and user label</text>
  <rect x="400" y="64" width="290" height="30" rx="6" fill="#e8f3ea" stroke="#222"/>
  <text x="545.0" y="84.0" text-anchor="middle" fill="#222" font-size="12">usb_vid_pid(0xc0de, 0xcafe)</text>
  <line x1="264" y1="79" x2="398" y2="79" stroke="#222" marker-end="url(#arrow)"/>
  <rect x="400" y="104" width="290" height="30" rx="6" fill="#e8f3ea" stroke="#222"/>
  <text x="545.0" y="124.0" text-anchor="middle" fill="#222" font-size="12">manufacturer_contains(..)</text>
  <line x1="264" y1="119" x2="398" y2="119" stroke="#222" marker-end="url(#arrow)"/>
  <rect x="400" y="144" width="290" height="30" rx="6" fill="#e8f3ea" stroke="#222"/>
  <text x="545.0" y="164.0" text-anchor="middle" fill="#222" font-size="12">product_contains(..)</text>
  <line x1="264" y1="159" x2="398" y2="159" stroke="#222" marker-end="url(#arrow)"/>
  <rect x="400" y="184" width="290" height="30" rx="6" fill="#e8f3ea" stroke="#222"/>
  <text x="545.0" y="204.0" text-anchor="middle" fill="#222" font-size="12">serial_eq(..)  serial_contains(..)</text>
  <line x1="264" y1="199" x2="398" y2="199" stroke="#222" marker-end="url(#arrow)"/>
  <rect x="400" y="224" width="290" height="30" rx="6" fill="#e8f3ea" stroke="#222"/>
  <text x="545.0" y="244.0" text-anchor="middle" fill="#222" font-size="12">implements_api(..)  user_label_eq(..)</text>
  <line x1="264" y1="239" x2="398" y2="239" stroke="#222" marker-end="url(#arrow)"/>
  <text x="545" y="52" fill="#222" text-anchor="middle" font-weight="bold">Filters of a client config</text>
  <text x="30" y="304" fill="#222" font-style="italic" font-size="11">usb_port_chain(..) picks by the physical port instead and survives a device that enumerates again.</text>
</svg>
