<svg xmlns="http://www.w3.org/2000/svg" width="720" height="340" viewBox="0 0 720 340" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <title>Old and new hosts against old and new firmware</title>
  <desc>A grid of two hosts, blinky_api 0.1.0 and 0.1.1, against two firmware versions, 0.1.0 at wire w1.0 and 0.1.1 at wire w1.1. Three pairs work fully. The new host on the old firmware calls led_on and led_off, and refuses led_toggle itself before sending it, because the firmware reported w1.0 when it connected.</desc>
  <rect x="0" y="0" width="720" height="340" rx="10" fill="#ffffff"/>

  <!-- column heads: firmware -->
  <g text-anchor="middle" font-weight="bold" fill="#222">
    <rect x="200" y="20" width="250" height="44" rx="6" fill="#eef2f7" stroke="#222"/>
    <text x="325" y="39">Firmware 0.1.0</text>
    <text x="325" y="56" font-weight="normal">wire w1.0: led_on, led_off</text>
    <rect x="460" y="20" width="250" height="44" rx="6" fill="#eef2f7" stroke="#222"/>
    <text x="585" y="39">Firmware 0.1.1</text>
    <text x="585" y="56" font-weight="normal">wire w1.1: and led_toggle</text>
  </g>

  <!-- row heads: hosts -->
  <g text-anchor="middle" font-weight="bold" fill="#222">
    <rect x="10" y="74" width="180" height="120" rx="6" fill="#eef2f7" stroke="#222"/>
    <text x="100" y="126">Host 0.1.0</text>
    <text x="100" y="144" font-weight="normal">knows led_on, led_off</text>
    <rect x="10" y="204" width="180" height="120" rx="6" fill="#eef2f7" stroke="#222"/>
    <text x="100" y="256">Host 0.1.1</text>
    <text x="100" y="274" font-weight="normal">knows led_toggle too</text>
  </g>

  <!-- cells -->
  <g stroke="#1e7d32" fill="#e8f5e9">
    <rect x="200" y="74" width="250" height="120" rx="6"/>
    <rect x="460" y="74" width="250" height="120" rx="6"/>
    <rect x="460" y="204" width="250" height="120" rx="6"/>
  </g>
  <rect x="200" y="204" width="250" height="120" rx="6" stroke="#b9770e" fill="#fef5e7"/>

  <g text-anchor="middle" fill="#222">
    <text x="325" y="126" font-weight="bold" fill="#1e7d32">works</text>
    <text x="325" y="146">the same API on both sides</text>

    <text x="585" y="126" font-weight="bold" fill="#1e7d32">works</text>
    <text x="585" y="146">the host never calls led_toggle;</text>
    <text x="585" y="164">same line, any revision</text>

    <text x="325" y="240" font-weight="bold" fill="#b9770e">works, but led_toggle</text>
    <text x="325" y="260">led_on and led_off work;</text>
    <text x="325" y="278">led_toggle needs w1.1, the device</text>
    <text x="325" y="296">said w1.0: the host refuses it</text>
    <text x="325" y="314">and sends nothing</text>

    <text x="585" y="256" font-weight="bold" fill="#1e7d32">works</text>
    <text x="585" y="276">the same API on both sides</text>
  </g>
</svg>
