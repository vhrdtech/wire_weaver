<svg xmlns="http://www.w3.org/2000/svg" width="640" height="414" viewBox="0 0 640 414" font-family="Helvetica, Arial, sans-serif" font-size="13">
<title>The thermometer's API as a tree</title>
<desc>Every item of the thermometer's API with the index chain a request to it carries. The array channel holds one Channel per input; the first is shown in full.</desc>
<rect x="0" y="0" width="640" height="414" rx="10" fill="#ffffff"/>
<text x="20" y="24" font-weight="bold" fill="#222">Item</text>
<text x="470" y="24" font-weight="bold" fill="#222">Index chain</text>
<text x="20" y="54" fill="#222" font-weight="bold">Thermo (API root)</text>
<text x="470" y="54" fill="#1f5f99" font-family="monospace"></text>
<path d="M26,58 V76 H42" fill="none" stroke="#999"/>
<text x="46" y="80" fill="#222" font-weight="normal">set_rate: method</text>
<text x="470" y="80" fill="#1f5f99" font-family="monospace">[0]</text>
<path d="M26,58 V102 H42" fill="none" stroke="#999"/>
<text x="46" y="106" fill="#222" font-weight="normal">read_once: method</text>
<text x="470" y="106" fill="#1f5f99" font-family="monospace">[1]</text>
<path d="M26,58 V128 H42" fill="none" stroke="#999"/>
<text x="46" y="132" fill="#222" font-weight="normal">mode: property</text>
<text x="470" y="132" fill="#1f5f99" font-family="monospace">[2]</text>
<path d="M26,58 V154 H42" fill="none" stroke="#999"/>
<text x="46" y="158" fill="#222" font-weight="normal">gain: property</text>
<text x="470" y="158" fill="#1f5f99" font-family="monospace">[3]</text>
<path d="M26,58 V180 H42" fill="none" stroke="#999"/>
<text x="46" y="184" fill="#222" font-weight="normal">samples: stream</text>
<text x="470" y="184" fill="#1f5f99" font-family="monospace">[4]</text>
<path d="M26,58 V206 H42" fill="none" stroke="#999"/>
<text x="46" y="210" fill="#222" font-weight="normal">commands: sink</text>
<text x="470" y="210" fill="#1f5f99" font-family="monospace">[5]</text>
<path d="M26,58 V232 H42" fill="none" stroke="#999"/>
<text x="46" y="236" fill="#b03a2e" font-weight="normal">channel[]: array of Channel</text>
<text x="470" y="236" fill="#1f5f99" font-family="monospace">[6]</text>
<path d="M52,240 V258 H68" fill="none" stroke="#999"/>
<text x="72" y="262" fill="#b03a2e" font-weight="normal">channel[0]</text>
<text x="470" y="262" fill="#1f5f99" font-family="monospace">[6, 0]</text>
<path d="M78,266 V284 H94" fill="none" stroke="#999"/>
<text x="98" y="288" fill="#222" font-weight="normal">enabled: property</text>
<text x="470" y="288" fill="#1f5f99" font-family="monospace">[6, 0, 0]</text>
<path d="M78,266 V310 H94" fill="none" stroke="#999"/>
<text x="98" y="314" fill="#222" font-weight="normal">last: method</text>
<text x="470" y="314" fill="#1f5f99" font-family="monospace">[6, 0, 1]</text>
<path d="M52,240 V336 H68" fill="none" stroke="#999"/>
<text x="72" y="340" fill="#b03a2e" font-weight="normal">channel[1] to channel[3]: the same items</text>
<text x="470" y="340" fill="#1f5f99" font-family="monospace">[6, 1..=3]</text>
<path d="M26,58 V362 H42" fill="none" stroke="#999"/>
<text x="46" y="366" fill="#222" font-weight="normal">indication: Indication</text>
<text x="470" y="366" fill="#1f5f99" font-family="monospace">[7]</text>
<path d="M52,370 V388 H68" fill="none" stroke="#999"/>
<text x="72" y="392" fill="#222" font-weight="normal">mode: property</text>
<text x="470" y="392" fill="#1f5f99" font-family="monospace">[7, 0]</text>
</svg>
