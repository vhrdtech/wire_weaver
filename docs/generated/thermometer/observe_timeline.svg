<svg xmlns="http://www.w3.org/2000/svg" width="720" height="320" viewBox="0 0 720 320" font-family="Helvetica, Arial, sans-serif" font-size="13">
<title>The thermometer's gain observed by a host</title>
<desc>Three lanes over time: the host program, the gain on the device, and the updates the host receives. Each change of the gain, by the host's write or by the device itself, reaches the host as one update.</desc>
<defs><marker id="obs-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f5f99"/></marker></defs>
<rect x="0" y="0" width="720" height="320" rx="10" fill="#ffffff"/>
<text x="20" y="74" font-weight="bold" fill="#222">Host program</text>
<line x1="150" y1="70" x2="680" y2="70" stroke="#999" stroke-dasharray="4 4"/>
<text x="20" y="174" font-weight="bold" fill="#222">Gain on the device</text>
<line x1="150" y1="170" x2="680" y2="170" stroke="#999" stroke-dasharray="4 4"/>
<text x="20" y="264" font-weight="bold" fill="#222">Updates received</text>
<line x1="150" y1="260" x2="680" y2="260" stroke="#999" stroke-dasharray="4 4"/>
<text x="150" y="305" text-anchor="middle" fill="#555">0 s</text>
<text x="362" y="305" text-anchor="middle" fill="#555">1 s</text>
<text x="574" y="305" text-anchor="middle" fill="#555">2 s</text>
<line x1="150" y1="170" x2="362" y2="170" stroke="#b03a2e" stroke-width="3"/>
<text x="256" y="160" text-anchor="middle" fill="#b03a2e">4</text>
<line x1="362" y1="170" x2="574" y2="170" stroke="#b03a2e" stroke-width="3"/>
<text x="468" y="160" text-anchor="middle" fill="#b03a2e">16</text>
<line x1="574" y1="170" x2="680" y2="170" stroke="#b03a2e" stroke-width="3"/>
<text x="627" y="160" text-anchor="middle" fill="#b03a2e">8</text>
<circle cx="150" cy="70" r="5" fill="#222"/>
<text x="150" y="56" text-anchor="middle" fill="#222">observes gain</text>
<line x1="150" y1="76" x2="150" y2="164" stroke="#222" stroke-dasharray="2 3"/>
<line x1="150" y1="174" x2="150" y2="252" stroke="#1f5f99" stroke-width="2" marker-end="url(#obs-arrow)"/>
<circle cx="150" cy="260" r="6" fill="#1f5f99"/>
<text x="160" y="280" fill="#1f5f99">gain 4</text>
<circle cx="362" cy="70" r="5" fill="#222"/>
<text x="362" y="56" text-anchor="middle" fill="#222">writes gain 16</text>
<line x1="362" y1="76" x2="362" y2="164" stroke="#222" stroke-dasharray="2 3"/>
<line x1="362" y1="174" x2="362" y2="252" stroke="#1f5f99" stroke-width="2" marker-end="url(#obs-arrow)"/>
<circle cx="362" cy="260" r="6" fill="#1f5f99"/>
<text x="372" y="280" fill="#1f5f99">gain 16</text>
<circle cx="574" cy="70" r="5" fill="#222"/>
<text x="574" y="56" text-anchor="middle" fill="#222">reads once: the amplifier clips</text>
<line x1="574" y1="76" x2="574" y2="164" stroke="#222" stroke-dasharray="2 3"/>
<line x1="574" y1="174" x2="574" y2="252" stroke="#1f5f99" stroke-width="2" marker-end="url(#obs-arrow)"/>
<circle cx="574" cy="260" r="6" fill="#1f5f99"/>
<text x="584" y="280" fill="#1f5f99">gain 8</text>
</svg>
