[package]
name = "all_gpio"
version = "0.1.0"
edition = "2024"

[dependencies]
all_gpio_api = { path = "../all_gpio_api" }
futures = "0.3"
tokio = { version = "1", features = ["sync", "rt"] }
wire_weaver_client.workspace = true
ww_gpio = { workspace = true, features = ["std"] }
ww_si = { workspace = true, features = ["std"] }

[dev-dependencies]
anyhow = "1"
clap = { version = "4.5", features = ["derive"] }
clap-repl = "0.3"
console = "0.16"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tracing = "0.1"
tracing-subscriber = "0.3"
ww_self = { workspace = true }
