[package]
name = "blinky"
version = "0.1.0"
edition = "2024"

[dependencies]
blinky_api = { path = "../blinky_api" }
tokio = { version = "1", features = ["sync", "rt"] }
wire_weaver.workspace = true
wire_weaver_client.workspace = true

[dev-dependencies]
anyhow = "1"
clap = { version = "4.5", features = ["derive"] }
clap-repl = "0.3"
console = "0.16"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tracing = "0.1"
tracing-subscriber = "0.3"
ww_self = { workspace = true }

[[example]]
name = "blinky_blocking"
path = "examples/blocking.rs"

[[example]]
name = "blinky_simple"
path = "examples/simple.rs"
