[package]
name = "blinky"
version = "0.1.0"
description = "Client of the blinky example device: the project shape a host program copies"
publish = false
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[features]
# RTT through a debug probe, for the blinky_rtt example
rtt = ["wire_weaver_client/rtt"]
# WebSocket, for the blinky_ws example
ws = ["wire_weaver_client/ws"]
# UDP, for the blinky_udp example
udp = ["wire_weaver_client/udp"]

[dependencies]
blinky_api.workspace = true
tokio = { workspace = true, features = ["sync", "rt"] }
wire_weaver.workspace = true
wire_weaver_client.workspace = true

[dev-dependencies]
anyhow.workspace = true
clap = { workspace = true, features = ["derive"] }
console.workspace = true
shlex.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "net", "io-util", "signal"] }
tracing.workspace = true
tracing-subscriber.workspace = true
wire_weaver_client = { workspace = true, features = ["in_process"] }
ww_client_server.workspace = true
ww_device = { workspace = true, features = ["ws"] }
ww_dns_sd = { workspace = true, features = ["mdns", "avahi"] }
ww_self = { workspace = true }

[[example]]
name = "blinky_blocking"
path = "examples/blocking.rs"

[[example]]
name = "blinky_simple"
path = "examples/simple.rs"

[[example]]
name = "blinky_rtt"
path = "examples/rtt.rs"
required-features = ["rtt"]

[[example]]
name = "blinky_ws"
path = "examples/ws.rs"
required-features = ["ws"]

[[example]]
name = "blinky_ws_device"
path = "examples/ws_device.rs"
required-features = ["ws"]

[[example]]
name = "blinky_udp"
path = "examples/udp.rs"
required-features = ["udp"]

[lints]
workspace = true
