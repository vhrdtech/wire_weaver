[package]
name = "blinky_api"
version = "0.1.0"
description = "API of the blinky example device: an LED turned on and off"
publish = false
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

# Wire version of the API (EVO-31): link setup decides on its line, `#[since]` names its revisions
[package.metadata.wire_weaver]
wire = "w1.0"

[features]
std = ["ww_api/std"]
defmt = ["ww_api/defmt", "dep:defmt"]

[dependencies]
defmt = { workspace = true, optional = true }
ww_api = { workspace = true }

[dev-dependencies]
wire_weaver_evolution = { workspace = true, features = ["source"] }

[lints]
workspace = true
