[package]
name = "blinky_api_evolved"
version = "0.1.1"
description = "The blinky example API in a later version, for the evolution checks"
publish = false
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

# Wire version of the API (EVO-31): link setup decides on its line, `#[since]` names its revisions
[package.metadata.wire_weaver]
wire = "w1.1"

[features]
# build against std instead of no_std
std = ["ww_api/std"]
# defmt formatting for the API's types
defmt = ["ww_api/defmt", "dep:defmt"]

[dependencies]
defmt = { workspace = true, optional = true }
ww_api = { workspace = true }

[lints]
workspace = true
