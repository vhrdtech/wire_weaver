[package]
name = "blinky_device"
version = "0.1.0"
description = "The blinky example device: one server for the simulated device on a PC and the firmware of every board"
publish = false
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[package.metadata.cargo-machete]
# the code ww_codegen! generates names shrink_wrap
ignored = ["shrink_wrap"]

[features]
# build against std: owned API types, for a device simulated on a PC
std = ["blinky_api/std", "wire_weaver/std", "ww_client_server/std"]
# defmt formatting for firmware logs
defmt = ["blinky_api/defmt", "wire_weaver/defmt", "ww_device/defmt"]

[dependencies]
blinky_api.workspace = true
embassy-futures.workspace = true
shrink_wrap.workspace = true
wire_weaver.workspace = true
ww_client_server.workspace = true
ww_device.workspace = true
ww_si = { workspace = true, features = ["counting"] }

[lints]
workspace = true
