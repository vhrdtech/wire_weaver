[package]
name = "blinky_evolved"
version = "0.1.0"
description = "Client of the evolved blinky API, run against devices of either version"
publish = false
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[package.metadata.cargo-machete]
# ww_codegen! reads the API crate's source through blinky_api_evolved; the code it generates names ww_si
ignored = ["blinky_api_evolved", "ww_si"]

[dependencies]
blinky_api_evolved.workspace = true
tokio = { workspace = true, features = ["sync", "rt"] }
wire_weaver.workspace = true
wire_weaver_client = { workspace = true, features = ["clock_sync", "usb"] }
ww_si = { workspace = true, features = ["std"] }

[dev-dependencies]
anyhow.workspace = true
clap = { workspace = true, features = ["derive"] }
console.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
tracing.workspace = true
tracing-subscriber.workspace = true
ww_self = { workspace = true, features = ["std"] }

[lints]
workspace = true
