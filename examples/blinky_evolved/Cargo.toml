[package]
name = "blinky_evolved"
version = "0.1.0"
description = "Client of the evolved blinky API, run against devices of either version"
publish = false
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
