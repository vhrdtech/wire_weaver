[package]
name = "compare-wire-formats"
version = "0.5.0"
publish = false
authors = ["Roman Isaikin <romix.lab@gmail.com>"]
description = "WireWeaver is a wire format and API code generator for resource constrained systems."
edition = "2024"
license = "MIT"
repository = "https://github.com/vhrdtech/wire_weaver"

# serde_bytes is named only in `#[serde(with = "serde_bytes")]`, which cargo-machete does not see.
[package.metadata.cargo-machete]
ignored = ["serde_bytes"]

[dependencies]
ciborium = "0.2.2"
planus = "1.3.0"
postcard = "1.1"
prost = "0.14.6"
rasn = "0.30.0"
rmp-serde = "1.3"
serde = { version = "1.0", default-features = false, features = ["derive", "std"] }
serde-wincode = "0.1.2"
serde_bytes = "0.11"
serde_json = "1.0"
wincode = "0.6.3"
wire_weaver = { path = "../../wire_weaver", features = ["std", "serde"] }
