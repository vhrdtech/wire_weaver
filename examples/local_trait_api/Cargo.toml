[package]
name = "local_trait_api"
version = "0.1.0"
publish = false
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

# Wire version of the API (EVO-31): link setup decides on its line, `#[since]` names its revisions
[package.metadata.wire_weaver]
wire = "w1.0"

[features]
default = ["local"]
std = ["wire_weaver/std"]
# The API as an async Rust trait (`Counter`), implemented by a local type and by the generated client (CLT-57);
# its errors and streams are wire_weaver's (`wire_weaver::call`), no client runtime needed (SRV-48)
local = ["std"]

[dependencies]
wire_weaver.workspace = true
