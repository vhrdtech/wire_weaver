[package]
name = "power_stage_api"
version = "0.1.0"
description = "A power converter's values observed at its switching rate, for the high-rate observe benches"
publish = false
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

# Wire version of the API (EVO-31): link setup decides on its line, `#[since]` names its revisions
[package.metadata.wire_weaver]
wire = "w1.0"

[features]
# build against std instead of no_std
std = ["ww_api/std", "ww_si/std"]

[dependencies]
ww_api.workspace = true
ww_si = { workspace = true, features = ["electrical", "i32"] }

[lints]
workspace = true
