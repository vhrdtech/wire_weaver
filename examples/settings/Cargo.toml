[package]
name = "settings"
version = "0.1.0"
description = "Two settings kept across a reboot by ww_settings on a simulated flash"
publish = false
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[package.metadata.cargo-machete]
# the code ww_codegen! generates names ww_si (and exact_units through it)
ignored = ["ww_si"]

[dependencies]
settings_api.workspace = true
tokio = { workspace = true, features = ["sync", "rt", "time", "macros"] }
wire_weaver.workspace = true
wire_weaver_client = { workspace = true, features = ["clock_sync", "in_process", "usb"] }
ww_client_server = { workspace = true, features = ["std"] }
ww_device.workspace = true
ww_settings = { workspace = true, features = ["fake-flash"] }
ww_si = { workspace = true, features = ["std"] }

[dev-dependencies]
anyhow.workspace = true
book_outputs.workspace = true
tokio = { workspace = true, features = ["macros", "test-util"] }

[[example]]
name = "settings_reboot"
path = "examples/reboot.rs"

[lints]
workspace = true
