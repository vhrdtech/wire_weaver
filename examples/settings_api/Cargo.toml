[package]
name = "settings_api"
version = "0.1.0"
description = "API of the settings example: two settings kept across a reboot"
publish = false
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

# Wire version of the API (EVO-31): link setup decides on its line, `#[since]` names its revisions
[package.metadata.wire_weaver]
wire = "w1.0"

[features]
# build against std instead of no_std
std = ["ww_api/std", "ww_settings/std"]
# defmt formatting for the API's types
defmt = ["ww_api/defmt", "ww_settings/defmt", "dep:defmt"]

[dependencies]
defmt = { workspace = true, optional = true }
ww_api = { workspace = true }
ww_settings.workspace = true

[lints]
workspace = true
