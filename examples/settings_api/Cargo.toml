[package]
name = "settings_api"
version = "0.1.0"
publish = false
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

# Wire version of the API (EVO-31): link setup decides on its line, `#[since]` names its revisions
[package.metadata.wire_weaver]
wire = "w1.0"

[features]
std = ["wire_weaver/std", "ww_settings/std"]
defmt = ["wire_weaver/defmt", "ww_settings/defmt", "dep:defmt"]

[dependencies]
defmt = { workspace = true, optional = true }
wire_weaver = { workspace = true }
ww_settings.workspace = true
