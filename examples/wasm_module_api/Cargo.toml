[package]
name = "wasm_module_api"
version = "0.1.0"
description = "API of the wasm module example: a calculator a firmware serves from a wasm module in a mount slot"
publish = false
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

# Wire version of the API (EVO-31): link setup decides on its line, `#[since]` names its revisions
[package.metadata.wire_weaver]
wire = "w1.0"

[features]
# build against std instead of no_std
std = ["ww_api/std"]

[dependencies]
ww_api = { workspace = true }

[lints]
workspace = true
