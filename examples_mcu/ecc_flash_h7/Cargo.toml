[package]
name = "ecc_flash_h7"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
cortex-m = { version = "0.7", features = ["critical-section-single-core"] }
cortex-m-rt = "0.7"
defmt = "1.1"
defmt-rtt = "1.3"
panic-probe = { version = "1.0", features = ["print-defmt"] }
embassy-stm32 = { version = "0.6", features = ["defmt", "stm32h725ig", "unstable-pac"] }
embedded-storage = "0.3"
ww_ecc_flash = { path = "../../mcu/ww_ecc_flash", features = ["stm32h7", "defmt"] }

[profile.dev]
codegen-units = 1
debug = 2
debug-assertions = true
incremental = false
opt-level = 3
overflow-checks = true

[profile.release]
codegen-units = 1
debug = 2
debug-assertions = false
incremental = false
lto = "fat"
opt-level = 3
overflow-checks = false
