# the profile of the shipped firmware (usb_stm32h725ig's release): the units budget (TEST-27) is measured at it
[profile.fw-z]
inherits = "release"
codegen-units = 1
lto = "fat"
opt-level = "z"

# the same at opt-level 3, to see what `z` costs in speed
[profile.fw-3]
inherits = "fw-z"
opt-level = 3
