[package]
name = "mcu_qemu"
version = "0.1.0"
edition = "2024"

[features]
# `f32` is on by default (bins use float quantities); the no-float group of the no-f64 guard (TEST-33) builds with
# `--no-default-features`, as a firmware that doesn't opt into floats does
default = ["f32"]
f32 = ["ww_si/f32"]
# the units budget (TEST-27) with only the plain cases / only the Fixed cases, to compare the flash of the two
only-plain = []
only-fixed = []
# the flash budget servers (TEST-30) with `use_async = true` and sync handlers, as Donguru's
flash-async = []
# the no-f64 guard (TEST-33) with a 64-bit number type enabled too, as usb_io_fw's firmware has
guard-u64 = ["ww_si/u64"]
# counted streams and credit sinks (qemu-ww-gpio, qemu-global-paths); the flash and dispatch budgets build without
# it, as a firmware with only plain streams does
streams = ["ww_client_server/streams", "ww_stream/streams"]

[dependencies]
cortex-m = "0.7"
cortex-m-rt = "0.7"
cortex-m-semihosting = "0.6"
panic-semihosting = { version = "0.7", features = ["exit"] }
static_cell = "2.1"

wire_weaver = { path = "../../wire_weaver", default-features = false, features = ["defmt"] }
ww_client_server = { path = "../../ww_stdlib/ww_client_server", default-features = false }
ww_stream = { path = "../../ww_stream", default-features = false }
ww_framer = { path = "../../ww_framer" }
ww_link = { path = "../../ww_link" }
# for its crc-table-* features (the CRC-32 of ww_link's UDP framing), e.g. `--features ww_block/crc-table-256`
ww_block = { path = "../../ww_stdlib/ww_block", default-features = false }
ww_bus_slave = { path = "../../ww_bus_slave" }
ww_i2c = { path = "../../ww_stdlib/ww_i2c", default-features = false }
ww_spi = { path = "../../ww_stdlib/ww_spi", default-features = false }
ww_gpio = { path = "../../ww_stdlib/ww_gpio", default-features = false }
ww_si = { path = "../../ww_stdlib/ww_si", default-features = false, features = ["electrical", "angle", "dimensionless", "information", "counting", "time", "i32", "u32"] }
all_gpio_api = { path = "../../examples/all_gpio_api", default-features = false }
bounded_api = { path = "../../tests/bounded_api", default-features = false }
foc_observe_api = { path = "../../examples/foc_observe_api", default-features = false }
dfu_api = { path = "../../tests/dfu_api", default-features = false }
flash_budget_api = { path = "../../tests/flash_budget_api", default-features = false }
ww_dfu = { path = "../../ww_stdlib/ww_dfu", default-features = false }

# Cortex-M0 has no compare-and-swap: ww_stream's atomics go through critical sections there (the units budget is also
# built for thumbv6m, TEST-27)
[target.thumbv6m-none-eabi.dependencies]
portable-atomic = { version = "1", default-features = false, features = ["critical-section"] }
cortex-m = { version = "0.7", features = ["critical-section-single-core"] }

# to solve "can't find crate for test on IntelliJ"
