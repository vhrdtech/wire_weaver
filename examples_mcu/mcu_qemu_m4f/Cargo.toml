[package]
name = "mcu_qemu_m4f"
version = "0.1.0"
edition = "2024"

[dependencies]
cortex-m = "0.7"
cortex-m-rt = "0.7"
cortex-m-semihosting = "0.6"
panic-semihosting = { version = "0.7", features = ["exit"] }

wire_weaver = { path = "../../wire_weaver", default-features = false, features = ["defmt"] }
ww_si = { path = "../../ww_stdlib/ww_si", default-features = false, features = ["electrical", "angle", "dimensionless", "time", "i32", "u32"] }

[[bin]]
name = "qemu-m4f-series-encode-cpu-smallest"
path = "src/bin/series_encode_cpu_smallest.rs"
test = false
doctest = false
bench = false

[[bin]]
name = "qemu-m4f-series-encode-cpu-fixed-delta"
path = "src/bin/series_encode_cpu_fixed_delta.rs"
test = false
doctest = false
bench = false

[[bin]]
name = "qemu-m4f-series-encode-cpu-fixed-dod"
path = "src/bin/series_encode_cpu_fixed_dod.rs"
test = false
doctest = false
bench = false

[[bin]]
name = "qemu-m4f-series-encode-cpu-delta-packed"
path = "src/bin/series_encode_cpu_delta_packed.rs"
test = false
