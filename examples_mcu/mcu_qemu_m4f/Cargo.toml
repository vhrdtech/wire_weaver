[package]
name = "mcu_qemu_m4f"
version = "0.1.0"
edition = "2024"

[dependencies]
cortex-m = { version = "0.7", features = ["critical-section-single-core"] }
cortex-m-rt = "0.7"
cortex-m-semihosting = "0.6"
panic-semihosting = { version = "0.7", features = ["exit"] }
static_cell = "2.1"

wire_weaver = { path = "../../wire_weaver", default-features = false, features = ["defmt"] }
ww_si = { path = "../../ww_stdlib/ww_si", default-features = false, features = ["electrical", "angle", "dimensionless", "time", "i32", "u32"] }
ww_client_server = { path = "../../ww_stdlib/ww_client_server", default-features = false }
ww_stream = { path = "../../ww_stream", default-features = false }
foc_observe_api = { path = "../../examples/foc_observe_api", default-features = false }
power_stage_api = { path = "../../examples/power_stage_api", default-features = false }

[[bin]]
name = "qemu-m4f-series-encode-cpu-smallest"
path = "src/bin/series_encode_cpu_smallest.rs"
test = false
doctest = false
bench = false

[[bin]]
name = "qemu-m4f-series-encode-cpu-fixed-delta"
