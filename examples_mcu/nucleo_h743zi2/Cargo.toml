[package]
name = "nucleo_h743zi2"
license = "MIT"
version = "0.1.0"
edition = "2024"

[dependencies]
cortex-m-rt = "0.7"
cnt = "0.4"
defmt = "1.1"
defmt-rtt = "1.3" # consider disable-blocking-mode
panic-probe = { version = "1.0", features = ["print-defmt"] }

cortex-m = { version = "0.7", features = ["critical-section-single-core"] }
embassy-stm32 = { version = "0.6", features = ["defmt", "stm32h743zi", "unstable-pac", "exti", "time-driver-tim2"] }
stm32-metapac = { version = "21", features = ["stm32h743zi"] }

embassy-executor = { version = "0.10", features = [
    "nightly",
    "platform-cortex-m",
    "executor-thread",
    "executor-interrupt",
    "defmt",
] }
embassy-time = { version = "0.5.0", features = ["defmt", "defmt-timestamp-uptime", "tick-hz-32_768"] }
embassy-sync = { version = "0.8", features = ["defmt"] }
embassy-usb = { version = "0.6", features = ["defmt"] }
embassy-futures = "0.1"
static_cell = "2.1"

blinky_api = { path = "../../examples/blinky_api", default-features = false }
blinky_device = { path = "../../examples/blinky_device", features = ["defmt"] }
settings_api = { path = "../../examples/settings_api", default-features = false, features = ["defmt"], optional = true }
wire_weaver_usb_embassy = { path = "../../mcu/wire_weaver_usb_embassy" }
wire_weaver = { path = "../../wire_weaver", default-features = false, features = ["defmt"] }
ww_client_server = { path = "../../ww_client_server", default-features = false }
ww_settings = { path = "../../ww_settings/ww_settings", default-features = false, features = ["defmt"], optional = true }
ww_si = { git = "https://github.com/vhrdtech/ww_base", default-features = false, features = ["electrical", "f32"] }

[features]
# settings_api::SettingsDemo kept in flash through ww_settings, for the settings bin
settings = ["dep:settings_api", "dep:ww_settings"]

[[bin]]
name = "nucleo-h743zi2-blinky"
path = "src/bin/blinky.rs"
test = false
doctest = false
bench = false

[[bin]]
name = "nucleo-h743zi2-no-introspect"
path = "src/bin/no_introspect.rs"
test = false
doctest = false
bench = false

[[bin]]
name = "nucleo-h743zi2-settings"
path = "src/bin/settings.rs"
required-features = ["settings"]
test = false
doctest = false
bench = false

# see for more info: https://docs.rust-embedded.org/book/unsorted/speed-vs-size.html
# cargo build/run
[profile.dev]
codegen-units = 1
debug = 2 # full debug info
debug-assertions = true
incremental = false
opt-level = 3
#opt-level = "s"
overflow-checks = true

# cargo test
[profile.test]
codegen-units = 1
debug = 2
debug-assertions = true
incremental = false
opt-level = 3
#opt-level = "s"
overflow-checks = true

# cargo build/run --release
[profile.release]
codegen-units = 1
debug = 2
debug-assertions = false
incremental = false
lto = 'fat'
opt-level = "z" # 3 - speed, s - size, z - even less size
#opt-level = "s"
overflow-checks = false

# cargo test --release
[profile.bench]
codegen-units = 1
debug = 2
debug-assertions = false
incremental = false
lto = 'fat'
opt-level = 3
#opt-level = "s"
overflow-checks = false

# do not optimize proc-macro crates = faster builds from scratch
[profile.dev.build-override]
codegen-units = 8
debug = false
debug-assertions = false
opt-level = 0
overflow-checks = false

[profile.release.build-override]
codegen-units = 8
debug = false
debug-assertions = false
opt-level = 0
overflow-checks = false

# Firmware: the runtime's entry, interrupt handlers, linker sections and registers are unsafe code
# (`unsafe = true` in layers.toml).
[lints.rust]
unsafe_code = "allow" # unsafe = true in layers.toml: the workspace forbids it elsewhere
