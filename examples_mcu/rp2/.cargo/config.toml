[target.'cfg(all(target_arch = "arm", target_os = "none"))']
runner = "probe-rs run --chip RP235x"
#runner = "elf2uf2-rs -d"
#runner = "picotool load -u -v -x -t elf"

[build]
target = "thumbv8m.main-none-eabihf"

# Enable incremental compilation for all examples to speed-up the CI
#incremental = true

[env]
DEFMT_LOG = "debug" # By default, only error level messages are emitted
DEFMT_RTT_BUFFER_SIZE = "4096" # avoid loosing output if non-blocking, e.g., during init when a lot of output is generated
CNT_RAM_BUFFER_SIZE_WORDS = "256" # Size of the counters buffer in RAM (words, default is 64)
#CNT_BKP_BUFFER_SIZE_WORDS = "64" #Size of the counters buffer in BKPRAM (words, default is 0)

# Minimize build size
#[unstable]
#build-std = ["core"]
#build-std-features = ["panic_immediate_abort"] # for even smaller size
