[package]
name = "rp2"
edition = "2024"
version = "0.1.0"

[dependencies]
#cortex-m = { version = "0.7.6", features = ["critical-section-single-core"] }
cortex-m = { version = "0.7.6", features = ["inline-asm"] }
#cortex-m-rt = { version = "0.7.0", features = ["paint-stack"] } paint-stack crashes with BusFault
cortex-m-rt = "0.7.0"

critical-section = "1.1"

embassy-embedded-hal = { version = "0.6.0", features = ["defmt"] }
embassy-sync = { version = "0.8.0", features = ["defmt"] }
embassy-executor = { version = "0.10.0", features = ["platform-cortex-m", "executor-thread", "executor-interrupt", "defmt"] }
embassy-time = { version = "0.5.1", features = ["defmt", "defmt-timestamp-uptime"] }
embassy-rp = { version = "0.10.0", features = ["defmt", "unstable-pac", "time-driver", "critical-section-impl", "rp235xa", "binary-info"] }
embassy-usb = { version = "0.6.0", features = ["defmt"], optional = true }
embassy-futures = { version = "0.1.2" }
embassy-net = { version = "0.9", features = ["defmt", "tcp", "udp", "proto-ipv4", "medium-ethernet"], optional = true }
edge-dhcp = { version = "0.8", default-features = false, features = ["io", "defmt"], optional = true }
edge-nal = { version = "0.7", optional = true }
edge-nal-embassy = { version = "0.9", default-features = false, features = ["defmt", "proto-ipv4", "medium-ethernet", "udp"], optional = true }

#embassy-embedded-hal = { path = "../../embassy/embassy-embedded-hal", features = ["defmt"] }
#embassy-sync = { path = "../../embassy/embassy-sync", features = ["defmt"] }
#embassy-executor = { path = "../../embassy/embassy-executor", features = ["platform-cortex-m", "executor-thread", "executor-interrupt", "defmt"] }
#embassy-time = { path = "../../embassy/embassy-time", features = ["defmt", "defmt-timestamp-uptime"] }
#embassy-rp = { path = "../../embassy/embassy-rp", features = ["defmt", "unstable-pac", "time-driver", "critical-section-impl", "rp235xa", "binary-info"] }
#embassy-usb = { path = "../../embassy/embassy-usb", features = ["defmt"] }
#embassy-futures = { path = "../../embassy/embassy-futures" }

defmt = "1.1"
defmt-rtt = { version = "1.3", features = ["disable-blocking-mode"], optional = true }
rtt-target = { version = "0.6", features = ["defmt"], optional = true }
panic-probe = { version = "1.0", features = ["print-defmt"] }
static_cell = "2.1"

blinky_api = { path = "../../examples/blinky_api", default-features = false }
wire_weaver_usb_embassy = { path = "../../mcu/wire_weaver_usb_embassy", optional = true }
ww_device = { path = "../../ww_device", features = ["defmt", "embassy-time"] }
wire_weaver = { path = "../../wire_weaver", default-features = false, features = ["defmt"] }
ww_client_server = { path = "../../ww_stdlib/ww_client_server", default-features = false }

[features]
default = ["defmt_rtt"]
defmt_rtt = ["dep:defmt-rtt"]
rtt_target = ["dep:rtt-target", "ww_device/rtt"]
usb = ["dep:embassy-usb", "dep:wire_weaver_usb_embassy"]
ws_ncm = ["dep:embassy-usb", "dep:embassy-net", "dep:edge-dhcp", "dep:edge-nal", "dep:edge-nal-embassy", "ww_device/embassy-net"]

[[bin]]
name = "rp2_blinky"
path = "src/bin/blinky.rs"
test = false
doctest = false
bench = false

[[bin]]
name = "rp2_usb_blinky"
path = "src/bin/usb_blinky.rs"
required-features = ["usb"]
test = false
doctest = false
bench = false

[[bin]]
name = "rp2_ww_ws_ncm"
path = "src/bin/ww_ws_ncm.rs"
required-features = ["ws_ncm"]
test = false
doctest = false
bench = false

[[bin]]
name = "rp2_ww_rtt"
path = "src/bin/ww_rtt.rs"
required-features = ["rtt_target"]
test = false
doctest = false
bench = false
