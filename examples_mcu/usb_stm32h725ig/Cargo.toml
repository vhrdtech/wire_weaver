[package]
name = "usb_fdcan_h725ig"
license = "MIT"
version = "0.1.0"
edition = "2024"

[features]
# the dispatch bench's server (`mcu_qemu/src/flash_budget.rs`) asks for it; only the sync server is built here
flash-async = []
# the units budget (`mcu_qemu/src/unit_budget.rs`) with only the plain cases / only the Fixed cases
only-plain = []
only-fixed = []
# the wasm slot firmware's interpreters (`src/bin/wasm_slot`): either one alone for its flash and RAM
wasefire = ["dep:ww_wasm", "ww_wasm/wasefire"]
wasmi = ["dep:ww_wasm", "ww_wasm/wasmi"]

[dependencies]
cortex-m-rt = "0.7"
cnt = "0.4"
defmt = "1.1"
defmt-rtt = "1.3" # consider disable-blocking-mode
panic-probe = { version = "1.0", features = ["print-defmt"] }

cortex-m = { version = "0.7", features = ["critical-section-single-core"] }
embassy-stm32 = { version = "0.6", features = ["defmt", "stm32h725ig", "unstable-pac", "exti", "time-driver-tim2"] }
stm32-metapac = { version = "21", features = ["stm32h725ig"] }

embassy-executor = { version = "0.10", features = [
    "nightly",
    "platform-cortex-m",
    "executor-thread",
    "executor-interrupt",
    "defmt",
] }
embassy-time = { version = "0.5.0", features = ["defmt", "defmt-timestamp-uptime", "tick-hz-32_768"] }
embassy-sync = { version = "0.8", features = ["defmt"] }
embassy-futures = "0.1"
embassy-usb = { version = "0.6", features = ["defmt"] }
static_cell = "2.1"
bedrock_led = { git = "https://github.com/romixlab/embedded_bedrock", features = ["embassy", "defmt"] }

blinky_device = { path = "../../examples/blinky_device", features = ["defmt"] }
foc_observe_api = { path = "../../examples/foc_observe_api", default-features = false }
power_stage_api = { path = "../../examples/power_stage_api", default-features = false }
wire_weaver_usb_embassy = { path = "../../mcu/wire_weaver_usb_embassy" }
wire_weaver = { path = "../../wire_weaver", default-features = false, features = ["defmt"] }
ww_client_server = { path = "../../ww_client_server", default-features = false }
ww_stream = { path = "../../ww_stream", default-features = false }
flash_budget_api = { path = "../../tests/flash_budget_api", default-features = false }
wasm_slot_api = { path = "../../examples/wasm_slot_api", default-features = false }
ww_device = { path = "../../ww_device", features = ["defmt"] }
ww_wasm = { path = "../../ww_wasm", features = ["defmt"], optional = true }
embedded-alloc = { version = "0.7", default-features = false, features = ["llff"] }
ww_si = { git = "https://github.com/vhrdtech/ww_base", default-features = false, features = ["electrical", "angle", "dimensionless", "time", "f32", "u32", "i32"] }

[[bin]]
name = "stm32h725ig-blinky"
path = "src/bin/blinky.rs"
test = false
doctest = false
bench = false

# see for more info: https://docs.rust-embedded.org/book/unsorted/speed-vs-size.html
# cargo build/run
[profile.dev]
codegen-units = 1
debug = 2 # full debug info
debug-assertions = true
incremental = false
opt-level = 3
#opt-level = "s"
overflow-checks = true

# cargo test
[profile.test]
codegen-units = 1
debug = 2
debug-assertions = true
incremental = false
opt-level = 3
#opt-level = "s"
overflow-checks = true

# cargo build/run --release
[profile.release]
codegen-units = 1
debug = 2
debug-assertions = false
incremental = false
lto = 'fat'
opt-level = "z" # 3 - speed, s - size, z - even less size
#opt-level = "s"
overflow-checks = false

# cargo test --release
[profile.bench]
codegen-units = 1
debug = 2
debug-assertions = false
incremental = false
lto = 'fat'
opt-level = 3
#opt-level = "s"
overflow-checks = false

# do not optimize proc-macro crates = faster builds from scratch
[profile.dev.build-override]
codegen-units = 8
debug = false
debug-assertions = false
opt-level = 0
overflow-checks = false

[profile.release.build-override]
codegen-units = 8
debug = false
debug-assertions = false
opt-level = 0
overflow-checks = false

[[bin]]
name = "stm32h725ig-series-encode-cycles"
path = "src/bin/series_encode_cycles.rs"
test = false
doctest = false
bench = false

[[bin]]
name = "stm32h725ig-dyn-prefix-cycles"
path = "src/bin/dyn_prefix_cycles.rs"
test = false
doctest = false
bench = false

[[bin]]
name = "stm32h725ig-shared-clock-cycles"
path = "src/bin/shared_clock_cycles.rs"
test = false
doctest = false
bench = false

[[bin]]
name = "stm32h725ig-memcpy-columns-cycles"
path = "src/bin/memcpy_columns_cycles.rs"
test = false
doctest = false
bench = false

[[bin]]
name = "stm32h725ig-foc-observe-cycles"
path = "src/bin/foc_observe_cycles.rs"
test = false
doctest = false
bench = false

[[bin]]
name = "stm32h725ig-high-rate-cycles"
path = "src/bin/high_rate_cycles.rs"
test = false
doctest = false
bench = false

[[bin]]
name = "stm32h725ig-bit-io-cycles"
path = "src/bin/bit_io_cycles.rs"
test = false
doctest = false
bench = false

[[bin]]
name = "stm32h725ig-dispatch-cycles"
path = "src/bin/dispatch_cycles.rs"
test = false
doctest = false
bench = false

[[bin]]
name = "stm32h725ig-unit-budget-cycles"
path = "src/bin/unit_budget_cycles.rs"
test = false
doctest = false
bench = false

# Firmware: the runtime's entry, interrupt handlers, linker sections and registers are unsafe code
# (`unsafe = true` in layers.toml).
[lints.rust]
unsafe_code = "allow" # unsafe = true in layers.toml: the workspace forbids it elsewhere

[[bin]]
name = "stm32h725ig-wasm-slot"
path = "src/bin/wasm_slot/main.rs"
test = false
doctest = false
bench = false
