[package]
name = "fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
arbitrary = { version = "1", features = ["derive"] }
shrink_wrap = { path = "../shrink_wrap/shrink_wrap" }
ww_framer = { path = "../ww_framer", features = ["large", "very_large"] }

[[bin]]
name = "framer-tx-rx"
path = "src/framer_tx_rx.rs"
test = false
doc = false
bench = false

[[bin]]
name = "shrink-wrap-tail-size"
path = "src/shrink_wrap_tail_size.rs"
test = false
doc = false
bench = false

[[bin]]
name = "shrink-wrap-series"
path = "src/shrink_wrap_series.rs"
test = false
doc = false
bench = false

[[bin]]
name = "shrink-wrap-ref-vec"
path = "src/shrink_wrap_ref_vec.rs"
test = false
doc = false
bench = false

[[bin]]
name = "shrink-wrap-latched"
path = "src/shrink_wrap_latched.rs"
test = false
doc = false
bench = false

[[bin]]
name = "shrink-wrap-option-any-vec"
path = "src/shrink_wrap_option_any_vec.rs"
test = false
doc = false
bench = false

[[bin]]
name = "shrink-wrap-series-columns"
path = "src/shrink_wrap_series_columns.rs"
test = false
doc = false
bench = false
