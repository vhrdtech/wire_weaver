[package]
name = "fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
arbitrary = { version = "1", features = ["derive"] }
shrink_wrap = { path = "../shrink_wrap/shrink_wrap" }
ww_framer = { path = "../ww_framer", features = ["large", "very_large"] }
ww_self = { path = "../ww_self" }
ww_stream = { path = "../ww_stream", features = ["std"] }
ww_tape = { path = "../ww_tape" }

[[bin]]
name = "framer-tx-rx"
path = "src/framer_tx_rx.rs"
test = false
doc = false
bench = false

[[bin]]
name = "shrink-wrap-tail-size"
path = "src/shrink_wrap_tail_size.rs"
test = false
doc = false
bench = false

