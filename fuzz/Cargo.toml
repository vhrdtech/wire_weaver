[package]
name = "fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
arbitrary = { version = "1", features = ["derive"] }
ww_framer = { path = "../ww_framer", features = ["large", "very_large"] }
ww_link = { path = "../ww_link", features = ["std"] }
ww_self = { path = "../ww_self" }
ww_stream = { path = "../ww_stream", features = ["std"] }

[[bin]]
name = "framer-tx-rx"
path = "src/framer_tx_rx.rs"
test = false
doc = false
bench = false

[[bin]]
name = "framer-lossy"
path = "src/framer_lossy.rs"
test = false
doc = false
bench = false

[[bin]]
name = "introspection"
path = "src/introspection.rs"
test = false
doc = false
bench = false

[[bin]]
name = "series-dynamic"
path = "src/series_dynamic.rs"
test = false
doc = false
bench = false

[[bin]]
name = "batch-seal"
path = "src/batch_seal.rs"
test = false
doc = false
bench = false

[[bin]]
name = "link-hello"
path = "src/link_hello.rs"
test = false
doc = false
bench = false
