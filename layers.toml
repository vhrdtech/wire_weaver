# Layer lint (TEST-36, tests/layers_lint): the target layer, 4 to 7, of every crate in every workspace
# of this repo: the root workspace, mcu/, examples_mcu/*, fuzz/ and wire_weaver_tool/
# (docs/evolution/crate_layers.md). A crate the test finds through `cargo metadata` but not listed
# here fails it.
#
# Layer 0 (shrink_wrap), layer 1 (exact_units), layer 2 (the base types and identity crates of
# vhrdtech/ww_base: ww_si, ww_numeric, ww_version, ww_global, ww_error, ww_date_time, ww_keyed, ww_crc)
# and layer 3 (storage: ww_tape of vhrdtech/ww_tape) are their own repositories, taken by git, so they
# never appear here; so is layer 6, the standard APIs with their helpers and tools (vhrdtech/ww_stdlib).
# Layer 7, the shipped tools (the ww binary and the Python wheel), is vhrdtech/ww_tools: no crate of it is here.
#
# A lower-layer crate may not depend on a higher-layer one (tests/layers_lint fails any such edge,
# normal, build or dev, that `[[allow]]` below does not name); same-layer edges are fine.

[layers]
# Layer 4 — API description
wire_weaver_core = 4
wire_weaver_derive = 4
wire_weaver_evolution = 4
ww_lz4 = 4
ww_snapshots = 4
ww_api = 4
