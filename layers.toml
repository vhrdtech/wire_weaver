# API crates (R1): a crate that defines `#[ww_trait]` APIs describes an API and never runs one. Its normal
# dependencies, direct or transitive, reach no layer-5 crate (`wire_weaver` first of all) beyond what `ww_api`'s
# own closure holds. tests/layers_lint `api_crates_are_free_of_the_runtime` checks each crate named here.

[api]
crates = [
    "counted_stream_api",
    "follow_reboot_api",
    "global_boot_api",
    "global_fixture_api",
    "global_paths_api",
    "skipped_dep_api",
    "skipped_root_api",
    "wire_line_fixture_api",
    "ww_hub_api",
    "ww_timebase",
]

# Runtime crates an API crate still reaches, each with the refactor that removes it, as `[[api.allow]]` entries
# (`from`, `reaches`, `refactor`); an entry no longer reached fails the test. None is left.

# Known upward edges, as `[[allow]]` entries (`from`, `to`, `refactor`), each removed by the refactor named in it.
# None is left. An edge no longer present in `cargo metadata` fails the test: drop its entry in the same change
# that lands the refactor removing it.
