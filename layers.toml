# The crate map of this repository: the layer of every crate in every workspace (the root workspace, mcu/,
# examples_mcu/*, fuzz/ and wire_weaver_tool/), which layers each layer may depend on, and the crates of other
# repositories taken by git (docs/evolution/crate_layers.md). spirit_level reads it as its crate map
# (spirit_level.toml `[map-file]`); tests/layers_lint (TEST-36) reads it too, with its own `[api]` and `[[allow]]`
# tables. A crate `cargo metadata` finds but the map does not list fails both.
#
# The numbered layers of the stack: 0 the wire format (shrink_wrap), 1 units (exact_units), 2 the base types and
# identity crates (vhrdtech/ww_base: ww_si, ww_numeric, ww_version, ww_global, ww_error, ww_date_time, ww_keyed,
# ww_crc), 3 storage (ww_tape of vhrdtech/ww_tape), 4 API description, 5 framework runtime and host, 6 the standard
# APIs (vhrdtech/ww_stdlib) and 7 the shipped tools (the ww binary and the Python wheel, vhrdtech/ww_tools). Layers 0
# to 3 are other repositories, listed under `[external]`; 6 and 7 build on this repository, so nothing here takes
# them. A crate may depend on its own layer and the layers below it (tests/layers_lint holds normal, build and dev
# edges to that unless `[[allow]]` below names the edge; spirit_level's layer-edges checks normal and build edges).

[layers.wire_format]
desc = "Layer 0, the wire format: shrink_wrap (romixlab/shrink_wrap)"
allow = ["wire_format"]
licence = "MIT"

[layers.units]
desc = "Layer 1, units and Fixed: exact_units (romixlab/exact_units)"
allow = ["wire_format", "units"]
licence = "MIT"

[layers.base]
desc = "Layer 2, the base types and identity crates (vhrdtech/ww_base)"
allow = ["wire_format", "units", "base"]
licence = "MIT"

[layers.storage]
desc = "Layer 3, storage: the tape format (vhrdtech/ww_tape)"
allow = ["wire_format", "units", "base", "storage"]
licence = "MIT"

[layers.api_description]
desc = "Layer 4, API description: the API model, codegen, the derive macros, snapshots and the evolution checker"
allow = ["wire_format", "units", "base", "storage", "api_description"]
licence = "MIT"

[layers.runtime]
desc = "Layer 5, framework runtime and host, with its tests, examples, benches and firmware examples"
allow = ["wire_format", "units", "base", "storage", "api_description", "runtime"]
licence = "MIT"

