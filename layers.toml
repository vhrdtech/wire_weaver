# Layer lint (TEST-36, tests/layers_lint): the target layer, 0 to 6, of every crate in every workspace
# of this repo: the root workspace, mcu/, examples_mcu/*, fuzz/, wire_weaver_tool/ and ww_tools/
# (docs/evolution/crate_layers.md). A crate the test finds through `cargo metadata` but not listed
# here fails it.
#
# Layer 1 (exact_units) and layer 7 (applications: logring, eventfull, firmware repos) are not
# workspace crates of this repo; the layer-7 crates of ww_tools/ link some of them ([outside] below).
#
# A lower-layer crate may not depend on a higher-layer one (tests/layers_lint fails any such edge,
# normal, build or dev, that `[[allow]]` below does not name); same-layer edges are fine.

[layers]
