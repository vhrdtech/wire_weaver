[workspace]
resolver = "3"

members = [
    "wire_weaver_usb_embassy",
    "ww_ecc_flash",
]

[workspace.dependencies]
wire_weaver = { version = "0.5.0", path = "../wire_weaver", default-features = false, features = ["defmt"] }
ww_device = { version = "0.5.0", path = "../ww_device" }

[workspace.lints.cargo]
unused_workspace_dependencies = "deny"

[workspace.lints.rust]
# Only the crates layers.toml marks `unsafe = true` allow it, in a [lints] table of their own (unsafe-allow-list).
unsafe_code = "forbid"
