[project]
name = "wire-weaver"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "mkdocs>=1.6.1",
    "mkdocs-material>=9.6.23",
    "rust-just>=1.43.0",
]

# The docs site's own Markdown extensions (docs_ext/ww_docs_ext), importable by zensical through this project
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["docs_ext/ww_docs_ext"]

[dependency-groups]
dev = ["pytest>=8"]
