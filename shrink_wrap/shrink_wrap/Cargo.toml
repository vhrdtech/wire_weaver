[package]
name = "shrink_wrap"
edition.workspace = true
version = "0.2.0"
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Compact zero-copy wire format for microcontrollers using no allocator and supporting dynamic types."
readme = "../README.md"

[package.metadata.wire_weaver]
# its line is the GENERATION in the link setup hello (EVO-23): a wire break bumps it
wire = "w1.0"

[features]
default = ["std"]
std = ["fast-io", "refused", "serde/std"]
# A `validate` hook's refusal with its numbers (the value and the range) kept in a reader's slot, for
# `from_ww_bytes_explained` (SW-76): a pointer more in `BufReader`. On with `std`; a firmware without it pays nothing
refused = []
# The per-item read and write primitives forced inline and the reader and writer constructors inlined: faster, a few KB
# larger in a firmware built for size. On with `std`; firmware opts in (docs/serdes/code_size.md)
fast-io = []
# The bit primitives and Series loops get `#[optimize(speed)]`, for a firmware built at opt-level z. Needs Rust 1.101
# or a nightly compiler, ignored with a warning on an older stable one (build.rs). Independent of `fast-io`; with both,
# the helpers are forced inline as well
optimize-speed = []
serde = ["dep:serde"]

defmt = ["dep:defmt"]

[dependencies]
defmt = { workspace = true, optional = true }
either = { version = "1", default-features = false }
paste = "1"
serde = { workspace = true, optional = true }
shrink_wrap_derive.workspace = true

[dev-dependencies]
hex-literal.workspace = true
proptest.workspace = true
serde = { workspace = true, features = ["std"] }
serde_json.workspace = true

[lints.rust]
# `cargo fuzz` builds with `--cfg fuzzing`: entry points for fuzz/ to the crate-internal series column codecs
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(fuzzing)'] }
