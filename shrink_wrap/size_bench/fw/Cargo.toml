cargo-features = ["panic-immediate-abort"]

[package]
name = "size_bench_fw"
version = "0.1.0"
edition = "2024"
description = "Bare firmware images, one test case each, for measuring shrink_wrap's code size on small CPUs"
publish = false

# Built for bare-metal targets with a nightly toolchain, so not a member of the repo root workspace.
[workspace]

[features]
# One case per build, picked by `size_bench` (the runner next to this crate). `empty` is the image without any
# shrink_wrap code: what the other cases are compared with.
empty = []
rw_de = []
rw_ser = []
struct_de = []
struct_ser = []
enum_de = []
enum_ser = []
vec_de = []
vec_ser = []
bits_de = []
bits_ser = []
option_de = []
option_ser = []
busgen_de = []
busgen_ser = []
busgen = []
busgen_hand = []
# A method's reply the way `ww_codegen!` server code encodes it: the return value alone, then a
# `ww_client_server::Event` around it, plus the error event every generated server has.
reply = ["dep:ww_client_server"]
# `reply` with `finish_for` for the return value instead of `finish` (code_size.md, "What is left")
finish_for = []
# The firmware's own byte-wise `memcpy` instead of the word-wise one of `compiler_builtins`.
byte_memcpy = []
# Types with a size assumption (`sized` where the fields allow it, else `final_structure`) instead of the
# evolvable default.
final = []

[dependencies]
shrink_wrap = { path = "../../shrink_wrap", default-features = false }
ww_client_server = { path = "../../../ww_stdlib/ww_client_server", default-features = false, optional = true }

# Same as fpga_tools tools/busgen/fw (QERV softcore, 8 KB of RAM for code, data and stack)
[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "immediate-abort"
debug = 0
strip = false
overflow-checks = false
