[package]
name = "shrink_wrap_c"
version = "0.1.0"
publish = false
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Builds the shrink_wrap C99 runtime and checks it against the Rust crate (SW-43)."

[dependencies]
exact_units.workspace = true
shrink_wrap = { workspace = true, features = ["std"] }

[build-dependencies]
cc.workspace = true

[dev-dependencies]
hex-literal.workspace = true
proptest.workspace = true

# The workspace lints, copied: this crate holds unsafe code (`unsafe = true` in layers.toml), which the workspace
# forbids. Every unsafe block has a `// SAFETY:` comment.
[lints.cargo]
unused_workspace_dependencies = "deny"

[lints.rust]
# `cargo fuzz` builds with `--cfg fuzzing`: ww_self and ww_stream gate their fuzz entry points on it
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(fuzzing)'] }
unsafe_code = "allow" # unsafe = true in layers.toml: the workspace forbids it elsewhere
