# No workspace-hack crate: it would build every member with the union of features, so the no_std feature-set checks
# would stop catching a missing std forward, and the published crates would depend on it.
[lints.hakari-generate]
level = "allow"
reason = "no workspace-hack crate here: unified features would hide a missing std forward from the feature-set checks"

[lints.hakari-manage-deps]
level = "allow"
reason = "no workspace-hack crate here: unified features would hide a missing std forward from the feature-set checks"

# The records use emoji with a fixed meaning: the changelogs' section headings (AGENTS.md, "Changelogs, commits and
# versions") and the feature tracker's status marks.
[lints.emoji]
allow = ["✅", "🚧", "📋", "🐛", "🚀", "⚠", "⚠️", "💡", "🧪", "📚", "⚙", "⚙️", "⛔", "🔍", "⚡", "🗑", "🗑️"]
reason = "changelog section headings and tracker status marks carry a fixed meaning"

