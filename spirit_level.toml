# spirit_level configuration: https://github.com/romixlab/spirit_level (book: configuration)
extends = ["big", "ai"]

# Override a lint: a level and/or parameters, always with a reason, optionally an expiry.
# [lints.crate-lines]
# level = "deny"
# reason = "why"
# expires = "2027-06-30"

# The book's pages, the READMEs and the crate docs are read by people. The feature tracker, the changelogs and the
# agents' guide are records, not pages a reader reads through; the test crates are not read as pages either.
[docs]
skip = ["CHANGELOG.md", "FEATURES.md", "AGENTS.md", "CLAUDE.md", "**/CHANGELOG.md", "**/tests/**"]

# The runtime crates that firmware links; the host crates beside them are not judged as firmware.
[[crate-tiers]]
tiers = ["embedded"]
crates = [
    "wire_weaver",
    "ww_api",
    "ww_client_server",
    "ww_device",
    "ww_framer",
    "ww_link",
    "ww_lz4",
    "ww_self",
    "ww_settings",
    "ww_stream",
    "ww_tap",
    "ww_timebase",
]
reason = "the no_std device-side crates that firmware links"

[[crate-tiers]]
tiers = ["egui"]
crates = ["wire_weaver_tool"]
reason = "the egui viewer"

# The framework crates are released to crates.io together (AGENTS.md, "Changelogs, commits and versions"); examples
# and tests are publish = false.
[lints.publish-false]
published = [
    "wire_weaver",
    "wire_weaver_cli",
    "wire_weaver_client",
    "wire_weaver_core",
    "wire_weaver_derive",
    "wire_weaver_evolution",
    "ww_api",
    "ww_client_server",
    "ww_clock_sync",
    "ww_device",
    "ww_dns_sd",
    "ww_framer",
    "ww_hub",
    "ww_hub_api",
    "ww_link",
    "ww_local_socket",
    "ww_lz4",
    "ww_plugin",
    "ww_self",
    "ww_settings",
    "ww_settings_derive",
    "ww_snapshots",
    "ww_stream",
    "ww_tap",
    "ww_tape_bundle",
    "ww_timebase",
]
reason = "the framework crates are released together; every other crate is publish = false"

# The records are not pages read through: these lints have a skip list of their own beside [docs] skip.
[lints.sentence-words]
skip = ["CHANGELOG.md", "FEATURES.md", "AGENTS.md", "CLAUDE.md", "**/CHANGELOG.md", "**/tests/**"]
reason = "the records are not prose pages; their length is checked by changelog-entry-length and agent-file-lines"

[lints.paragraph-sentences]
skip = ["CHANGELOG.md", "FEATURES.md", "AGENTS.md", "CLAUDE.md", "**/CHANGELOG.md", "**/tests/**"]
reason = "the records are not prose pages; their length is checked by changelog-entry-length and agent-file-lines"

[lints.commit-subject-length]
base = "origin/master"
reason = "work merges into master; the local master branch may lag behind origin/master"

[lints.commit-body-lines]
base = "origin/master"
reason = "work merges into master; the local master branch may lag behind origin/master"

[lints.commit-mixed-move]
base = "origin/master"
reason = "work merges into master; the local master branch may lag behind origin/master"

[lints.commit-prose]
base = "origin/master"
reason = "work merges into master; the local master branch may lag behind origin/master"

[lints.commit-tested-line]
base = "origin/master"
reason = "work merges into master; the local master branch may lag behind origin/master"

[lints.fixes-tag]
base = "origin/master"
reason = "work merges into master; the local master branch may lag behind origin/master"

[lints.fix-without-test]
base = "origin/master"
reason = "work merges into master; the local master branch may lag behind origin/master"

