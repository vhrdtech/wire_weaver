<svg xmlns="http://www.w3.org/2000/svg" width="720" height="250" viewBox="0 0 720 250" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <title>Bounds: which gain values a Gain accepts</title>
  <desc>A number line from 0 to 20. The values 1 to 16 are inside Range&lt;1, 16&gt;. A write of 8 is accepted. A write of 20 and a write of 0 are refused.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#222"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b03a2e"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="720" height="250" rx="10" fill="#ffffff"/>
  <line x1="40" y1="120" x2="680" y2="120" stroke="#222"/>
  <rect x="81.0" y="104" width="465.0" height="32" rx="6" fill="#e6f2e6" stroke="#222"/>
  <text x="313.5" y="124.5" text-anchor="middle" fill="#222" font-weight="bold">Range&lt;1, 16&gt;</text>
  <line x1="50.0" y1="136" x2="50.0" y2="144" stroke="#222"/>
  <text x="50.0" y="162" text-anchor="middle" fill="#222">0</text>
  <line x1="81.0" y1="136" x2="81.0" y2="144" stroke="#222"/>
  <text x="81.0" y="162" text-anchor="middle" fill="#222">1</text>
  <line x1="174.0" y1="136" x2="174.0" y2="144" stroke="#222"/>
  <text x="174.0" y="162" text-anchor="middle" fill="#222">4</text>
  <line x1="298.0" y1="136" x2="298.0" y2="144" stroke="#222"/>
  <text x="298.0" y="162" text-anchor="middle" fill="#222">8</text>
  <line x1="422.0" y1="136" x2="422.0" y2="144" stroke="#222"/>
  <text x="422.0" y="162" text-anchor="middle" fill="#222">12</text>
  <line x1="546.0" y1="136" x2="546.0" y2="144" stroke="#222"/>
  <text x="546.0" y="162" text-anchor="middle" fill="#222">16</text>
  <line x1="670.0" y1="136" x2="670.0" y2="144" stroke="#222"/>
  <text x="670.0" y="162" text-anchor="middle" fill="#222">20</text>
  <text x="298.0" y="60" text-anchor="middle" fill="#222" font-weight="bold">write 8: accepted</text>
  <line x1="298.0" y1="66" x2="298.0" y2="100" stroke="#222" marker-end="url(#arrow)"/>
  <text x="10" y="60" text-anchor="start" fill="#b03a2e" font-weight="bold">write 0: refused</text>
  <line x1="50.0" y1="66" x2="50.0" y2="112" stroke="#b03a2e" marker-end="url(#arrow-red)"/>
  <text x="710" y="60" text-anchor="end" fill="#b03a2e" font-weight="bold">write 20: refused</text>
  <line x1="670.0" y1="66" x2="670.0" y2="112" stroke="#b03a2e" marker-end="url(#arrow-red)"/>
  <text x="20" y="215" text-anchor="start" fill="#222" font-size="12">The type refuses a value outside the bounds when it is made in Rust and when it is decoded from the wire.</text>
</svg>
