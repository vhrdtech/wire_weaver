<svg xmlns="http://www.w3.org/2000/svg" width="720" height="250" viewBox="0 0 720 250" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <title>A point is a place on a scale, an amount is a distance</title>
  <desc>A temperature scale in degrees Celsius with two points, 22.5 and 25.5. The distance between them is an amount of 3 kelvin. Zero on the scale is 273.15 kelvin.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#222"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b03a2e"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="720" height="250" rx="10" fill="#ffffff"/>
  <line x1="40" y1="120" x2="680" y2="120" stroke="#222"/>
  <line x1="50.0" y1="115" x2="50.0" y2="125" stroke="#222"/>
  <text x="50.0" y="144" text-anchor="middle" fill="#222" font-size="12">20</text>
  <line x1="112.0" y1="115" x2="112.0" y2="125" stroke="#222"/>
  <text x="112.0" y="144" text-anchor="middle" fill="#222" font-size="12">21</text>
  <line x1="174.0" y1="115" x2="174.0" y2="125" stroke="#222"/>
  <text x="174.0" y="144" text-anchor="middle" fill="#222" font-size="12">22</text>
  <line x1="236.0" y1="115" x2="236.0" y2="125" stroke="#222"/>
  <text x="236.0" y="144" text-anchor="middle" fill="#222" font-size="12">23</text>
  <line x1="298.0" y1="115" x2="298.0" y2="125" stroke="#222"/>
  <text x="298.0" y="144" text-anchor="middle" fill="#222" font-size="12">24</text>
  <line x1="360.0" y1="115" x2="360.0" y2="125" stroke="#222"/>
  <text x="360.0" y="144" text-anchor="middle" fill="#222" font-size="12">25</text>
  <line x1="422.0" y1="115" x2="422.0" y2="125" stroke="#222"/>
  <text x="422.0" y="144" text-anchor="middle" fill="#222" font-size="12">26</text>
  <line x1="484.0" y1="115" x2="484.0" y2="125" stroke="#222"/>
  <text x="484.0" y="144" text-anchor="middle" fill="#222" font-size="12">27</text>
  <line x1="546.0" y1="115" x2="546.0" y2="125" stroke="#222"/>
  <text x="546.0" y="144" text-anchor="middle" fill="#222" font-size="12">28</text>
  <line x1="608.0" y1="115" x2="608.0" y2="125" stroke="#222"/>
  <text x="608.0" y="144" text-anchor="middle" fill="#222" font-size="12">29</text>
  <line x1="670.0" y1="115" x2="670.0" y2="125" stroke="#222"/>
  <text x="670.0" y="144" text-anchor="middle" fill="#222" font-size="12">30</text>
  <text x="680" y="144" text-anchor="start" fill="#222" font-size="12">°C</text>
  <rect x="165.0" y="50" width="80" height="28" rx="6" fill="#eef2f7" stroke="#222"/>
  <text x="205.0" y="68.5" text-anchor="middle" fill="#222" font-weight="bold">22.5 °C</text>
  <line x1="205.0" y1="80" x2="205.0" y2="114" stroke="#222" marker-end="url(#arrow)"/>
  <rect x="351.0" y="50" width="80" height="28" rx="6" fill="#eef2f7" stroke="#222"/>
  <text x="391.0" y="68.5" text-anchor="middle" fill="#222" font-weight="bold">25.5 °C</text>
  <line x1="391.0" y1="80" x2="391.0" y2="114" stroke="#222" marker-end="url(#arrow)"/>
  <text x="298.0" y="172" text-anchor="middle" fill="#222" font-weight="bold">amount: 3 K</text>
  <line x1="205.0" y1="186" x2="391.0" y2="186" stroke="#222" marker-end="url(#arrow)"/>
  <line x1="391.0" y1="186" x2="205.0" y2="186" stroke="#222" marker-end="url(#arrow)"/>
  <text x="20" y="225" text-anchor="start" fill="#222" font-size="12">Two points give an amount. A point plus an amount gives a point. Two points never add.</text>
</svg>
