<svg xmlns="http://www.w3.org/2000/svg" width="720" height="250" viewBox="0 0 720 250" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <title>The three bytes of 3300 mV</title>
  <desc>Volt::milli(3300u16) is the bytes 12 e4 0c. The first byte holds two nibbles: 1 for the prefix milli and 2 for the number type u16. The next two bytes are 3300 as a little-endian u16: e4 0c.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#222"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b03a2e"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="720" height="250" rx="10" fill="#ffffff"/>
  <text x="20" y="28" text-anchor="start" fill="#222" font-weight="bold">Volt::milli(3300u16)</text>
  <rect x="60" y="60" width="44" height="36" rx="6" fill="#fbf1d5" stroke="#222"/>
  <text x="82.0" y="82.5" text-anchor="middle" fill="#222" font-size="15">1</text>
  <rect x="104" y="60" width="44" height="36" rx="6" fill="#eef2f7" stroke="#222"/>
  <text x="126.0" y="82.5" text-anchor="middle" fill="#222" font-size="15">2</text>
  <rect x="170" y="60" width="44" height="36" rx="6" fill="#e6f2e6" stroke="#222"/>
  <text x="192.0" y="82.5" text-anchor="middle" fill="#222" font-size="15">e4</text>
  <rect x="214" y="60" width="44" height="36" rx="6" fill="#e6f2e6" stroke="#222"/>
  <text x="236.0" y="82.5" text-anchor="middle" fill="#222" font-size="15">0c</text>
  <text x="60" y="56" text-anchor="start" fill="#222" font-size="12">12</text>
  <text x="170" y="56" text-anchor="start" fill="#222" font-size="12">e4 0c</text>
  <line x1="82" y1="98" x2="82" y2="130" stroke="#222" marker-end="url(#arrow)"/>
  <line x1="126" y1="98" x2="126" y2="130" stroke="#222" marker-end="url(#arrow)"/>
  <line x1="236" y1="98" x2="236" y2="130" stroke="#222" marker-end="url(#arrow)"/>
  <text x="82" y="150" text-anchor="middle" fill="#222">prefix</text>
  <text x="82" y="168" text-anchor="middle" fill="#222" font-weight="bold">milli</text>
  <text x="126" y="192" text-anchor="middle" fill="#222">number type</text>
  <text x="126" y="210" text-anchor="middle" fill="#222" font-weight="bold">u16</text>
  <text x="236" y="150" text-anchor="middle" fill="#222">the number</text>
  <text x="236" y="168" text-anchor="middle" fill="#222" font-weight="bold">0x0ce4 = 3300</text>
  <text x="330" y="90" text-anchor="start" fill="#222" font-size="13">The unit, volt, is only in the type:</text>
  <text x="330" y="110" text-anchor="start" fill="#222" font-size="13">it takes no bit on the wire.</text>
  <text x="330" y="150" text-anchor="start" fill="#222" font-size="13">A device that stores f32 volts sends 5 bytes instead,</text>
  <text x="330" y="168" text-anchor="start" fill="#222" font-size="13">and the host reads both as the same quantity.</text>
</svg>
