<svg xmlns="http://www.w3.org/2000/svg" width="720" height="260" viewBox="0 0 720 260" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <title>A temperature and a plain integer share their bytes</title>
  <desc>A Temperature of 25.5 degrees Celsius is a Point of Fixed&lt;Kelvin, Centi, i16&gt;. Its value 2550 steps of 0.01 K is the two bytes f6 09 on the wire, the same two bytes as the plain i16 2550.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#222"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b03a2e"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="720" height="260" rx="10" fill="#ffffff"/>
  <text x="20" y="28" text-anchor="start" fill="#222" font-weight="bold">In your code</text>
  <text x="250" y="28" text-anchor="start" fill="#222" font-weight="bold">In the type</text>
  <text x="500" y="28" text-anchor="start" fill="#222" font-weight="bold">On the wire</text>
  <rect x="20" y="44" width="190" height="58" rx="6" fill="#eef2f7" stroke="#222"/>
  <text x="115.0" y="69.5" text-anchor="middle" fill="#222">Temperature</text>
  <text x="115.0" y="85.5" text-anchor="middle" fill="#222">25.5 °C</text>
  <rect x="250" y="44" width="210" height="58" rx="6" fill="#eef2f7" stroke="#222"/>
  <text x="355.0" y="69.5" text-anchor="middle" fill="#222" font-size="12">Point&lt;Celsius,</text>
  <text x="355.0" y="85.5" text-anchor="middle" fill="#222" font-size="12">Fixed&lt;Kelvin, Centi, i16&gt;&gt;</text>
  <line x1="212" y1="73" x2="248" y2="73" stroke="#222" marker-end="url(#arrow)"/>
  <line x1="462" y1="73" x2="498" y2="73" stroke="#222" marker-end="url(#arrow)"/>
  <rect x="506" y="58" width="44" height="30" rx="6" fill="#e6f2e6" stroke="#222"/>
  <text x="528.0" y="77.5" text-anchor="middle" fill="#222" font-size="14">f6</text>
  <rect x="550" y="58" width="44" height="30" rx="6" fill="#e6f2e6" stroke="#222"/>
  <text x="572.0" y="77.5" text-anchor="middle" fill="#222" font-size="14">09</text>
  <text x="506" y="112" text-anchor="start" fill="#222" font-size="12">2550 steps of 0.01 K</text>
  <rect x="20" y="150" width="190" height="58" rx="6" fill="#f3f3f3" stroke="#222"/>
  <text x="115.0" y="175.5" text-anchor="middle" fill="#222">i16</text>
  <text x="115.0" y="191.5" text-anchor="middle" fill="#222">2550</text>
  <rect x="250" y="150" width="210" height="58" rx="6" fill="#f3f3f3" stroke="#222"/>
  <text x="355.0" y="183.5" text-anchor="middle" fill="#222" font-size="12">no unit, no step, no origin</text>
  <line x1="212" y1="179" x2="248" y2="179" stroke="#222" marker-end="url(#arrow)"/>
  <line x1="462" y1="179" x2="498" y2="179" stroke="#222" marker-end="url(#arrow)"/>
  <rect x="506" y="164" width="44" height="30" rx="6" fill="#e6f2e6" stroke="#222"/>
  <text x="528.0" y="183.5" text-anchor="middle" fill="#222" font-size="14">f6</text>
  <rect x="550" y="164" width="44" height="30" rx="6" fill="#e6f2e6" stroke="#222"/>
  <text x="572.0" y="183.5" text-anchor="middle" fill="#222" font-size="14">09</text>
  <text x="20" y="240" text-anchor="start" fill="#222" font-size="12">The unit, the step and the origin live in the type. They cost no byte on the wire.</text>
</svg>
