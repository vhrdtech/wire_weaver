[package]
name = "args_evolution"
version = "0.1.0"
publish = false
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Tests EVO-22 (arguments that evolve): trailing defaulted arguments and #[flatten] struct arguments, through the generated and dynamic clients"

[features]
default = ["std"]
# default, unused here: this crate has no no_std gate and no owned/borrowed derive choice
std = []

[dev-dependencies]
args_evolution_api.workspace = true
tests_common.workspace = true
tokio = { workspace = true, features = ["sync", "rt-multi-thread", "rt", "macros"] }
wire_weaver.workspace = true
wire_weaver_client = { workspace = true, features = ["clock_sync", "usb"] }
wire_weaver_core.workspace = true
ww_client_server.workspace = true

[lints]
workspace = true
