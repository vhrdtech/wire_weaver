[package]
name = "bounded_api"
version = "0.1.0"
publish = false
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

# Wire version of the API (EVO-31): link setup decides on its line, `#[since]` names its revisions
[package.metadata.wire_weaver]
wire = "w1.0"

[features]
default = ["std"]
# turns no_std off, switches the derived types from borrowed to owned, and forwards std to ww_api
std = ["ww_api/std"]

[dependencies]
ww_api.workspace = true

[lints]
workspace = true
