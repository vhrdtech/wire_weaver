[package]
name = "cfg_variants_api"
version = "0.1.0"
publish = false
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

# Wire version of the API (EVO-31): link setup decides on its line, `#[since]` names its revisions
[package.metadata.wire_weaver]
wire = "w1.0"

[features]
# a host enables every variant
default = ["std", "wide", "float"]
std = ["ww_api/std", "ww_si/std"]
wide = []
float = []

[dependencies]
ww_api.workspace = true
ww_si = { workspace = true, features = ["electrical"] }

[lints]
workspace = true
