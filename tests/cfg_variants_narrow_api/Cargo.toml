[package]
name = "cfg_variants_narrow_api"
version = "0.1.0"
publish = false
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "The firmware build of the #[cfg] enum variants API (DER-8): same source as cfg_variants_api, without wide/float"

# Wire version of the API (EVO-31): link setup decides on its line, `#[since]` names its revisions
[package.metadata.wire_weaver]
wire = "w1.0"

[features]
# firmware: neither `wide` nor `float`
default = ["std"]
# turns no_std off, switches the derived types from borrowed to owned, and forwards std to ww_api and ww_si
std = ["ww_api/std", "ww_si/std"]
# adds Reading::Wide(u64), a bigger variant not every build carries
wide = []
# adds Reading::Float(f32), a variant not every build carries
float = []

[dependencies]
ww_api.workspace = true
ww_si = { workspace = true, features = ["electrical"] }

[lints]
workspace = true
