[build-system]
requires = ["maturin>=1.11,<2.0"]
build-backend = "maturin"

[project]
name = "wire_weaver_conformance"
description = "The conformance matrix's Python consumer: wire_weaver_py from this checkout as the `wire_weaver` module"
requires-python = ">=3.10"
license = "MIT"
dynamic = ["version"]

[dependency-groups]
dev = ["pytest>=9.0.3"]

[tool.maturin]
module-name = "wire_weaver"

[tool.uv]
# Rebuild the module when any Rust source of the workspace changes
cache-keys = [
    { file = "pyproject.toml" },
    { file = "Cargo.toml" },
    { file = "../../**/*.rs" },
    { file = "../../Cargo.lock" },
]
