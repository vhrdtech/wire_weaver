[package]
name = "cross_version_old_api"
version = "0.3.0"
publish = false
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

# Wire version of the API (EVO-31): link setup decides on its line, `#[since]` names its revisions
[package.metadata.wire_weaver]
wire = "w1.0"

[features]
default = ["std"]
# forwards std to ww_api and global_boot_api; this crate itself is always no_std
std = ["ww_api/std", "global_boot_api/std"]

[dependencies]
global_boot_api = { workspace = true }
ww_api = { workspace = true }

[lints]
workspace = true
