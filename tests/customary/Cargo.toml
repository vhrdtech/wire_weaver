[package]
name = "customary"
version = "0.1.0"
publish = false
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Tests the Mars Climate Orbiter case (STD-72) end to end: unit conversion through the generated and dynamic clients"

[dev-dependencies]
anyhow.workspace = true
customary_api.workspace = true
tests_common.workspace = true
tokio = { workspace = true, features = ["sync", "rt-multi-thread", "rt", "macros", "test-util"] }
tracing-subscriber.workspace = true
wire_weaver.workspace = true
wire_weaver_client = { workspace = true, features = ["clock_sync", "usb"] }
ww_client_server.workspace = true
ww_si = { workspace = true, features = ["std"] }

[lints]
workspace = true
