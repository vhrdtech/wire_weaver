[package]
name = "customary_api"
version = "0.1.0"
publish = false
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "The Mars Climate Orbiter case (STD-72): an API reporting a customary unit a client must convert"

# Wire version of the API (EVO-31): link setup decides on its line, `#[since]` names its revisions
[package.metadata.wire_weaver]
wire = "w1.0"

[features]
default = ["std"]
# turns no_std off and forwards std to ww_api and ww_si
std = ["ww_api/std", "ww_si/std"]

[dependencies]
ww_api.workspace = true
ww_si = { workspace = true, features = ["time", "mechanical", "customary"] }

[lints]
workspace = true
