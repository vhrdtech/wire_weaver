[package]
name = "fan_api"
version = "0.1.0"
publish = false
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "A second API crate with a unit of its own named like one of quantities_api's, for unit identity tests (UNIT-7)"

[features]
default = ["std"]
# turns no_std off and forwards std to ww_si
std = ["ww_si/std"]

[dependencies]
ww_si = { workspace = true, features = ["angle", "time"] }

[lints]
workspace = true
