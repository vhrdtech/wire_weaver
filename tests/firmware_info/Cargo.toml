[package]
name = "firmware_info"
version = "0.1.0"
publish = false
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
firmware_info_api.workspace = true
tests_common.workspace = true
tokio = { workspace = true, features = ["sync", "rt-multi-thread", "rt", "macros", "time"] }
tracing-subscriber.workspace = true
wire_weaver = { workspace = true, features = ["std"] }
wire_weaver_client.workspace = true
ww_firmware_info = { workspace = true, features = ["std"] }
ww_si = { workspace = true, features = ["std"] }
ww_client_server.workspace = true

[build-dependencies]
ww_firmware_info = { workspace = true, features = ["build"] }
