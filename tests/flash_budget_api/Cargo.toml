[package]
name = "flash_budget_api"
version = "0.1.0"
publish = false
description = "APIs of the flash budget of a server (TEST-30): a floor and variants with more resources of one kind each"
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

# Wire version of the API (EVO-31): link setup decides on its line, `#[since]` names its revisions
[package.metadata.wire_weaver]
wire = "w1.0"

[features]
default = ["std"]
std = ["wire_weaver/std", "ww_si/std"]

[dependencies]
wire_weaver = { workspace = true }
# a `+batched` property's wire form names `ww_si::Timed`
ww_si = { workspace = true, features = ["i32"] }
