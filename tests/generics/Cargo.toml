[package]
name = "generics"
version = "0.1.0"
publish = false
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Generic user types in an API (API-43) through generated server and client code, introspection data and the dynamic client"

[features]
default = ["std"]
# default, unused here: this crate has no no_std gate and no owned/borrowed derive choice
std = []

[dev-dependencies]
generics_api.workspace = true
tests_common.workspace = true
tokio = { workspace = true, features = ["sync", "rt-multi-thread", "rt", "macros", "test-util"] }
tracing-subscriber.workspace = true
wire_weaver.workspace = true
wire_weaver_client = { workspace = true, features = ["clock_sync", "usb"] }
wire_weaver_core.workspace = true
ww_client_server.workspace = true
ww_si = { workspace = true, features = ["std", "electrical"] }

[lints]
workspace = true
