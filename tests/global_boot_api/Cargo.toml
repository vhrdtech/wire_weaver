[package]
name = "global_boot_api"
version = "0.1.0"
publish = false
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Test traits of CLT-10/API-20/SRV-53 (global trait paths): used by tests/cross_version instead of a ww_stdlib crate, one implemented (Boot), one never implemented (Missing)."

[features]
default = ["std"]
# turns no_std off, switches the derived types from borrowed to owned, and forwards std to ww_api
std = ["ww_api/std"]

[dependencies]
ww_api.workspace = true

[lints]
workspace = true
