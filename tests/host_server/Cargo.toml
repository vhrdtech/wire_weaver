[package]
name = "host_server"
version = "0.1.0"
description = "Tests of the host server (SRV-12): many clients on one API, calls side by side, pumps, limits, shutdown, byte streams (TR-19)"
publish = false
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
keep_trying_api.workspace = true
tokio = { workspace = true, features = ["macros", "rt"] }
wire_weaver = { workspace = true, features = ["std"] }
wire_weaver_client = { workspace = true, features = ["in_process"] }
wire_weaver_server = { workspace = true, features = ["tokio"] }
ww_client_server.workspace = true
ww_device.workspace = true
ww_si = { workspace = true, features = ["counting", "time"] }
ww_stream = { workspace = true, features = ["std"] }

[dev-dependencies]
anyhow.workspace = true
futures-util.workspace = true
host_server_api.workspace = true
tests_common.workspace = true
tokio = { workspace = true, features = ["io-util", "net", "sync", "rt-multi-thread", "rt", "macros", "test-util", "time"] }
tokio-util = { workspace = true, features = ["compat"] }
wire_weaver_client = { workspace = true, features = ["in_process", "local_socket", "ws"] }
wire_weaver_server = { workspace = true, features = ["in_process", "local_socket", "tokio"] }
ww_byte_stream.workspace = true
ww_local_socket = { workspace = true, features = ["socket"] }

[lints]
workspace = true
