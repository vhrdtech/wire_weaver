[package]
name = "host_server"
version = "0.1.0"
description = "Tests of the host server (SRV-12): many clients on one API, calls side by side, pumps, limits, shutdown"
publish = false
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[dev-dependencies]
futures-util.workspace = true
host_server_api.workspace = true
tests_common.workspace = true
tokio = { workspace = true, features = ["sync", "rt-multi-thread", "rt", "macros", "test-util", "time"] }
wire_weaver = { workspace = true, features = ["std"] }
wire_weaver_client = { workspace = true, features = ["in_process", "local_socket"] }
wire_weaver_server = { workspace = true, features = ["in_process", "local_socket", "tokio"] }
ww_client_server.workspace = true
ww_device.workspace = true
ww_local_socket = { workspace = true, features = ["socket"] }
ww_stream = { workspace = true, features = ["std"] }

[lints]
workspace = true
