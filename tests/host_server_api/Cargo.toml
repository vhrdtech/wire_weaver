[package]
name = "host_server_api"
version = "0.1.0"
description = "Test API of the host server (SRV-12), exercised by tests/host_server"
publish = false
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[package.metadata.wire_weaver]
wire = "w1.0"

[features]
default = ["std"]
# The owned types, for hosts and for a server with an allocator
std = ["ww_si/std"]

[dependencies]
ww_api = { workspace = true, features = ["std"] }
ww_si = { workspace = true, features = ["time"] }

[lints]
workspace = true
