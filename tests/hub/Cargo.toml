[package]
name = "hub"
version = "0.1.0"
publish = false
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Device tunnels through the ww hub (SRV-29): several clients of one in-process device, each through its own tunnel"

[dev-dependencies]
hub_api.workspace = true
tests_common.workspace = true
tokio = { workspace = true, features = ["sync", "rt-multi-thread", "rt", "macros", "time"] }
tracing-subscriber.workspace = true
wire_weaver.workspace = true
wire_weaver_client = { workspace = true, features = ["clock_sync", "in_process", "local_socket", "usb"] }
ww_client_server.workspace = true
ww_date_time = { workspace = true, features = ["std"] }
ww_device.workspace = true
ww_hub.workspace = true
ww_hub_api = { workspace = true, features = ["std"] }
ww_local_socket.workspace = true
ww_si = { workspace = true, features = ["std", "time"] }
ww_tap.workspace = true
ww_timebase = { workspace = true, features = ["std"] }

[lints]
workspace = true
