[package]
name = "hub_pytest_device"
version = "0.1.0"
publish = false
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Hosts the ww hub and in-process test devices for wire_weaver_py's pytest tests (TOOL-18), no real hardware needed"

[[bin]]
name = "hub_pytest_device"
path = "src/bin/hub_pytest_device.rs"

[[bin]]
name = "keyed_pytest_device"
path = "src/bin/keyed_pytest_device.rs"

[dependencies]
common_error.workspace = true
hub_pytest_device_api.workspace = true
keyed.workspace = true
tests_common.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "sync", "time", "io-util"] }
wire_weaver = { workspace = true, features = ["std"] }
wire_weaver_client = { workspace = true, features = ["hub", "in_process"] }
ww_client_server = { workspace = true, features = ["std"] }
ww_hub.workspace = true

[lints]
workspace = true
