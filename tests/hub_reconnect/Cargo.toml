[package]
name = "hub_reconnect"
version = "0.1.0"
publish = false
description = "Tests of clients reconnecting when their ww hub goes (CLT-40) and hub handover (SRV-30)"
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[package.metadata.cargo-machete]
# the code ww_codegen! generates names ww_client_server
ignored = ["ww_client_server"]

[dependencies]
anyhow.workspace = true
futures-util = { workspace = true, features = ["io", "std"] }
hub_reconnect_api.workspace = true
tests_common = { workspace = true, features = ["local_socket"] }
tokio = { workspace = true, features = ["sync", "rt-multi-thread", "rt", "macros", "time", "io-util"] }
tracing.workspace = true
tracing-subscriber.workspace = true
wire_weaver.workspace = true
wire_weaver_client = { workspace = true, features = ["clock_sync", "hub", "in_process", "local_socket", "usb"] }
ww_byte_stream.workspace = true
ww_client_server.workspace = true
ww_hub.workspace = true
ww_hub_api = { workspace = true, features = ["std"] }
ww_link = { workspace = true, features = ["std"] }
ww_local_socket.workspace = true
ww_stream = { workspace = true, features = ["std"] }

[lints]
workspace = true
