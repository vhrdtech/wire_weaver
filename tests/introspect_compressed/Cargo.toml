[package]
name = "introspect_compressed"
version = "0.1.0"
publish = false
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Compressed introspection data (INT-16): checks a server using introspect_compression = \"lz4\" against a plain one"

[dev-dependencies]
introspect_compressed_api.workspace = true
tests_common.workspace = true
tokio = { workspace = true, features = ["sync", "rt-multi-thread", "rt", "macros", "time"] }
tracing-subscriber.workspace = true
wire_weaver = { workspace = true, features = ["std"] }
wire_weaver_client = { workspace = true, features = ["clock_sync", "in_process", "local_socket", "usb"] }
ww_client_server.workspace = true
ww_hub.workspace = true
ww_local_socket.workspace = true
ww_self.workspace = true

[lints]
workspace = true
