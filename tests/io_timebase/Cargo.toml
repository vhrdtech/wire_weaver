[package]
name = "io_timebase"
version = "0.1.0"
publish = false
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "ww_timebase end to end: a mock server through tests_common::start_device, the generated client through the real host event loop"

[dev-dependencies]
io_timebase_api.workspace = true
tests_common.workspace = true
tokio = { workspace = true, features = ["sync", "rt-multi-thread", "rt", "macros", "time"] }
tracing-subscriber.workspace = true
wire_weaver = { workspace = true, features = ["std"] }
wire_weaver_client = { workspace = true, features = ["clock_sync", "usb"] }
ww_client_server.workspace = true
ww_clock_sync.workspace = true
ww_date_time = { workspace = true, features = ["std"] }
ww_si = { workspace = true, features = ["std"] }
ww_timebase = { workspace = true, features = ["std"] }

[lints]
workspace = true
