[package]
name = "io_timebase_api"
version = "0.1.0"
publish = false
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

# Wire version of the API (EVO-31): link setup decides on its line, `#[since]` names its revisions
[package.metadata.wire_weaver]
wire = "w1.0"

[features]
default = ["std"]
# turns no_std off and forwards std to ww_api and ww_timebase
std = ["ww_api/std", "ww_timebase/std"]

[dependencies]
ww_api.workspace = true
ww_timebase.workspace = true

[lints]
workspace = true
