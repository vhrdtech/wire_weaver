[package]
name = "keep_trying"
version = "0.1.0"
publish = false
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Keep-trying connections end to end (CLT-75): a generated client made with connect_keep_trying() against a generated server"

[features]
default = ["std"]
# default, unused here: this crate has no no_std gate and no owned/borrowed derive choice
std = []

[dev-dependencies]
keep_trying_api.workspace = true
tests_common = { workspace = true, features = ["ws"] }
tokio = { workspace = true, features = ["sync", "rt", "macros", "time", "test-util"] }
wire_weaver.workspace = true
wire_weaver_client = { workspace = true, features = ["in_process", "ws"] }
ww_client_server.workspace = true
ww_si = { workspace = true, features = ["counting"] }
ww_stream = { workspace = true, features = ["std"] }

[lints]
workspace = true
