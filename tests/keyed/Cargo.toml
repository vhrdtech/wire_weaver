[package]
name = "keyed"
version = "0.1.0"
publish = false
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Server of a keyed array (SRV-62): answers index_of, key[i], a multi read of all keys and the keys stream"

[features]
default = ["std"]
# default, unused here: this crate has no no_std gate and no owned/borrowed derive choice
std = []

[dependencies]
keyed_api.workspace = true
tests_common.workspace = true
tokio = { workspace = true, features = ["sync", "rt-multi-thread", "rt", "macros", "test-util"] }
tracing-subscriber.workspace = true
wire_weaver.workspace = true
wire_weaver_client.workspace = true
ww_client_server.workspace = true
ww_keyed = { workspace = true, features = ["std"] }
ww_si = { workspace = true, features = ["time", "information"] }

[lints]
workspace = true
