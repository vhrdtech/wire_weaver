[package]
name = "keyed_api"
version = "0.1.0"
publish = false
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[package.metadata.wire_weaver]
wire = "w1.0"

[features]
default = ["std"]
std = ["ww_api/std", "ww_keyed/std", "ww_si/std"]

[dependencies]
ww_api = { workspace = true, features = ["std"] }
ww_keyed = { workspace = true, features = ["std"] }
ww_si = { workspace = true, features = ["time", "information"] }

[lints]
workspace = true
