[package]
name = "methods_api"
version = "0.1.0"
publish = false
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Test API of tests/methods: one method per dispatch shape, to test method dispatch end to end"

# Wire version of the API (EVO-31): link setup decides on its line, `#[since]` names its revisions
[package.metadata.wire_weaver]
wire = "w1.0"

[features]
default = ["std"]
# switches the derived types from borrowed to owned (Vec/String); this crate itself always builds with std
std = []

[dependencies]
ww_api = { workspace = true, features = ["std"] }

[lints]
workspace = true
