[package]
name = "multi_req_api"
version = "0.1.0"
publish = false
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "API for multi requests (MultiCall, MultiRead, MultiWrite) and the malformed ones a server must survive"

# Wire version of the API (EVO-31): link setup decides on its line, `#[since]` names its revisions
[package.metadata.wire_weaver]
wire = "w1.0"

[features]
default = ["std"]
# default, unused here: this crate has no no_std gate and no owned/borrowed derive choice
std = []

[dependencies]
ww_api = { workspace = true, features = ["std"] }

[lints]
workspace = true
