[package]
name = "observe"
version = "0.1.0"
publish = false
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "End-to-end tests of observed properties (SRV-18): Observe requests and PropertyUpdate events"

[features]
default = ["std"]
# default, unused here: this crate has no no_std gate and no owned/borrowed derive choice
std = []

[dev-dependencies]
observe_api.workspace = true
tests_common.workspace = true
tokio = { workspace = true, features = ["sync", "rt-multi-thread", "rt", "macros", "time"] }
tracing-subscriber.workspace = true
wire_weaver.workspace = true
wire_weaver_client.workspace = true
ww_client_server.workspace = true
ww_si.workspace = true
ww_stream = { workspace = true, features = ["std"] }

[lints]
workspace = true
