[package]
name = "observe_batched"
version = "0.1.0"
publish = false
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "End-to-end tests of batched observe (API-39): Samples mode, Batched::One, and a shared sample_times column"

[features]
default = ["std"]
# default, unused here: this crate has no no_std gate and no owned/borrowed derive choice
std = []

[dev-dependencies]
observe_batched_api.workspace = true
tests_common.workspace = true
tokio = { workspace = true, features = ["sync", "rt-multi-thread", "rt", "macros", "time"] }
tracing-subscriber.workspace = true
wire_weaver.workspace = true
wire_weaver_client.workspace = true
ww_client_server.workspace = true
ww_si = { workspace = true, features = ["std"] }
ww_stream = { workspace = true, features = ["std"] }

# The workspace lints, copied: this crate holds unsafe code (`unsafe = true` in layers.toml), which the workspace
# forbids. Every unsafe block has a `// SAFETY:` comment.
[lints.cargo]
unused_workspace_dependencies = "deny"

[lints.rust]
# `cargo fuzz` builds with `--cfg fuzzing`: ww_self and ww_stream gate their fuzz entry points on it
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(fuzzing)'] }
unsafe_code = "allow" # unsafe = true in layers.toml: the workspace forbids it elsewhere
