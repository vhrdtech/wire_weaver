[package]
name = "quantities_api"
version = "0.1.0"
publish = false
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

# Wire version of the API (EVO-31): link setup decides on its line, `#[since]` names its revisions
[package.metadata.wire_weaver]
wire = "w1.0"

[features]
default = ["std"]
# turns no_std off and forwards std to fan_api, ww_api and ww_si
std = ["fan_api/std", "ww_api/std", "ww_si/std"]

[dependencies]
fan_api = { workspace = true, default-features = false }
ww_api.workspace = true
ww_si = { workspace = true, features = ["time", "electrical", "mechanical", "angle", "information", "counting", "systems", "dimensionless", "photometric"] }

[lints]
workspace = true
