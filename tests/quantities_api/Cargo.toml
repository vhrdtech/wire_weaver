[package]
name = "quantities_api"
version = "0.1.0"
publish = false
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

# Wire version of the API (EVO-31): link setup decides on its line, `#[since]` names its revisions
[package.metadata.wire_weaver]
wire = "w1.0"

[features]
default = ["std"]
std = ["fan_api/std", "wire_weaver/std", "ww_si/std"]

[dependencies]
fan_api = { workspace = true, default-features = false }
wire_weaver.workspace = true
ww_si = { workspace = true, features = ["time", "electrical", "mechanical", "angle", "information", "counting", "systems"] }
