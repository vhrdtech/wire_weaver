[package]
name = "reconnect_revision_changed_api"
version = "0.1.0"
publish = false
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Revision w1.1 of reconnect_revision_api that changes the item type of one stream (CLT-81): that stream is incompatible"

# Wire version of the API (EVO-31): link setup decides on its line, `#[since]` names its revisions
[package.metadata.wire_weaver]
wire = "w1.1"

[features]
default = ["std"]
# forwards std to ww_api and ww_si, used either way
std = ["ww_api/std", "ww_si/std"]

[dependencies]
ww_api.workspace = true
ww_si = { workspace = true, features = ["counting"] }

[lints]
workspace = true
