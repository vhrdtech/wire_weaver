[package]
name = "serve_trait_api"
version = "0.1.0"
description = "Test API of a server generated with serve_trait (SRV-49), exercised by tests/serve_trait"
publish = false
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[package.metadata.wire_weaver]
wire = "w1.0"

[features]
default = ["std"]
# The owned types, for hosts and for a server with an allocator
std = []
# The API as a local trait, `ServeTrait` (CLT-57)
local = ["std", "dep:wire_weaver"]

[dependencies]
wire_weaver = { workspace = true, features = ["std"], optional = true }
ww_api = { workspace = true, features = ["std"] }

[lints]
workspace = true
