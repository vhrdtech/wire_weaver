[package]
name = "skipped_dep_api"
version = "0.1.0"
publish = false
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Test traits whose definitions an API using them leaves out against this crate's snapshot: used by wire_weaver_core's snapshot and definition cache tests instead of ww_uart and ww_gpio (R7)."

# Wire version of the traits and types of this crate (EVO-26)
[package.metadata.wire_weaver]
wire = "w1.0"

[features]
default = ["std"]
std = ["ww_api/std", "ww_si/std"]

[dependencies]
ww_api.workspace = true
ww_si = { workspace = true, features = ["time", "electrical"] }

[dev-dependencies]
wire_weaver_evolution = { workspace = true, features = ["source"] }

[lints]
workspace = true
