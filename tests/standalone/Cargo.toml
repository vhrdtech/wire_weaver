[package]
name = "standalone"
version = "0.1.0"
publish = false
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Host-side tests of standalone_api's types through a generated client, where the dependency isn't a wire_weaver API crate (API-60)."

# no dependency on standalone_units: generated code names its types through standalone_api's re-export
[dev-dependencies]
standalone_api.workspace = true
tests_common.workspace = true
tokio = { workspace = true, features = ["sync", "rt-multi-thread", "rt", "macros", "time"] }
tracing-subscriber.workspace = true
wire_weaver = { workspace = true, features = ["std"] }
wire_weaver_client = { workspace = true, features = ["clock_sync", "usb"] }
ww_client_server.workspace = true
ww_self = { workspace = true, features = ["std"] }

[lints]
workspace = true
