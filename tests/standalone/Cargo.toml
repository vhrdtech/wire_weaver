[package]
name = "standalone"
version = "0.1.0"
publish = false
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

# no dependency on standalone_units: generated code names its types through standalone_api's re-export
[dependencies]
standalone_api.workspace = true
tests_common.workspace = true
tokio = { workspace = true, features = ["sync", "rt-multi-thread", "rt", "macros", "time"] }
tracing-subscriber.workspace = true
wire_weaver = { workspace = true, features = ["std"] }
wire_weaver_client.workspace = true
ww_client_server.workspace = true
ww_self.workspace = true
