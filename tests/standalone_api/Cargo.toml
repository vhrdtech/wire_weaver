[package]
name = "standalone_api"
version = "0.1.0"
publish = false
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Test API using standalone_units' types, a dependency that isn't a wire_weaver API crate (API-60); used by tests/standalone."

# Wire version of the API (EVO-31): link setup decides on its line, `#[since]` names its revisions
[package.metadata.wire_weaver]
wire = "w1.0"

[features]
default = ["std"]
# turns no_std off, switches the derived types from borrowed to owned, and forwards std to ww_api and standalone_units
std = ["ww_api/std", "standalone_units/std"]

[dependencies]
standalone_units = { workspace = true, features = ["shrink_wrap"] }
ww_api.workspace = true

[lints]
workspace = true
