[package]
name = "standalone_units"
version = "0.1.0"
publish = false
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

# the wire format is optional, as in exact_units: types derive it behind `cfg_attr(feature = "shrink_wrap", ..)`
[features]
# turns on the optional shrink_wrap dependency and its derives
shrink_wrap = ["dep:shrink_wrap"]
# with shrink_wrap on, turns no_std off and switches its derives from borrowed to owned
std = ["shrink_wrap?/std"]

[dependencies]
shrink_wrap = { workspace = true, optional = true }

[lints]
workspace = true
