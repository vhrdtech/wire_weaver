[package]
name = "streams_borrowed_error"
version = "0.1.0"
publish = false
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Stream functions whose error type borrows (API-35): plain and counted streams that refuse a second open with a server-borrowed error."

[features]
default = ["std"]
# default, unused here: this crate has no no_std gate and no owned/borrowed derive choice
std = []

[dev-dependencies]
streams_borrowed_error_api.workspace = true
tests_common.workspace = true
tokio = { workspace = true, features = ["sync", "rt-multi-thread", "rt", "macros", "time"] }
tracing-subscriber.workspace = true
wire_weaver.workspace = true
wire_weaver_client.workspace = true
ww_client_server.workspace = true
ww_stream = { workspace = true, features = ["std"] }

[lints]
workspace = true
