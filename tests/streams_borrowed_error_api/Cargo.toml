[package]
name = "streams_borrowed_error_api"
version = "0.1.0"
publish = false
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "API of the borrowed stream error tests (API-35): stream functions whose handler returns an error borrowed from the server."

# Wire version of the API (EVO-31): link setup decides on its line, `#[since]` names its revisions
[package.metadata.wire_weaver]
wire = "w1.0"

[features]
default = ["std"]
# switches the derived types from borrowed to owned (Vec/String); this crate itself always builds with std
std = []

[dependencies]
ww_api = { workspace = true, features = ["std"] }

[lints]
workspace = true
