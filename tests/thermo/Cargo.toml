[package]
name = "thermo"
version = "0.1.0"
publish = false
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "A host driver for every wire line of thermo_api (EVO-28, EVO-42): one generated client per line behind one facade."

[dependencies]
thermo_api = { workspace = true, features = ["retired_wire_v1"] }
thiserror.workspace = true
tokio = { workspace = true, features = ["sync", "rt-multi-thread", "rt", "macros"] }
wire_weaver.workspace = true
wire_weaver_client = { workspace = true, features = ["clock_sync", "usb"] }
ww_si = { workspace = true, features = ["std"] }

[dev-dependencies]
tests_common.workspace = true
# simulated firmware of every line, also of the first revision of each, which the driver has no client of
thermo_devices.workspace = true
tracing-subscriber.workspace = true
wire_weaver_core.workspace = true
wire_weaver_evolution = { workspace = true, features = ["source"] }
ww_client_server = { workspace = true, features = ["std"] }
ww_quantity.workspace = true

[lints]
workspace = true
