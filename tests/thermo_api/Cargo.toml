[package]
name = "thermo_api"
version = "6.0.0"
publish = false
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

# Every wire line still in use, one root per module (EVO-37, EVO-42). Lines 1 to 3 were the crates 1.x, 2.x and 3.x;
# 4.0.0 held them all. 5.0.0 (R7) moved `indication` off `ww_indication` (leaving this repo) onto a local stand-in
# (`common::Indication`): a wire break on every root, since the attached trait's identity changed, each a new line
# (`ww api check`) so it doesn't collide with another root's. 5.0.0 published lines 5 and 6 at w5.0 and w6.0
# (`tests/thermo_api_old/5_0_0`); 6.0.0 adds `calibrate` (w5.1), `uptime` (w5.2), `self_test` (w6.1) and line 7, line
# 3's successor, with a Rust-only rename (`gain` -> `amp_gain`, STD-125). Lines 1-4 stay retired history,
# not reused (w4 and w8 are the "unspoken" lines of `tests/thermo`'s `a_fourth_line_is_refused`).
[package.metadata.wire_weaver.roots]
"wire_v1::Thermo" = "w5.2"
"wire_v2::Thermo" = "w6.1"
"wire_v3::Thermo" = "w7.0"

[features]
default = ["std"]
# turns no_std off, switches the derived types from borrowed to owned, and forwards std to ww_api and ww_si
std = ["ww_api/std", "ww_si/std"]

[dependencies]
ww_api.workspace = true
ww_si = { workspace = true, features = ["time", "thermal", "dimensionless", "counting"] }

[dev-dependencies]
wire_weaver_evolution = { workspace = true, features = ["source"] }

[lints]
workspace = true
