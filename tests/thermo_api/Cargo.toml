[package]
name = "thermo_api"
version = "4.0.0"
publish = false
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "The API of the multi-line bench (EVO-28, EVO-42): a small temperature logger with every wire line still in use."

# Every wire line still in use, one root per module (EVO-37, EVO-42). 0.1.0 was on w0, the design line (no snapshot);
# 1.0.0 released line 1 at w1.0 with one root at the crate root. 2.0.0 added line 2 at w2.0 beside it
# (`tests/thermo_api_old/2_0_0`); 2.1.0 gave line 1 `calibrate` (w1.1), 2.2.0 `uptime` (w1.2), 2.3.0 gave line 2
# `self_test` (w2.1). 3.0.0 added line 3 at w3.0, with a Rust-only rename (`gain` -> `amp_gain`, STD-125). 4.0.0
# retired line 1 (`ww api line retire`): `wire_v1` stays behind `retired_wire_v1`, which `tests/thermo` and
# `tests/thermo_devices` turn on to keep a host and a device of line 1. Line 0 stays retired, line 4 unspoken
# (`tests/thermo`'s `a_fourth_line_is_refused`).
[package.metadata.wire_weaver.roots]
"wire_v2::Thermo" = "w2.1"
"wire_v3::Thermo" = "w3.0"

[package.metadata.wire_weaver.retired_roots]
"wire_v1::Thermo" = "w1.2"

[features]
default = ["std"]
# turns no_std off, switches the derived types from borrowed to owned, and forwards std to ww_api and ww_si
std = ["ww_api/std", "ww_si/std"]
# wire line w1 retired on 2026-11-22: cargo build --features retired_wire_v1 to compare
retired_wire_v1 = []

[dependencies]
ww_api.workspace = true
ww_si = { workspace = true, features = ["time", "thermal", "dimensionless", "counting"] }

[dev-dependencies]
wire_weaver_evolution = { workspace = true, features = ["source"] }

[lints]
workspace = true
