# One line of the `thermo_api` bench API (EVO-28). Both lines are the same crate, `thermo_api`, at two versions,
# so they live outside the workspace (`exclude` in the root Cargo.toml): a workspace can't hold two packages of one
# name. Fields that members inherit are written out for the same reason.
[package]
name = "thermo_api"
version = "2.1.0"
publish = false
edition = "2024"
license = "MIT"

[features]
default = ["std"]
std = ["wire_weaver/std", "ww_si/std", "ww_indication/std"]

[dependencies]
wire_weaver = { path = "../../../wire_weaver", default-features = false }
ww_indication = { path = "../../../ww_stdlib/ww_indication", default-features = false }
ww_si = { path = "../../../ww_stdlib/ww_si", default-features = false, features = ["time", "thermal", "dimensionless", "counting"] }
