# `thermo_api` 2.0.0 as it was published: lines 1 and 2 at their first revisions, w1.0 and w2.0, before `calibrate`
# (w1.1), `uptime` (w1.2) and `self_test` (w2.1). Built as old firmware still in the field. Outside the workspace
# (`exclude` in the root Cargo.toml), which can't hold two packages of one name; fields members inherit are written out.
[package]
name = "thermo_api"
version = "2.0.0"
publish = false
edition = "2024"
license = "MIT"

[package.metadata.wire_weaver.roots]
"wire_v1::Thermo" = "w1.0"
"wire_v2::Thermo" = "w2.0"

[features]
default = ["std"]
std = ["ww_api/std", "ww_si/std"]

[dependencies]
ww_api = { path = "../../../ww_api", default-features = false }
ww_si = { git = "https://github.com/vhrdtech/ww_base", default-features = false, features = ["time", "thermal", "dimensionless", "counting"] }
