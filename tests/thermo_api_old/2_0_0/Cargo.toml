# `thermo_api` 5.0.0 as it was published: lines 5 and 6 at their first revisions, w5.0 and w6.0, the lines 1 and 2 of
# 4.0.0 moved to new lines by R7's indication swap (line 3 retired; line 7 came with 6.0.0). Built as old firmware still in the field. Outside the workspace
# (`exclude` in the root Cargo.toml), which can't hold two packages of one name; fields members inherit are written out.
[package]
name = "thermo_api"
version = "5.0.0"
publish = false
edition = "2024"
license = "MIT"

[package.metadata.wire_weaver.roots]
"wire_v1::Thermo" = "w5.0"
"wire_v2::Thermo" = "w6.0"

[features]
default = ["std"]
std = ["ww_api/std", "ww_si/std"]

[dependencies]
ww_api = { path = "../../../ww_api", default-features = false }
ww_si = { git = "https://github.com/vhrdtech/ww_base", default-features = false, features = ["time", "thermal", "dimensionless", "counting"] }
