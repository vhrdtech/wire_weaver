# The first revision of a line of the bench API as it was published, its root at the crate root, before the lines
# moved into one crate (`tests/thermo_api`, EVO-42): built as old firmware still in the field. Outside the workspace
# (`exclude` in the root Cargo.toml), which can't hold two packages of one name; fields members inherit are written out.
[package]
name = "thermo_api"
version = "1.0.0"
publish = false
edition = "2024"
license = "MIT"

[features]
default = ["std"]
std = ["wire_weaver/std", "ww_si/std", "ww_indication/std"]

[dependencies]
wire_weaver = { path = "../../../wire_weaver", default-features = false }
ww_indication = { path = "../../../ww_stdlib/ww_indication", default-features = false }
ww_si = { path = "../../../ww_stdlib/ww_si", default-features = false, features = ["time", "thermal", "dimensionless", "counting"] }
