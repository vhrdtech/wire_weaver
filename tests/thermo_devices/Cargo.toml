[package]
name = "thermo_devices"
version = "0.1.0"
publish = false
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Simulated firmware of every line of the thermo_api bench (EVO-28), on tests_common's in-process link."

[package.metadata.cargo-machete]
# the code ww_codegen! generates names ww_stream
ignored = ["ww_stream"]

[[bin]]
name = "thermo_pytest_devices"
path = "src/bin/thermo_pytest_devices.rs"

[dependencies]
tests_common.workspace = true
thermo_api = { workspace = true, features = ["retired_wire_v1"] }
thermo_api_2_0_0.workspace = true
wire_weaver = { workspace = true, features = ["std"] }
ww_client_server = { workspace = true, features = ["std"] }
ww_hub.workspace = true
ww_si = { workspace = true, features = ["std"] }
ww_stream = { workspace = true, features = ["std"] }

[lints]
workspace = true
