[package]
name = "toml_settings_api"
version = "0.1.0"
publish = false
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Test API of ww_json's TOML form (INT-18): a settings tree of nested structs, quantities, enums, lists and options"

# Wire version of the API (EVO-31): link setup decides on its line, `#[since]` names its revisions
[package.metadata.wire_weaver]
wire = "w1.0"

[features]
default = ["std"]
# turns no_std off, switches the derived types from borrowed to owned, and forwards std to ww_api and ww_si
std = ["ww_api/std", "ww_si/std"]

[dependencies]
ww_api.workspace = true
ww_si = { workspace = true, features = ["time", "counting", "dimensionless"] }

[lints]
workspace = true
