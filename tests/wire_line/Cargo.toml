[package]
name = "wire_line"
version = "0.1.0"
publish = false
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Link setup decides on the wire line, not the crate version (EVO-25): old firmware on an old line connecting to a host built against a newer one."

[dev-dependencies]
tests_common.workspace = true
tokio = { workspace = true, features = ["sync", "rt-multi-thread", "rt", "macros"] }
tracing-subscriber.workspace = true
wire_line_api.workspace = true
wire_line_old_api.workspace = true
wire_weaver.workspace = true
wire_weaver_client = { workspace = true, features = ["clock_sync", "usb"] }
ww_client_server.workspace = true

[lints]
workspace = true
