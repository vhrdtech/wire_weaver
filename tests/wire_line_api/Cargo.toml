[package]
name = "wire_line_api"
version = "0.4.0"
publish = false
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "An API after a crate breaking bump that stayed on its wire line (EVO-25); used by tests/wire_line against wire_line_old_api firmware."

# Wire version of the API (EVO-31): link setup decides on its line, `#[since]` names its revisions
[package.metadata.wire_weaver]
wire = "w2.4"

[features]
default = ["std"]
# forwards std to ww_api; this crate itself is always no_std
std = ["ww_api/std"]

[dependencies]
ww_api = { workspace = true }

[lints]
workspace = true
