[package]
name = "wire_line_old_api"
version = "0.3.0"
publish = false
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "The API of tests/wire_line at its old version, wire w2.3, as firmware already in the field runs it."

[features]
default = ["std"]
# forwards std to ww_api; this crate itself is always no_std
std = ["ww_api/std"]

[dependencies]
ww_api = { workspace = true }

[lints]
workspace = true
