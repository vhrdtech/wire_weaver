# https://github.com/crate-ci/typos/blob/master/docs/reference.md

[files]
# generated hex dumps of the ww_dfu scenario tests
# superseded definitions are named by their signature in hex (EVO-68)
extend-exclude = ["tests/dfu_scenarios/transcripts/", "**/api_snapshots/superseded/"]

[default.extend-identifiers]
# the building-automation protocol (its engineering-unit codes, STD-71)
BACnet = "BACnet"
# plural of PNG, read as "PN" + "Gs"
PNGs = "PNGs"

[default.extend-words]
## Project-specific acronyms and abbreviations
unx = "unx"
# ser = serialize (ser/des)
ser = "ser"
# STM32 high speed internal oscillator
hsi = "hsi"
# GPIO output type (push-pull / open-drain)
ot = "ot"
# SD card status AKE_SEQ_ERROR (authentication key exchange)
ake = "ake"
# the ratatui crate (terminal UI)
ratatui = "ratatui"
# therm, the unit symbol (customary units catalogue)
thm = "thm"

[default]
# golden bytes and signatures of the conformance corpus (tests/conformance/corpus.json) are hex, and so are the
# signatures in the conformance matrix (`7f0a980582914d0b`)
# a short git commit hash in prose (docs/articles/flash_budget.md): "commit 15ba3c20" tokenizes as "ba", a false
# positive for "by"/"be"
extend-ignore-re = ["\"(bytes|shape|with_docs)\": \"[0-9a-f ]*\"", "`[0-9a-f]{16}`", "commit [0-9a-f]{6,40}\\b"]
extend-ignore-identifiers-re = []
