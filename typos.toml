# https://github.com/crate-ci/typos/blob/master/docs/reference.md

[files]
# generated hex dumps of the ww_dfu scenario tests
extend-exclude = ["tests/dfu_scenarios/transcripts/"]

[default.extend-identifiers]
# plural of PNG, read as "PN" + "Gs"
PNGs = "PNGs"

[default.extend-words]
## Project-specific acronyms and abbreviations
unx = "unx"
# ser = serialize (ser/des)
ser = "ser"
# STM32 high speed internal oscillator
hsi = "hsi"
# GPIO output type (push-pull / open-drain)
ot = "ot"

[default]
extend-ignore-identifiers-re = []
