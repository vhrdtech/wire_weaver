# https://github.com/crate-ci/typos/blob/master/docs/reference.md

[files]
# generated hex dumps of the ww_dfu scenario tests
extend-exclude = ["tests/dfu_scenarios/transcripts/"]

[default.extend-identifiers]
# the building-automation protocol (its engineering-unit codes, STD-71)
BACnet = "BACnet"
# plural of PNG, read as "PN" + "Gs"
PNGs = "PNGs"

[default.extend-words]
## Project-specific acronyms and abbreviations
unx = "unx"
# ser = serialize (ser/des)
ser = "ser"
# STM32 high speed internal oscillator
hsi = "hsi"
# GPIO output type (push-pull / open-drain)
ot = "ot"
# SD card status AKE_SEQ_ERROR (authentication key exchange)
ake = "ake"
# the ratatui crate (terminal UI)
ratatui = "ratatui"
# therm, the unit symbol (customary units catalogue)
thm = "thm"

[default]
# golden bytes of the conformance corpus (tests/conformance/corpus.json) are hex
extend-ignore-re = ["\"bytes\": \"[0-9a-f ]*\""]
extend-ignore-identifiers-re = []
