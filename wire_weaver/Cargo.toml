[package]
name = "wire_weaver"
edition.workspace = true
version.workspace = true
authors.workspace = true
description.workspace = true
license.workspace = true
repository.workspace = true
documentation = "https://vhrdtech.github.io/wire_weaver"

[features]
default = ["std"]
std = [
    "dep:futures-core",
    "exact_units/information",
    "shrink_wrap/std",
    "ww_error/std",
    "ww_version/std",
]
defmt = [
    "dep:defmt",
    "exact_units/defmt",
    "shrink_wrap/defmt",
    "ww_error/defmt",
    "ww_version/defmt",
]
serde = ["shrink_wrap/serde"]

[dependencies]
defmt = { workspace = true, optional = true }
# `Millis` of `CallContext::deadline`, with `std` `Bytes` of `call::MessageTooBig`: type aliases, no code
exact_units = { workspace = true, features = ["time"] }
futures-core = { workspace = true, optional = true }
shrink_wrap = { workspace = true, default-features = false }
wire_weaver_derive.workspace = true
ww_error = { workspace = true, default-features = false }
ww_version = { workspace = true, default-features = false }
