[package]
name = "wire_weaver"
edition.workspace = true
rust-version.workspace = true
version.workspace = true
authors.workspace = true
description.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://vhrdtech.github.io/wire_weaver"

[features]
default = ["std"]
# build against std instead of no_std: boxed item streams (call::ItemStream) through futures-core, the
# authorization hook (authorize) with the items' ww_self metadata
std = [
    "dep:futures-core",
    "exact_units/information",
    "shrink_wrap/std",
    "ww_api/std",
    "ww_version/std",
    "ww_trace_context/std",
    "dep:ww_self",
    "ww_self/std",
]
# defmt formatting for the runtime's types
defmt = [
    "dep:defmt",
    "exact_units/defmt",
    "shrink_wrap/defmt",
    "ww_api/defmt",
    "ww_version/defmt",
    "ww_trace_context/defmt",
]
# serde for the runtime's types
serde = ["shrink_wrap/serde", "ww_api/serde"]

[dependencies]
defmt = { workspace = true, optional = true }
# `Millis` of `CallContext::deadline`, with `std` `Bytes` of `call::MessageTooBig`: type aliases, no code
exact_units = { workspace = true, features = ["time"] }
futures-core = { workspace = true, optional = true }
shrink_wrap = { workspace = true, default-features = false }
ww_api = { workspace = true, default-features = false }
# the API model's metadata and effects of the items an authorization hook sees (authorize, std only)
ww_self = { workspace = true, optional = true }
ww_trace_context = { workspace = true, default-features = false }
ww_version = { workspace = true, default-features = false }

[lints]
workspace = true
