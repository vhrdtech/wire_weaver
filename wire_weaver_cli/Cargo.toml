[package]
name = "wire_weaver_cli"
version.workspace = true
authors.workspace = true
description = "The generic commands of the WireWeaver command line tool, and the registry a binary assembles them with"
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
license.workspace = true

# `q` quits a live view (util::QuitKey)
[target.'cfg(unix)'.dependencies]
rustix.workspace = true

# `q` on Windows (util::QuitKey)
[target.'cfg(windows)'.dependencies]
crossterm.workspace = true

[dependencies]
anyhow.workspace = true
clap = { workspace = true, features = ["derive", "env"] }
clap_complete = { workspace = true, features = ["unstable-dynamic"] }
cnt_core.workspace = true
console.workspace = true
hex = { workspace = true, features = ["std"] }
human-repr.workspace = true
indicatif.workspace = true
inventory.workspace = true
ron.workspace = true
semver.workspace = true
serde = { workspace = true, features = ["std"] }
serde_json.workspace = true
shrink_wrap = { workspace = true, features = ["std"] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "signal", "sync"] }
toml_edit = { workspace = true, features = ["display", "parse"] }
tracing.workspace = true
tracing-subscriber.workspace = true
wire_weaver.workspace = true
wire_weaver_client = { workspace = true, features = ["clock_sync", "hub", "picoboot", "rtt", "stm32_dfu", "usb"] }
ww_hub.workspace = true
ww_hub_api = { workspace = true, features = ["std"] }
ww_plugin.workspace = true
ww_snapshots.workspace = true

wire_weaver_core.workspace = true
wire_weaver_evolution = { workspace = true, features = ["source"] }
ww_numeric.workspace = true
ww_quantity.workspace = true
ww_settings = { workspace = true, features = ["dump"] }
ww_si = { workspace = true, features = ["std"] }
ww_timebase = { workspace = true, features = ["std"] }

[lints]
workspace = true
