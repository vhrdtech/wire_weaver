[package]
name = "wire_weaver_cli"
version.workspace = true
authors.workspace = true
description = "WireWeaver command line tool"
edition.workspace = true
repository.workspace = true
license.workspace = true

[[bin]]
name = "ww"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
# chunky_mcu_updater checked out next to this repository (~/git/chunky_mcu_updater), as chunky uses ../wire_weaver
chunky_ww_host = { path = "../../chunky_mcu_updater/chunky_ww_host" }
clap = { workspace = true, features = ["derive", "env"] }
clap_complete = { workspace = true, features = ["unstable-dynamic"] }
cnt_core.workspace = true
cnt_view.workspace = true
console.workspace = true
human-repr = "1.1"
indicatif = "0.18"
nusb.workspace = true
proc-macro2.workspace = true
ron.workspace = true
semver.workspace = true
serde_json.workspace = true
shrink_wrap = { workspace = true, features = ["std"] }
syn.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "signal", "sync"] }
toml.workspace = true
toml_edit.workspace = true
tracing = "0.1"
tracing-subscriber.workspace = true
wire_weaver.workspace = true
wire_weaver_client = { workspace = true, features = ["picoboot", "stm32_dfu", "local_socket"] }
ww_hub.workspace = true

wire_weaver_core.workspace = true
ww_clock_sync.workspace = true
ww_counters = { workspace = true, features = ["std", "host"] }
ww_dfu = { workspace = true, features = ["std"] }
ww_indication = { workspace = true, features = ["std"] }
ww_numeric.workspace = true
ww_pin_probe.workspace = true
ww_report.workspace = true
ww_settings = { workspace = true, features = ["dump"] }
ww_si = { workspace = true, features = ["std"] }
ww_timebase = { workspace = true, features = ["std"] }

[dev-dependencies]
tap_api.workspace = true
tests_common.workspace = true
wire_weaver_client = { workspace = true, features = ["in_process"] }
ww_client_server.workspace = true
ww_stream.workspace = true
ww_user_info = { workspace = true, features = ["std"] }
