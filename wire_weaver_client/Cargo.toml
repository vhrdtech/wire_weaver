[package]
name = "wire_weaver_client"
version.workspace = true
authors.workspace = true
description.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
license.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
libc.workspace = true

[package.metadata.cargo-machete]
# the code ww_codegen! generates for the Clock client names ww_date_time
ignored = ["ww_date_time"]

[features]
default = ["usb", "clock_sync"]
# USB (using nusb)
usb = []
# PICOBOOT flashing (RP2040/RP2350 boot ROM): follow::rp2_update(), ww_picoboot re-export, ELF images
picoboot = [
    "usb",
    "ww_picoboot/usb",
    "ww_picoboot/elf",
]
# STM32 system bootloader (ROM DFU, DfuSe) flashing: follow::stm32_dfu_update(), ww_stm32_dfu re-export, ELF images
stm32_dfu = [
    "usb",
    "ww_stm32_dfu/usb",
    "ww_stm32_dfu/elf",
]
# WebSocket (using tokio-tungstenite)
ws = [
    "dep:tokio-tungstenite",
    "dep:futures-util",
    "ww_device?/ws",
    "tokio/io-util",
]
# UDP, one ww_framer frame per datagram
udp = ["tokio/net"]
# CAN Bus using USB or Ethernet to CAN bridges or socketcan on Linux
can = []
# RTT over JTAG/SWD
rtt = ["dep:probe-rs"]
# I2C using USB or Ethernet to I2C bridges or kernel I2C interface on Linux
i2c = []
# UART using USB or Ethernet to UART bridges or system provided serial ports
uart = []
# device running in the same process (simulators, tests)
in_process = [
    "dep:ww_device",
    "ww_device/udp",
]
# device served by another process (or the ww hub): Unix socket, named pipe on Windows
local_socket = [
    "ww_local_socket/socket",
    "dep:interprocess",
    "dep:ww_device",
    "tokio/io-util",
]
# keeps a device's clock on the PC's UTC (ww_timebase::Clock, CLT-46): every direct connection steers by itself
clock_sync = [
    "dep:ww_timebase",
    "dep:ww_date_time",
    "ww_si/time",
]
# connect() through the ww hub when it holds the device or it pays off (CLT-39), starts the hub if needed
hub = [
    "local_socket",
    "dep:ww_hub_api",
]

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = ["Win32_Foundation", "Win32_System_Diagnostics_ToolHelp"] }

[dependencies]
anyhow.workspace = true
either.workspace = true
exact_units = { workspace = true, features = ["information"] }
futures-lite.workspace = true
futures-util = { workspace = true, features = ["sink"], optional = true }
hex = { workspace = true, features = ["std"] }
interprocess = { workspace = true, optional = true }
nusb.workspace = true # TODO: try to use without tokio?
probe-rs = { workspace = true, features = ["builtin-targets", "builtin-formats"], optional = true }
ron.workspace = true
semver.workspace = true
sha2.workspace = true
strum = { workspace = true, features = ["derive"] }
thiserror.workspace = true
tokio = { workspace = true, features = ["sync", "rt", "time", "macros"] }
tokio-tungstenite = { workspace = true, optional = true }
tracing.workspace = true
wire_weaver = { workspace = true, features = ["std"] }
wire_weaver_evolution.workspace = true
ww_client_server = { workspace = true, features = ["std"] }
ww_date_time = { workspace = true, features = ["std"], optional = true }
ww_device = { workspace = true, optional = true }
ww_error = { workspace = true, features = ["std"] }
ww_framer = { workspace = true, features = ["std", "large"] }
ww_global.workspace = true
ww_hub_api = { workspace = true, features = ["std"], optional = true }
ww_keyed = { workspace = true, features = ["std"] }
ww_link = { workspace = true, features = ["std"] }
ww_local_socket.workspace = true # the runtime dir for holders' lock files, sockets with `local_socket`
ww_lz4 = { workspace = true, features = ["std"] }
ww_numeric = { workspace = true, features = ["std"] }
ww_picoboot.workspace = true
ww_self = { workspace = true, features = ["expr", "serde", "std"] }
# customary: a host knows every unit by name (DynUnit::from_name, Python's convert), firmware opts in on its own
ww_si = { workspace = true, features = ["std", "customary"] }
ww_snapshots = { workspace = true, features = ["fetch"] }
ww_stm32_dfu.workspace = true
ww_stream = { workspace = true, features = ["std"] }
ww_tap = { workspace = true, features = ["std"] }
ww_tape = { workspace = true, features = ["std"] }
ww_tape_fs.workspace = true
ww_timebase = { workspace = true, features = ["std"], optional = true }
ww_version = { workspace = true, features = ["std"] }

[dev-dependencies]
crc.workspace = true
tokio = { workspace = true, features = ["net", "rt-multi-thread", "test-util"] }
trybuild.workspace = true
wire_weaver_core = { workspace = true }
ww_device = { workspace = true, features = ["udp", "ws"] }
ww_self = { workspace = true, features = ["fuzz"] }
ww_stream = { workspace = true, features = ["std", "lz4"] }

[lints]
workspace = true
