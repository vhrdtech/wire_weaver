[package]
name = "wire_weaver_client"
version.workspace = true
authors.workspace = true
description.workspace = true
edition.workspace = true
repository.workspace = true
license.workspace = true

[features]
default = ["usb"]
usb = [] # USB (using nusb)
picoboot = [
    "usb",
    "ww_picoboot/usb",
    "ww_picoboot/elf",
] # PICOBOOT flashing (RP2040/RP2350 boot ROM): follow::rp2_update(), ww_picoboot re-export, ELF images
stm32_dfu = [
    "usb",
    "ww_stm32_dfu/usb",
    "ww_stm32_dfu/elf",
] # STM32 system bootloader (ROM DFU, DfuSe) flashing: follow::stm32_dfu_update(), ww_stm32_dfu re-export, ELF images
ws = [
    "dep:tokio-tungstenite",
    "dep:futures-util",
] # WebSocket (using tokio-tungstenite)
udp = ["tokio/net"] # UDP, one ww_framer frame per datagram
can = [] # CAN Bus using USB or Ethernet to CAN bridges or socketcan on Linux
rtt = ["dep:probe-rs"] # RTT over JTAG/SWD
i2c = [] # I2C using USB or Ethernet to I2C bridges or kernel I2C interface on Linux
uart = [] # UART using USB or Ethernet to UART bridges or system provided serial ports
in_process = ["dep:ww_device"] # device running in the same process (simulators, tests)

[dependencies]
anyhow.workspace = true
either = "1"
futures-lite = "2.6"
futures-util = { version = "0.3", default-features = false, features = ["sink"], optional = true }
hex = { workspace = true, features = ["std"] }
nusb.workspace = true # TODO: try to use without tokio?
probe-rs = { version = "0.32", default-features = false, features = ["builtin-targets", "builtin-formats"], optional = true }
ron.workspace = true
semver.workspace = true
strum.workspace = true # EnumDiscriminants-generated code refers to it, even though only strum_macros is imported
strum_macros.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["sync", "rt", "time", "macros"] }
tokio-tungstenite = { version = "0.30", optional = true }
tracing = "0.1"
wire_weaver = { workspace = true, features = ["std"] }
wire_weaver_snapshots.workspace = true
ww_client_server = { workspace = true, features = ["std"] }
ww_device = { workspace = true, optional = true }
ww_framer = { workspace = true, features = ["std", "large"] }
ww_global.workspace = true
ww_link = { workspace = true, features = ["std"] }
ww_lz4 = { workspace = true, features = ["std"] }
ww_numeric = { workspace = true, features = ["std"] }
ww_picoboot.workspace = true
ww_self = { workspace = true, features = ["expr", "serde", "std"] }
ww_si = { workspace = true, features = ["std"] }
ww_stm32_dfu.workspace = true
ww_stream = { workspace = true, features = ["std"] }
ww_tap = { workspace = true, features = ["std"] }
ww_tape = { workspace = true, features = ["std"] }
ww_version = { workspace = true, features = ["std"] }

[dev-dependencies]
tokio = { workspace = true, features = ["net", "test-util"] }
wire_weaver_core = { workspace = true }
ww_device = { workspace = true, features = ["udp", "ws"] }
ww_self = { workspace = true, features = ["fuzz"] }
ww_stream = { workspace = true, features = ["std", "lz4"] }
