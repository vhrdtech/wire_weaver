# nucleo_g0b1re_template's API crate at 0.4.0 (its release 0.1.8), with its snapshots saved by the wire_weaver of
# 94a6b3a, before ItemEnum::future_version (EVO-10): an old-format snapshot for tests/check.rs (EVO-13). The git
# dependencies are paths into this repository; the crate is read from source, never built.
[package]
name = "nucleo_g0b1re_api"
version = "0.4.0"
edition = "2024"
description = "WireWeaver API of the nucleo_g0b1re firmware"

[features]
# owned (alloc) variants of the API types, for host-side users
std = [
    "wire_weaver/std",
    "ww_board_info/std",
    "ww_counters/std",
    "ww_dfu/std",
    "ww_firmware_info/std",
    "ww_indication/std",
    "ww_log/std",
    "ww_pin_diag/std",
    "ww_timebase/std",
    "ww_uid/std",
    "ww_user_info/std",
]
defmt = [
    "wire_weaver/defmt",
    "ww_firmware_info/defmt",
    "ww_indication/defmt",
    "ww_pin_diag/defmt",
    "ww_timebase/defmt",
    "ww_user_info/defmt",
    "dep:defmt",
]

[dependencies]
defmt = { version = "1.1", optional = true }
wire_weaver = { path = "../../../../wire_weaver", default-features = false }
# the device contract (`device`): stdlib traits generic host tools know
# FirmwareInfo, LastReset; `std` reads every architecture's fault record
ww_firmware_info = { path = "../../../../ww_stdlib/ww_firmware_info", default-features = false, features = ["cortex-m"] }
ww_board_info = { path = "../../../../ww_stdlib/ww_board_info", default-features = false }
ww_uid = { path = "../../../../ww_stdlib/ww_uid", default-features = false }
# UserInfo: the unit's name, kept in the firmware's settings store
ww_user_info = { path = "../../../../ww_stdlib/ww_user_info", default-features = false }
ww_counters = { path = "../../../../ww_stdlib/ww_counters", default-features = false }
ww_log = { path = "../../../../ww_stdlib/ww_log", default-features = false }
ww_dfu = { path = "../../../../ww_stdlib/ww_dfu", default-features = false }
# PinDiag: raw access to the free pins for pin tests (`ww pins tui`)
ww_pin_diag = { path = "../../../../ww_stdlib/ww_pin_diag", default-features = false }
# `leds` and `clock`: LD4's indication, the clock a host steers onto UTC
ww_indication = { path = "../../../../ww_stdlib/ww_indication", default-features = false }
ww_timebase = { path = "../../../../ww_stdlib/ww_timebase", default-features = false }
