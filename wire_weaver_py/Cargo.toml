[package]
name = "wire_weaver_py"
version.workspace = true
authors.workspace = true
description = "Python module talking to any WireWeaver device, with its API built at runtime from introspection data"
edition.workspace = true
repository.workspace = true
license.workspace = true
publish = false # distributed as a Python wheel, built by wire_weaver_wheel in vhrdtech/ww_tools

[features]
# RTT over a debug probe (probe-rs), no system libraries needed; the wheel turns it on
rtt = ["wire_weaver_client/rtt"]

[dependencies]
exact_units = { workspace = true, features = ["std", "shrink_wrap"] }
pyo3.workspace = true
shrink_wrap.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "time"] }
wire_weaver_client = { workspace = true, features = ["hub"] }
wire_weaver_core.workspace = true
ww_error = { workspace = true, features = ["std"] }
ww_hub.workspace = true
ww_snapshots.workspace = true

[lints]
workspace = true
