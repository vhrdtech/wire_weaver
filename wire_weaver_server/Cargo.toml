[package]
name = "wire_weaver_server"
version.workspace = true
authors.workspace = true
description = "WireWeaver host server: many connections to one API, on any async runtime"
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
license.workspace = true

[target.'cfg(unix)'.dependencies]
# what accept errors a source waits out (byte_stream::is_transient)
libc.workspace = true
rustix = { workspace = true, features = ["process"], optional = true }

[features]
default = []
# The in-process listener: clients of the same process connect by path (tests, simulators)
in_process = ["dep:wire_weaver_client", "wire_weaver_client/in_process"]
# TCP and stdio sources for byte-stream listeners, on tokio
tokio = [
    "dep:rustix",
    "dep:tokio",
    "dep:tokio-util",
    "tokio/io-std",
    "tokio/net",
    "tokio/time",
]
# The UDP listener: a connection per host of a datagram socket (ww_device::udp's peer table)
udp = ["ww_device/std"]
# The local-socket source (Unix socket, named pipe on Windows), also on a socket systemd passed; runs on tokio
local_socket = ["tokio", "dep:ww_local_socket", "ww_local_socket/socket"]

[dependencies]
futures-channel = { workspace = true, features = ["std"] }
futures-util = { workspace = true, features = ["alloc", "io", "std"] }
tokio = { workspace = true, optional = true }
tokio-util = { workspace = true, optional = true }
wire_weaver = { workspace = true, features = ["std"] }
wire_weaver_client = { workspace = true, optional = true }
ww_byte_stream = { workspace = true, features = ["device", "ws"] }
ww_client_server = { workspace = true, features = ["std"] }
ww_device.workspace = true
ww_link = { workspace = true, features = ["std"] }
ww_local_socket = { workspace = true, optional = true }
ww_self = { workspace = true, features = ["std"] }

[lints]
workspace = true
