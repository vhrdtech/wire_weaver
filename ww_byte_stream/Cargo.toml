[package]
name = "ww_byte_stream"
version.workspace = true
authors.workspace = true
description = "WireWeaver over byte streams: the connection preamble and message framing"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true

[features]
default = []
# One connection as a ww_device medium (MessageTx, MessageRx), for servers
device = ["dep:ww_device"]

[dependencies]
futures-util = { workspace = true, features = ["io", "std"] }
ww_device = { workspace = true, optional = true }

[dev-dependencies]
futures-util = { workspace = true, features = ["io", "std", "async-await-macro"] }
tokio = { workspace = true, features = ["io-util", "time", "rt", "macros"] }
tokio-util.workspace = true

[lints]
workspace = true
