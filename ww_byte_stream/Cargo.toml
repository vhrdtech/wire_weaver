[package]
name = "ww_byte_stream"
version.workspace = true
authors.workspace = true
description = "WireWeaver over byte streams: the connection preamble and message framing"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true

[features]
default = []
# One connection as a ww_device medium (MessageTx, MessageRx), for servers
device = ["dep:ww_device"]
# WebSocket framing: the HTTP upgrade and binary messages (ws::Upgrade, WsReader, WsWriter; ws::medium with `device`)
ws = ["dep:edge-http", "dep:edge-ws", "dep:httparse"]

[dependencies]
edge-http = { workspace = true, optional = true }
edge-ws = { workspace = true, optional = true }
futures-util = { workspace = true, features = ["io", "std"] }
httparse = { workspace = true, optional = true }
ww_device = { workspace = true, optional = true }

[dev-dependencies]
futures-util = { workspace = true, features = ["io", "std", "async-await-macro"] }
tokio = { workspace = true, features = ["io-util", "time", "rt", "macros"] }
tokio-util.workspace = true

[lints]
workspace = true
