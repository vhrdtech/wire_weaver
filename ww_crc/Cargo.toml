[package]
name = "ww_crc"
version.workspace = true
authors.workspace = true
description = "The CRCs of WireWeaver's framer, link, block, settings and stream crates, one lookup table each, sized by cargo feature"
edition.workspace = true
repository.workspace = true
license.workspace = true

[features]
default = []
# 256-entry lookup table per algorithm (1 KiB for a CRC-32), about 8x faster than bitwise
table-256 = []
# 16 tables of 256 entries per algorithm (16 KiB for a CRC-32), the fastest; wins over table-256 when both are on
table-slice16 = []

[dependencies]
crc.workspace = true
