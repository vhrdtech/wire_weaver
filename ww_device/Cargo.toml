[package]
name = "ww_device"
version.workspace = true
authors.workspace = true
description = "WireWeaver device side: sans-IO link state machine and event loop building blocks, no_std and no alloc"
edition.workspace = true
repository.workspace = true
license.workspace = true

[features]
default = []
defmt = ["dep:defmt", "wire_weaver/defmt", "ww_link/defmt", "embassy-net?/defmt"]
# Log through the `log` crate, e.g., on std (`defmt` takes precedence if both are enabled)
log = ["dep:log"]
# Clock implementation using embassy-time
embassy-time = ["dep:embassy-time"]
# RTT (SEGGER Real-Time Transfer) medium on top of rtt-target channels
rtt = ["dep:rtt-target"]
# WebSocket medium over any TCP-like socket
ws = ["dep:edge-ws", "dep:edge-http", "dep:httparse", "dep:embassy-sync"]
# WebSocket on an embassy-net TCP socket
embassy-net = ["ws", "embassy-time", "dep:embassy-net"]

[dependencies]
defmt = { workspace = true, optional = true }
edge-http = { version = "0.8", default-features = false, optional = true }
edge-ws = { version = "0.8", default-features = false, optional = true }
embassy-futures = "0.1"
embassy-net = { version = "0.9", features = ["tcp", "proto-ipv4", "medium-ip"], optional = true }
embassy-sync = { version = "0.8", optional = true }
embassy-time = { version = "0.5", optional = true }
httparse = { version = "1.10", default-features = false, optional = true }
log = { version = "0.4", optional = true }
rtt-target = { version = "0.6", optional = true }
wire_weaver.workspace = true
ww_client_server.workspace = true
ww_framer.workspace = true
ww_link.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["rt", "macros", "time", "sync"] }
ww_version.workspace = true
