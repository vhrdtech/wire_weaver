[package]
name = "ww_device"
version.workspace = true
authors.workspace = true
description = "WireWeaver device side: sans-IO link state machine and event loop building blocks, no_std and no alloc"
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
license.workspace = true

[features]
default = []
# defmt formatting for the device side's types
defmt = ["dep:defmt", "wire_weaver/defmt", "ww_link/defmt", "embassy-net?/defmt"]
# Log through the `log` crate, e.g., on std (`defmt` takes precedence if both are enabled)
log = ["dep:log"]
# Clock implementation using embassy-time
embassy-time = ["dep:embassy-time"]
# RTT (SEGGER Real-Time Transfer) medium on top of rtt-target channels
rtt = ["dep:rtt-target"]
# WebSocket medium over any TCP-like socket
ws = [
    "dep:edge-ws",
    "dep:edge-http",
    "dep:httparse",
    "dep:embassy-sync",
    "embassy-net?/tcp",
]
# WebSocket on futures-io streams (ws::IoSocket): a device on a host, a simulator; needs std
futures-io = ["ws", "dep:futures-util", "futures-util/io", "futures-util/std"]
# UDP medium over any datagram socket
udp = ["embassy-net?/udp"]
# Standard library sockets for the enabled media (UDP on std::net::UdpSocket, on any event loop), and framed
# media that own their buffers (OwnedFramedTx, OwnedFramedRx)
std = ["udp", "ww_link/std"]
# embassy-net sockets for the enabled media: WebSocket on a TCP socket, UDP on a UDP socket
embassy-net = ["embassy-time", "dep:embassy-net"]

[dependencies]
defmt = { workspace = true, optional = true }
edge-http = { workspace = true, optional = true }
edge-ws = { workspace = true, optional = true }
embassy-futures.workspace = true
embassy-net = { workspace = true, features = ["proto-ipv4", "medium-ip"], optional = true }
embassy-sync = { workspace = true, optional = true }
embassy-time = { workspace = true, optional = true }
futures-util = { workspace = true, optional = true }
httparse = { workspace = true, optional = true }
log = { workspace = true, optional = true }
rtt-target = { workspace = true, optional = true }
wire_weaver.workspace = true
ww_client_server.workspace = true
ww_framer.workspace = true
ww_link.workspace = true
ww_tap.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["rt", "macros", "time", "sync", "net"] }
ww_version.workspace = true

# The workspace lints, copied: this crate holds unsafe code (`unsafe = true` in layers.toml), which the workspace
# forbids. Every unsafe block has a `// SAFETY:` comment.
[lints.cargo]
unused_workspace_dependencies = "deny"

[lints.rust]
# `cargo fuzz` builds with `--cfg fuzzing`: ww_self and ww_stream gate their fuzz entry points on it
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(fuzzing)'] }
unsafe_code = "allow" # unsafe = true in layers.toml: the workspace forbids it elsewhere
