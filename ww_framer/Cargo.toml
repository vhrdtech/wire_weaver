[package]
name = "ww_framer"
version.workspace = true
authors.workspace = true
description = "Packs many small WireWeaver messages into one packet or splits a big one across several"
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
license.workspace = true

[package.metadata.wire_weaver]
# its line is the GENERATION in the link setup hello (EVO-23): a wire break bumps it
wire = "w1.0"

[features]
# build against std instead of no_std: a bigger CRC-32 table
std = ["shrink_wrap/std", "ww_crc/table-slice16"]
# defmt formatting for the framer's types
defmt = ["dep:defmt"]
# a wider length field in the head, for messages past the default size
large = []
# a wider length field still, for messages past what `large` covers
very_large = []

[dependencies]
defmt = { workspace = true, optional = true }
shrink_wrap.workspace = true
ww_crc.workspace = true

# The workspace lints, copied: this crate holds unsafe code (`unsafe = true` in layers.toml), which the workspace
# forbids. Every unsafe block has a `// SAFETY:` comment.
[lints.cargo]
unused_workspace_dependencies = "deny"

[lints.rust]
# `cargo fuzz` builds with `--cfg fuzzing`: ww_self and ww_stream gate their fuzz entry points on it
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(fuzzing)'] }
unsafe_code = "allow" # unsafe = true in layers.toml: the workspace forbids it elsewhere
