[package]
name = "ww_hub"
version.workspace = true
authors.workspace = true
description = "The ww hub: one process per user that holds WireWeaver devices and serves every program (SRV-13)"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[dependencies]
futures-lite.workspace = true
futures-util = { workspace = true, features = ["io", "std"] }
interprocess.workspace = true
nusb.workspace = true
semver.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "sync", "time", "io-util"] }
tracing.workspace = true
wire_weaver = { workspace = true, features = ["std"] }
wire_weaver_client = { workspace = true, features = ["clock_sync", "hub", "in_process"] }
ww_byte_stream.workspace = true
ww_client_server = { workspace = true, features = ["std"] }
ww_device.workspace = true
ww_error = { workspace = true, features = ["std"] }
ww_hub_api = { workspace = true, features = ["std"] }
ww_local_socket = { workspace = true, features = ["socket"] }
ww_si = { workspace = true, features = ["std", "time"] }
ww_tap.workspace = true
ww_timebase = { workspace = true, features = ["std"] }

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "sync", "time", "io-util", "test-util"] }

[lints]
workspace = true
