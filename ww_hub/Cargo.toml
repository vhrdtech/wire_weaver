[package]
name = "ww_hub"
version.workspace = true
authors.workspace = true
description = "The ww hub: one process per user that holds WireWeaver devices and serves every program (SRV-13)"
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
futures-lite = "2.6"
interprocess.workspace = true
nusb.workspace = true
semver.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "sync", "time", "io-util"] }
tracing = "0.1"
wire_weaver = { workspace = true, features = ["std"] }
wire_weaver_client = { workspace = true, features = ["hub", "in_process"] }
ww_client_server = { workspace = true, features = ["std"] }
ww_clock_sync.workspace = true
ww_device.workspace = true
ww_hub_api = { workspace = true, features = ["std"] }
ww_local_socket = { workspace = true, features = ["socket"] }
ww_si = { workspace = true, features = ["std", "time"] }
ww_timebase = { workspace = true, features = ["std"] }

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "sync", "time", "io-util", "test-util"] }
