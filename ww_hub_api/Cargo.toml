[package]
name = "ww_hub_api"
version = "0.1.0"
authors.workspace = true
description = "API of the ww hub: the per-user process that holds devices and serves every program (SRV-13)"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true

# Wire version of the API (EVO-31): link setup decides on its line, `#[since]` names its revisions
[package.metadata.wire_weaver]
wire = "w1.0"

[features]
default = ["std"]
std = ["ww_api/std", "ww_si/std", "ww_timebase/std"]

[dependencies]
ww_api.workspace = true
ww_si = { workspace = true, default-features = false, features = ["time", "information", "counting", "u64"] }
ww_timebase.workspace = true

[lints]
workspace = true
