[package]
name = "ww_local_socket"
version.workspace = true
authors.workspace = true
description = "WireWeaver over local sockets: user-only Unix sockets and named pipes, the hub preamble, message framing"
edition.workspace = true
license.workspace = true
repository.workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[features]
default = ["socket"]
# Sockets, the preamble and message framing (interprocess, tokio); without it only the runtime dir and file names
socket = [
    "dep:interprocess",
    "dep:tokio",
    "dep:tracing",
    "dep:widestring",
    "dep:windows-sys",
]

[dependencies]
interprocess = { workspace = true, optional = true }
tokio = { workspace = true, features = ["io-util", "time", "net"], optional = true }
tracing = { version = "0.1", optional = true }

[target.'cfg(windows)'.dependencies]
widestring = { workspace = true, optional = true }
windows-sys = { workspace = true, features = ["Win32_Foundation", "Win32_Security", "Win32_System_Threading"], optional = true }

[dev-dependencies]
tokio = { workspace = true, features = ["io-util", "time", "rt", "macros"] }
