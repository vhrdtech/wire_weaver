[package]
name = "ww_lz4"
version = "0.1.0"
authors.workspace = true
description = "Streaming LZ4 block encoder for no_std and no alloc: one standard LZ4 block per chunk, history kept across chunks"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true

[features]
default = []
# the host side Decoder
std = ["dep:lz4_flex"]
# hot encoder code in .data.ww_lz4 on bare metal (target_os = "none"): cortex-m-rt copies it to SRAM, no flash wait states
ram = []

[dependencies]
lz4_flex = { workspace = true, optional = true }

[dev-dependencies]
lz4_flex = { workspace = true, features = ["std"] }
proptest.workspace = true
ww_lz4 = { workspace = true, features = ["std"] }

# The workspace lints, copied: this crate holds unsafe code (`unsafe = true` in layers.toml), which the workspace
# forbids. Every unsafe block has a `// SAFETY:` comment.
[lints.cargo]
unused_workspace_dependencies = "deny"

[lints.rust]
# `cargo fuzz` builds with `--cfg fuzzing`: ww_self and ww_stream gate their fuzz entry points on it
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(fuzzing)'] }
unsafe_code = "allow" # unsafe = true in layers.toml: the workspace forbids it elsewhere
