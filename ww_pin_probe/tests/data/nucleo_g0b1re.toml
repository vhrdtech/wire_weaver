[pins]
PA13 = { role = "taken", short = "SWDIO", note = "ST-LINK SWDIO through SB13 and the CN4 [3-4] jumper. Only free with both CN4 jumpers off, i.e. no on-board debugger." }
PA14 = { role = "taken", short = "SWCLK", note = "ST-LINK SWCLK through SB9 and the CN4 [1-2] jumper; also BOOT0. Only free with the CN4 jumpers off." }
PF2 = { role = "taken", short = "NRST", note = "Reset: B2 button, the ST-LINK's T_NRST through SB19, Arduino CN6-3. Not a GPIO on this board." }
PA2 = { role = "shared", short = "VCP RX", note = "USART2 TX to the ST-LINK virtual COM port (SB18 ON by default). A GPIO on CN10-34 only with SB18 OFF; then JP6 [1-2] keeps the VCP from floating." }
PA3 = { role = "shared", short = "VCP TX", note = "USART2 RX from the ST-LINK virtual COM port (SB16 ON by default). A GPIO on CN10-6 only with SB16 OFF." }
PA5 = { role = "shared", short = "LD4", note = "Drives the user LED LD4 through T2 (SB22 ON by default); also Arduino D13 / SPI1 SCK. SB22 OFF isolates the LED." }
PC13 = { role = "shared", short = "B1", note = "USER button B1 to GND with a pull-up (SB20 ON by default); SB20 OFF frees it. Also on CN7-23." }
PC14 = { role = "function", short = "LSE", note = "32.768 kHz crystal X2 (OSC32_IN). Not on the headers: SB23 OFF by default; SB23 ON + R31 out puts it on CN7-25 as a GPIO." }
PC15 = { role = "function", short = "LSE", note = "32.768 kHz crystal X2 (OSC32_OUT). SB24 OFF by default; SB24 ON + R32 out puts it on CN7-27 as a GPIO." }
PF0 = { role = "shared", short = "MCO 8 MHz", note = "OSC_IN: X3 is not fitted; SB17 ON feeds the ST-LINK's 8 MHz MCO here (an HSE bypass clock), SB25 ON puts it on CN7-29. For a GPIO: SB17 OFF." }
PF1 = { role = "free", short = "OSC_OUT", note = "OSC_OUT of the unfitted X3; on CN7-31 through SB27 (ON). A GPIO as the board ships." }
PB8 = { role = "free", short = "", note = "Arduino D15 / I2C1 SCL on CN5-10. SB5 ON (default OFF) also ties it to CN8-6 (A5) for I2C shields." }
PB9 = { role = "free", short = "", note = "Arduino D14 / I2C1 SDA on CN5-9. SB2 ON (default OFF) also ties it to CN8-5 (A4)." }
PB11 = { role = "free", short = "", note = "Arduino A4 (ADC IN15) on CN8-5 and CN7-36 through SB4 (ON). SB4 OFF + SB2 ON puts PB9 there instead, for I2C shields." }
PB12 = { role = "free", short = "", note = "Arduino A5 (ADC IN16) on CN8-6 and CN7-38 through SB3 (ON). SB3 OFF + SB5 ON puts PB8 there instead, for I2C shields." }
PD8 = { role = "free", short = "", note = "GPIO on CN10-36. SB30 ON (default OFF) ties it to GND, the 'power reserved' option in UM2324." }
PD9 = { role = "free", short = "", note = "GPIO on CN10-38. SB29 ON (default OFF) ties it to VDD." }
PA11 = { role = "free", short = "USB DM", note = "The G0B1's USB DM on CN10-14; no USB connector on the board, wire one here for a USB device." }
PA12 = { role = "free", short = "USB DP", note = "The G0B1's USB DP on CN10-12; no USB connector on the board." }

