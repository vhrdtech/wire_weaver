# Board description for boardmap (bedrock_board): what to draw of the NUCLEO-G0B1RE and what every pin does.
# Facts: UM2324 Rev 5 (jumpers, solder bridges, Arduino names), the MB1360 C02 schematic and ST's board file.

[board]
name = "NUCLEO-G0B1RE"
pcb = "MB1360 rev C02"
mcu = "STM32G0B1RET6 (U7)"
mcu_ref = "U7"
geometry = "nucleo_g0b1re.geometry.json"
sources = ["UM2324 Rev 5", "MB1360-G0B1RE-C02 schematic"]
scale = 9.0

[view]
# the ST-LINK part breaks off along the slot at 24.6 mm from the top edge
cut = [25.0]

[[view.connector]]
ref = "CN7"
label = "CN7 ST morpho"
