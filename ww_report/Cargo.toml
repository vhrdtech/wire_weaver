[package]
name = "ww_report"
version.workspace = true
authors.workspace = true
description = "Device info and bug report of any WireWeaver device: firmware, board, ids, counters, log and last reset decoded with its ELF"
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
anyhow.workspace = true
cnt_core.workspace = true
defmt-decoder.workspace = true
object = { version = "0.40", default-features = false, features = ["read_core", "elf", "std"] }
rustc-demangle = "0.1"
serde = { workspace = true, features = ["std"] }
serde_json.workspace = true
tokio = { workspace = true, features = ["time", "rt", "sync"] }
wire_weaver = { workspace = true, features = ["std"] }
wire_weaver_client.workspace = true
ww_board_info = { workspace = true, features = ["std"] }
ww_counters = { workspace = true, features = ["std", "host"] }
ww_firmware_info = { workspace = true, features = ["std"] }
ww_log = { workspace = true, features = ["std"] }
ww_si = { workspace = true, features = ["std", "time"] }
ww_uid = { workspace = true, features = ["std"] }
ww_user_info = { workspace = true, features = ["std"] }
