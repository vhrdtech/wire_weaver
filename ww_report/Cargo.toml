[package]
name = "ww_report"
version.workspace = true
authors.workspace = true
description = "Device info and bug report of any WireWeaver device: firmware, board, ids, counters, log and last reset decoded with its ELF"
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
addr2line = { version = "0.27", default-features = false, features = ["std"] }
anyhow.workspace = true
cnt_core.workspace = true
defmt-decoder.workspace = true
gimli = { version = "0.34", default-features = false, features = ["endian-reader", "read", "std"] }
object = { version = "0.40", default-features = false, features = ["read_core", "elf", "std"] }
rustc-demangle = "0.1"
serde = { workspace = true, features = ["std"] }
tokio = { workspace = true, features = ["time", "rt", "sync"] }
wire_weaver = { workspace = true, features = ["std"] }
wire_weaver_client.workspace = true
ww_board_info = { workspace = true, features = ["std", "host"] }
ww_counters = { workspace = true, features = ["std", "host"] }
ww_firmware_info = { workspace = true, features = ["std"] }
ww_log = { workspace = true, features = ["std"] }
ww_settings = { workspace = true, features = ["fake-flash"] }
ww_si = { workspace = true, features = ["std", "time"] } # used by codegen in generated code (ww_codegen! macro), not by name in source
ww_uid = { workspace = true, features = ["std"] }
ww_user_info = { workspace = true, features = ["std"] }

[dev-dependencies]
embassy-futures.workspace = true
serde_json.workspace = true
