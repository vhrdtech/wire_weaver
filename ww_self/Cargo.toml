[package]
name = "ww_self"
version = "0.3.0"
authors.workspace = true
description = "WireWeaver AST describing API and data types, can also be serialized using ShrinkWrap for introspection"
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = ["std"]
std = [
    "shrink_wrap/std",
    "exact_units/std",
    "ww_numeric/std",
    "ww_version/std",
    "dep:anyhow",
    "dep:sha2",
]
serde = [
    "dep:serde",
    "exact_units/serde",
    "ww_version/serde",
    "ww_numeric/serde",
    "shrink_wrap/serde",
]
# values and calls written as Rust expressions (`expr` module), for tools
expr = ["std", "dep:quote", "dep:syn"]
# `fuzz_bundle` (bundle generator for fuzzing) for tests of other crates
fuzz = ["std"]

[dependencies]
anyhow = { workspace = true, optional = true }
exact_units = { workspace = true, features = ["shrink_wrap"] }
quote = { workspace = true, optional = true }
serde = { workspace = true, optional = true }
sha2 = { workspace = true, optional = true }
shrink_wrap.workspace = true
syn = { workspace = true, optional = true }
ww_numeric.workspace = true
ww_version.workspace = true

[lints.rust]
# `cargo fuzz` builds with `--cfg fuzzing`: the entry point for the `introspection` fuzz target
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(fuzzing)'] }
