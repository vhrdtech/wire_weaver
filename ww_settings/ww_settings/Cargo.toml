[package]
name = "ww_settings"
version.workspace = true
authors.workspace = true
description = "Power-cut safe settings store for devices: a struct of fields with defaults, kept as an evolvable shrink_wrap record in NOR flash"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true

[features]
default = []
# build against std instead of no_std: a bigger CRC-32 table
std = ["shrink_wrap/std", "ww_crc/table-slice16"]
# defmt formatting for the store's types
defmt = ["dep:defmt", "shrink_wrap/defmt"]
# fake_flash::FakeFlash: a NorFlash in RAM with power cuts, ECC and a write-once check, for tests
fake-flash = ["std"]
# dump: a host decoder of a Store flash dump (TOOL-12), on top of fake-flash's RAM NorFlash
dump = ["fake-flash", "dep:embassy-futures"]

[dependencies]
defmt = { workspace = true, optional = true }
embassy-futures = { workspace = true, optional = true }
embedded-storage-async.workspace = true
shrink_wrap.workspace = true
ww_crc.workspace = true
ww_settings_derive.workspace = true

[dev-dependencies]
embassy-futures.workspace = true
shrink_wrap = { workspace = true, features = ["std"] }
ww_settings = { workspace = true, features = ["dump"] }

# The workspace lints, copied: this crate holds unsafe code (`unsafe = true` in layers.toml), which the workspace
# forbids. Every unsafe block has a `// SAFETY:` comment.
[lints.cargo]
unused_workspace_dependencies = "deny"

[lints.rust]
# `cargo fuzz` builds with `--cfg fuzzing`: ww_self and ww_stream gate their fuzz entry points on it
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(fuzzing)'] }
unsafe_code = "allow" # unsafe = true in layers.toml: the workspace forbids it elsewhere
