[package]
name = "ww_adc"
version = "0.3.0"
authors.workspace = true
description = "Analog input (ADC) data types and remote API: readings, streams, captures"
edition.workspace = true
license.workspace = true
repository = "https://github.com/vhrdtech/ww_stdlib"

# Wire version of the traits and types of this crate (EVO-26): `#[since]` in it names its revisions
[package.metadata.wire_weaver]
wire = "w3.0"

[features]
default = ["std"]
std = ["wire_weaver/std", "ww_numeric/std", "ww_si/std"]
defmt = ["dep:defmt", "wire_weaver/defmt", "ww_numeric/defmt", "ww_si/defmt"]

[dependencies]
defmt = { workspace = true, optional = true }
wire_weaver = { workspace = true, default-features = false }
ww_numeric = { workspace = true, default-features = false }
ww_si = { workspace = true, default-features = false, features = ["time", "information", "counting"] }
