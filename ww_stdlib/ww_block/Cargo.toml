[package]
name = "ww_block"
version = "0.1.0"
authors.workspace = true
description = "Read, write and erase a block device (SD card, eMMC, flash) over WireWeaver, writes under a lease"
edition.workspace = true
license.workspace = true
repository = "https://github.com/vhrdtech/ww_stdlib"

# Wire version of the traits and types of this crate (EVO-26): `#[since]` in it names its revisions
[package.metadata.wire_weaver]
wire = "w1.0"

[features]
default = ["std"]
std = ["wire_weaver/std", "ww_error/std", "ww_si/std"]
defmt = ["dep:defmt", "wire_weaver/defmt", "ww_error/defmt", "ww_si/defmt"]
# crc32/crc32_update table size, smallest (bitwise) to fastest; enabling both picks crc-table-slice16.
crc-table-256 = []
crc-table-slice16 = []

[dependencies]
crc.workspace = true
defmt = { workspace = true, optional = true }
wire_weaver.workspace = true
ww_error = { workspace = true, default-features = false }
ww_si = { workspace = true, default-features = false, features = ["time", "information", "counting"] }
