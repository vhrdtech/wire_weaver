[package]
name = "ww_board_info"
version = "0.3.0"
authors.workspace = true
description = "PCB/PCBA information (name, revision, etc.) and requesting API"
edition.workspace = true
license.workspace = true
repository = "https://github.com/vhrdtech/ww_stdlib"

# Wire version of the traits and types of this crate (EVO-26): `#[since]` in it names its revisions
[package.metadata.wire_weaver]
wire = "w1.2"

[features]
default = ["std"]
std = ["wire_weaver/std", "ww_date_time/std", "ww_error/std"]
defmt = ["dep:defmt", "wire_weaver/defmt", "ww_error/defmt", "ww_settings/defmt"]
# record: the bench record and the allowance read and written through a boot ROM (flashers, `ww info`)
host = ["std", "ww_settings/dump"]

[dependencies]
defmt = { workspace = true, optional = true }
embedded-storage-async.workspace = true
wire_weaver.workspace = true
ww_date_time.workspace = true
ww_error = { workspace = true, default-features = false }
ww_settings.workspace = true

[dev-dependencies]
embassy-futures.workspace = true
ww_board_info = { path = ".", features = ["host"] }
