[package]
name = "ww_can_bus"
version = "0.1.0"
authors.workspace = true
description = "CAN bus API: configure, send, receive, filters, status, for simple nodes up to analyzers"
edition.workspace = true
license.workspace = true
repository = "https://github.com/vhrdtech/ww_stdlib"

[features]
default = ["std"]
std = ["wire_weaver/std", "ww_si/std"]
defmt = ["dep:defmt", "wire_weaver/defmt", "ww_si/defmt"]
# CAN XL (`CanXl`, `XlFrame`): 2 KiB frames, so only devices with XL carry them
xl = []

[dependencies]
defmt = { workspace = true, optional = true }
wire_weaver = { workspace = true, default-features = false }
ww_si = { workspace = true, default-features = false, features = ["time", "electrical"] }
