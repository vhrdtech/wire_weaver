[package]
name = "ww_can_bus"
version = "0.1.0"
authors.workspace = true
description = "CAN bus API: configure, send, receive, filters, status, for simple nodes up to analyzers"
edition.workspace = true
license.workspace = true
repository = "https://github.com/vhrdtech/ww_stdlib"

# Wire version of the traits and types of this crate (EVO-26): `#[since]` in it names its revisions
[package.metadata.wire_weaver]
wire = "w3.0"

[features]
default = ["std"]
std = ["ww_api/std", "ww_si/std"]
defmt = ["dep:defmt", "ww_api/defmt", "ww_si/defmt"]
# CAN XL (`CanXl`, `XlFrame`): 2 KiB frames, so only devices with XL carry them
xl = []

[dependencies]
defmt = { workspace = true, optional = true }
ww_api = { workspace = true, default-features = false }
ww_si = { workspace = true, default-features = false, features = ["time", "electrical", "dimensionless", "information", "counting"] }
