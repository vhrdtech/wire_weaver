[package]
name = "ww_client_server"
version = "0.2.0"
authors.workspace = true
description = "Client-server API model data types for both no_std and std."
edition.workspace = true
license.workspace = true
repository = "https://github.com/vhrdtech/ww_stdlib"

[package.metadata.wire_weaver]
# its line is the GENERATION in the link setup hello (EVO-23): a wire break bumps it
wire = "w1.0"

[features]
default = ["std"]
# hosts read and send everything; a firmware turns on only the parts it serves
std = ["wire_weaver/std", "ww_si/std", "multi", "streams"]
# MultiCall, MultiRead, MultiWrite (MultiIndex, MultiArgs): needed by a server generated with `multi_req = true`
multi = []
# counted and reliable streams and credit sinks: SinkWrite requests, StreamItem events, the Ack/Resend/Query
# sideband; plain streams and their StreamOpen don't need it
streams = []

[dependencies]
wire_weaver.workspace = true
ww_global.workspace = true
# timestamps in stream heads: Second { Micro, U32 }; a host unwraps them into U64 (ww_si host, part of std).
# Periods are Micros, byte grants and budgets Bytes and BytePerSecond, missed sends Count<Event>, clock epochs
# Index<Boot>, resource indices Index<Resource>: types only, nothing linked that isn't used
ww_si = { workspace = true, features = ["time", "u32", "information", "counting"] }
