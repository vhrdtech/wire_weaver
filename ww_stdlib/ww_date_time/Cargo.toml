[package]
name = "ww_date_time"
version = "0.1.0"
authors.workspace = true
description = "Date and time types for shrink_wrap"
edition.workspace = true
license.workspace = true
repository = "https://github.com/vhrdtech/ww_stdlib"

# Wire version of the traits and types of this crate (EVO-26): `#[since]` in it names its revisions
[package.metadata.wire_weaver]
wire = "w2.0"

[features]
default = ["std", "chrono"]
std = ["shrink_wrap/std", "exact_units/std"]
defmt = ["dep:defmt", "shrink_wrap/defmt", "exact_units/defmt"]
chrono = ["dep:chrono"]

[dependencies]
chrono = { version = "0.4", default-features = false, optional = true }
defmt = { workspace = true, optional = true }
exact_units = { workspace = true, features = ["shrink_wrap", "time", "counting"] }
shrink_wrap.workspace = true

[dev-dependencies]
hex-literal.workspace = true
