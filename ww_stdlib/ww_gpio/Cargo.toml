[package]
name = "ww_gpio"
version = "0.1.0"
edition.workspace = true
description = "GPIO control data types and remote bridging API"
license.workspace = true
repository = "https://github.com/vhrdtech/ww_stdlib"
authors.workspace = true

[features]
default = ["std"]
std = ["wire_weaver/std", "ww_si/std"]
defmt = ["dep:defmt", "wire_weaver/defmt", "ww_si/defmt"]

[dependencies]
defmt = { workspace = true, optional = true }
wire_weaver = { workspace = true, default-features = false }
ww_si = { workspace = true, default-features = false, features = ["electrical"] }

# Wire version of the traits and types of this crate (EVO-26): `#[since]` in it names its revisions
[package.metadata.wire_weaver]
wire = "w1.0"
