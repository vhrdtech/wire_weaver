[package]
name = "ww_interned"
version = "0.1.0"
authors.workspace = true
description = "Strings sent as an index into the firmware's string table, resolved on the host from its ELF"
edition.workspace = true
license.workspace = true
repository = "https://github.com/vhrdtech/ww_stdlib"

# Wire version of the traits and types of this crate (EVO-26): `#[since]` in it names its revisions
[package.metadata.wire_weaver]
wire = "w1.0"

[features]
default = ["std"]
std = ["wire_weaver/std", "ww_si/std"]
defmt = ["dep:defmt", "wire_weaver/defmt", "ww_si/defmt"]

[dependencies]
defmt = { workspace = true, optional = true }
wire_weaver = { workspace = true, default-features = false }
ww_si = { workspace = true, default-features = false, features = ["counting"] }
