[package]
name = "ww_log"
version = "0.1.0"
authors.workspace = true
description = "Logs of bare metal firmware: defmt frames and text records as reliable streams"
edition.workspace = true
license.workspace = true
repository = "https://github.com/vhrdtech/ww_stdlib"

# Wire version of the traits and types of this crate (EVO-26): `#[since]` in it names its revisions
[package.metadata.wire_weaver]
wire = "w1.0"

[features]
default = ["std"]
std = ["wire_weaver/std"]
defmt = ["dep:defmt", "wire_weaver/defmt"]

[dependencies]
defmt = { workspace = true, optional = true }
wire_weaver = { workspace = true, default-features = false }
