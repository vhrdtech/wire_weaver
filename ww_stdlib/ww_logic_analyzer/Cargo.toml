[package]
name = "ww_logic_analyzer"
version = "0.1.0"
authors.workspace = true
description = "Logic analyzer remote API: triggered captures, streaming, raw and transition encodings"
edition.workspace = true
license.workspace = true
repository = "https://github.com/vhrdtech/ww_stdlib"

[features]
default = ["std"]
std = ["wire_weaver/std", "ww_gpio/std", "ww_i2c/std", "ww_si/std"]
defmt = [
    "dep:defmt",
    "wire_weaver/defmt",
    "ww_gpio/defmt",
    "ww_i2c/defmt",
    "ww_si/defmt",
]

[dependencies]
defmt = { workspace = true, optional = true }
wire_weaver = { workspace = true, default-features = false }
ww_gpio = { workspace = true, default-features = false }
ww_i2c = { workspace = true, default-features = false }
ww_si = { workspace = true, default-features = false }
