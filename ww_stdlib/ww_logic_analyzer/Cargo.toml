[package]
name = "ww_logic_analyzer"
version = "0.1.0"
authors.workspace = true
description = "Logic analyzer remote API: triggered captures, streaming, raw and transition encodings"
edition.workspace = true
license.workspace = true
repository = "https://github.com/vhrdtech/ww_stdlib"

# Wire version of the traits and types of this crate (EVO-26): `#[since]` in it names its revisions
[package.metadata.wire_weaver]
wire = "w3.0"

[features]
default = ["std"]
std = ["ww_api/std", "ww_gpio/std", "ww_i2c/std", "ww_si/std", "ww_spi/std"]
defmt = [
    "dep:defmt",
    "ww_api/defmt",
    "ww_gpio/defmt",
    "ww_i2c/defmt",
    "ww_si/defmt",
    "ww_spi/defmt",
]

[dependencies]
defmt = { workspace = true, optional = true }
ww_api = { workspace = true, default-features = false }
ww_gpio = { workspace = true, default-features = false }
ww_i2c = { workspace = true, default-features = false }
ww_si = { workspace = true, default-features = false, features = [
    "time",
    "electrical",
    "information",
    "counting",
] }
ww_spi = { workspace = true, default-features = false }
