[package]
name = "ww_memory"
version = "0.1.0"
authors.workspace = true
description = "WireWeaver traits for low-level access to memory or registers"
edition.workspace = true
license.workspace = true
repository = "https://github.com/vhrdtech/ww_stdlib"

# Wire version of the traits and types of this crate (EVO-26): `#[since]` in it names its revisions
[package.metadata.wire_weaver]
wire = "w2.0"

[features]
default = ["std"]
std = ["ww_api/std"]
defmt = ["dep:defmt", "ww_api/defmt"]

[dependencies]
defmt = { workspace = true, optional = true }
ww_api = { workspace = true, default-features = false }
