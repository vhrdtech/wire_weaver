[package]
name = "ww_numeric"
version = "0.2.0"
authors.workspace = true
description = "Various numeric types, subtypes, shift-scale"
edition.workspace = true
license.workspace = true
repository = "https://github.com/vhrdtech/ww_stdlib"

# Wire version of the traits and types of this crate (EVO-26): `#[since]` in it names its revisions
[package.metadata.wire_weaver]
wire = "w1.0"

[features]
default = ["std"]
# every number type: a host does not know what a device will send
std = ["shrink_wrap/std", "all"]
defmt = ["dep:defmt", "shrink_wrap/defmt"]
serde = ["dep:serde", "shrink_wrap/serde"]

# NumericValue variants, one feature each (U8 is always there): firmware enables the number types it uses
all = [
    "nibble",
    "u16",
    "u32",
    "unib32",
    "u64",
    "i32",
    "f32",
    "un",
    "in",
    "u128",
    "i8",
    "i16",
    "i64",
    "i128",
    "f64",
    "uvlq32",
    "uvlq64",
    "inib32",
]
nibble = []
u16 = []
u32 = []
unib32 = []
u64 = []
i32 = []
f32 = []
un = []
in = []
u128 = []
i8 = []
i16 = []
i64 = []
i128 = []
f64 = []
uvlq32 = []
uvlq64 = []
inib32 = []

[dependencies]
defmt = { workspace = true, optional = true }
serde = { workspace = true, optional = true }
shrink_wrap.workspace = true

[dev-dependencies]
proptest.workspace = true
