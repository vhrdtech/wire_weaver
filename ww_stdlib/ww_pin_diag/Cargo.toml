[package]
name = "ww_pin_diag"
version = "0.1.0"
authors.workspace = true
description = "Raw access to a board's digital points for bring-up and production tests: shorts, pulls, connectivity"
edition.workspace = true
license.workspace = true
repository = "https://github.com/vhrdtech/ww_stdlib"

# Wire version of the traits and types of this crate (EVO-26): `#[since]` in it names its revisions
[package.metadata.wire_weaver]
wire = "w2.0"

[features]
default = ["std"]
std = ["ww_api/std", "ww_gpio/std", "ww_interned/std", "ww_si/std"]
defmt = [
    "dep:defmt",
    "ww_api/defmt",
    "ww_gpio/defmt",
    "ww_interned/defmt",
    "ww_si/defmt",
]

[dependencies]
defmt = { workspace = true, optional = true }
ww_api = { workspace = true, default-features = false }
ww_gpio = { workspace = true, default-features = false }
ww_interned = { workspace = true, default-features = false }
ww_si = { workspace = true, default-features = false, features = ["counting"] }
