[package]
name = "ww_self"
version = "0.1.1"
authors.workspace = true
description = "WireWeaver AST describing API and data types, can also be serialized using ShrinkWrap for introspection"
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = ["std"]
std = ["shrink_wrap/std", "ww_numeric/std", "ww_version/std", "dep:anyhow"]
serde = ["dep:serde", "ww_version/serde", "ww_numeric/serde", "shrink_wrap/serde"]

[dependencies]
anyhow = { version = "1.0", optional = true }
serde = { workspace = true, optional = true }
shrink_wrap.workspace = true
ww_numeric.workspace = true
ww_version.workspace = true
