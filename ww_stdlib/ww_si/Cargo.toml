[package]
name = "ww_si"
version = "0.2.0"
authors.workspace = true
description = "Statically and dynamically typed SI values"
edition.workspace = true
license.workspace = true
repository = "https://github.com/vhrdtech/ww_stdlib"

[features]
default = ["std"]
std = [
    "shrink_wrap/std",
    "ww_numeric/std",
    "exact_units/std",
    "all",
    "quantities",
    "host",
]
defmt = ["dep:defmt", "shrink_wrap/defmt", "ww_numeric/defmt", "exact_units/defmt"]

# quantity groups: a firmware enables the ones it uses, std enables all of them
quantities = [
    "time",
    "electrical",
    "mechanical",
    "angle",
    "thermal",
    "chemical",
    "photometric",
    "radiation",
    "logarithmic",
    "dimensionless",
    "information",
    "counting",
    "customary",
]
# Second, Hertz, HertzPerSecond, Baud, Timed
time = ["exact_units/time"]
# Ampere, Volt, Ohm, Farad, Siemens, Henry, Coulomb, Watt, Weber, Tesla
electrical = ["exact_units/electrical"]
# Meter, KiloGram, Newton, Pascal, Joule, Torque, Litre, VolumetricFlow, Speed, Acceleration, Jerk, Snap, Yank
mechanical = ["exact_units/mechanical"]
# Radian, Degree, Turn, Steradian, AngularVelocity, AngularAcceleration: angle is a base dimension of its own
angle = ["exact_units/angle"]
# Kelvin, DegreeCelsius
thermal = ["exact_units/thermal"]
# Mole, Katal
chemical = ["exact_units/chemical"]
# Candela, Lumen, Lux
photometric = ["exact_units/photometric"]
# Becquerel, Gray, Sievert, ElectronVolt
radiation = ["exact_units/radiation"]
# DeciBel, DeciBelmW
logarithmic = []
# Ratio (duty, probability, scale): used next to any other group, so a group of its own
dimensionless = ["exact_units/dimensionless"]
# Bit, Byte (8 Bit), Word (4 Byte): information, a base dimension of its own
information = ["exact_units/information"]
# Item, Sample, Frame, Packet, Cycle, Block, Sector, Chunk, Char, Code: counted bases, each a dimension of its own
counting = ["exact_units/counting"]
# imperial, US customary and other units outside the SI (exact_units' customary): inch, pound, psi, gallon, Btu, ...
customary = ["exact_units/customary"]
# host helpers: timestamp Unwrapper
host = ["time", "u64"]

# number types of ww_numeric::NumericValue, see ww_numeric; all of them come with std
all = [
    "nibble",
    "u16",
    "u32",
    "unib32",
    "u64",
    "i32",
    "f32",
    "un",
    "in",
    "u128",
    "i8",
    "i16",
    "i64",
    "i128",
    "f64",
    "uvlq32",
    "uvlq64",
]
nibble = ["ww_numeric/nibble"]
u16 = ["ww_numeric/u16"]
u32 = ["ww_numeric/u32"]
unib32 = ["ww_numeric/unib32"]
u64 = ["ww_numeric/u64"]
i32 = ["ww_numeric/i32"]
f32 = ["ww_numeric/f32"]
un = ["ww_numeric/un"]
in = ["ww_numeric/in"]
u128 = ["ww_numeric/u128"]
i8 = ["ww_numeric/i8"]
i16 = ["ww_numeric/i16"]
i64 = ["ww_numeric/i64"]
i128 = ["ww_numeric/i128"]
f64 = ["ww_numeric/f64"]
uvlq32 = ["ww_numeric/uvlq32"]
uvlq64 = ["ww_numeric/uvlq64"]

[dependencies]
defmt = { workspace = true, optional = true }
exact_units = { workspace = true, features = ["shrink_wrap"] }
shrink_wrap.workspace = true
ww_numeric.workspace = true
