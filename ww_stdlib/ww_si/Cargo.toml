[package]
name = "ww_si"
version = "0.1.0"
authors.workspace = true
description = "Statically and dynamically typed SI values"
edition.workspace = true
license.workspace = true
repository = "https://github.com/vhrdtech/ww_stdlib"

[features]
default = ["std"]
std = ["shrink_wrap/std", "ww_numeric/std", "all"]
defmt = ["dep:defmt", "shrink_wrap/defmt", "ww_numeric/defmt"]

# number types of ww_numeric::NumericValue, see ww_numeric; all of them come with std
all = [
    "nibble",
    "u16",
    "u32",
    "unib32",
    "u64",
    "i32",
    "f32",
    "un",
    "in",
    "u128",
    "i8",
    "i16",
    "i64",
    "i128",
    "f64",
]
nibble = ["ww_numeric/nibble"]
u16 = ["ww_numeric/u16"]
u32 = ["ww_numeric/u32"]
unib32 = ["ww_numeric/unib32"]
u64 = ["ww_numeric/u64"]
i32 = ["ww_numeric/i32"]
f32 = ["ww_numeric/f32"]
un = ["ww_numeric/un"]
in = ["ww_numeric/in"]
u128 = ["ww_numeric/u128"]
i8 = ["ww_numeric/i8"]
i16 = ["ww_numeric/i16"]
i64 = ["ww_numeric/i64"]
i128 = ["ww_numeric/i128"]
f64 = ["ww_numeric/f64"]

[dependencies]
defmt = { workspace = true, optional = true }
shrink_wrap.workspace = true
ww_numeric.workspace = true
