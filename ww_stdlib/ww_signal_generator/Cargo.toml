[package]
name = "ww_signal_generator"
version = "0.1.0"
authors.workspace = true
description = "Signal generator remote API: digital pattern generators replaying analyzer captures, DAC waveforms"
edition.workspace = true
license.workspace = true
repository = "https://github.com/vhrdtech/ww_stdlib"

# Wire version of the traits and types of this crate (EVO-26): `#[since]` in it names its revisions
[package.metadata.wire_weaver]
wire = "w2.0"

[features]
default = ["std"]
std = ["ww_api/std", "ww_adc/std", "ww_logic_analyzer/std", "ww_si/std"]
defmt = [
    "dep:defmt",
    "ww_api/defmt",
    "ww_adc/defmt",
    "ww_logic_analyzer/defmt",
    "ww_si/defmt",
]

[dependencies]
defmt = { workspace = true, optional = true }
ww_adc = { workspace = true, default-features = false }
ww_api = { workspace = true, default-features = false }
ww_logic_analyzer = { workspace = true, default-features = false }
ww_si = { workspace = true, default-features = false, features = ["time", "electrical"] }
