[package]
name = "ww_std_cli"
version.workspace = true
authors.workspace = true
description = "The ww commands of the WireWeaver standard library APIs: board, counters, dfu, pins, report, and the device parts of info and sync"
edition.workspace = true
repository = "https://github.com/vhrdtech/ww_stdlib"
license.workspace = true

[dependencies]
anyhow.workspace = true
clap = { workspace = true, features = ["derive", "env"] }
clap_complete = { workspace = true, features = ["unstable-dynamic"] }
cnt_core.workspace = true
cnt_view.workspace = true
console.workspace = true
# `ww pins tui`
crossterm.workspace = true
indicatif = "0.18"
inventory.workspace = true
nusb.workspace = true
ratatui.workspace = true
serde = { workspace = true, features = ["std"] }
serde_json.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "signal", "sync"] }
tracing = "0.1"
wire_weaver.workspace = true
wire_weaver_cli.workspace = true
wire_weaver_client = { workspace = true, features = ["picoboot", "stm32_dfu", "hub"] }
ww_board_info = { workspace = true, features = ["std"] }
ww_counters = { workspace = true, features = ["std", "host"] }
ww_dfu = { workspace = true, features = ["std"] }
ww_indication = { workspace = true, features = ["std"] }
ww_pin_probe.workspace = true
ww_report.workspace = true
# the codegen names exact_units types through this crate's re-export
ww_si = { workspace = true, features = ["std"] }

# ww_si is used by the generated code of `ww_codegen!`, which cargo machete does not see
[package.metadata.cargo-machete]
ignored = ["ww_si"]

[dev-dependencies]
tests_common.workspace = true
user_info_api.workspace = true
wire_weaver_cli = { workspace = true, features = ["test-support"] }
ww_client_server.workspace = true
ww_user_info = { workspace = true, features = ["std"] }
