[package]
name = "ww_uart"
version = "0.1.0"
authors.workspace = true
description = "UART data types and remote bridging API"
edition.workspace = true
license.workspace = true
repository = "https://github.com/vhrdtech/ww_stdlib"

# Wire version of the traits and types of this crate (EVO-26): `#[since]` in it names its revisions
[package.metadata.wire_weaver]
wire = "w1.0"

[features]
default = ["std"]
std = ["wire_weaver/std", "ww_si/std"]
defmt = ["dep:defmt", "wire_weaver/defmt"]

[dependencies]
defmt = { workspace = true, optional = true }
wire_weaver.workspace = true
ww_si = { workspace = true, features = ["time", "electrical"] }
