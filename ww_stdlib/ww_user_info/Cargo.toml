[package]
name = "ww_user_info"
version = "0.1.0"
authors.workspace = true
description = "Device user name and notes"
edition.workspace = true
license.workspace = true
repository = "https://github.com/vhrdtech/ww_stdlib"

# Wire version of the traits and types of this crate (EVO-26): `#[since]` in it names its revisions
[package.metadata.wire_weaver]
wire = "w3.0"

[features]
default = ["std"]
std = ["ww_api/std", "ww_si/std"]
defmt = ["dep:defmt", "ww_api/defmt", "ww_si/defmt"]

[dependencies]
defmt = { workspace = true, optional = true }
ww_api.workspace = true
ww_si = { workspace = true, default-features = false, features = ["information"] }
