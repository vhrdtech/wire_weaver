[package]
name = "ww_version"
version = "0.2.0"
authors.workspace = true
description = "SemVer for no_std targets based on shrink_wrap wire format"
edition.workspace = true
license.workspace = true
repository = "https://github.com/vhrdtech/ww_stdlib"

# Wire version of the traits and types of this crate (EVO-26): `#[since]` in it names its revisions
[package.metadata.wire_weaver]
wire = "w1.0"

[features]
default = ["std"]
std = ["shrink_wrap/std", "semver/std", "dep:hex", "hex/std", "ww_global/std"]
defmt = ["dep:defmt", "shrink_wrap/defmt", "ww_global/defmt"]
serde = ["dep:serde", "shrink_wrap/serde", "ww_global/serde"]
semver = ["dep:semver"]

[dependencies]
defmt = { workspace = true, optional = true }
hex = { workspace = true, optional = true }
semver = { version = "1", default-features = false, optional = true }
serde = { workspace = true, optional = true }
shrink_wrap.workspace = true
ww_global.workspace = true

[dev-dependencies]
hex-literal.workspace = true
