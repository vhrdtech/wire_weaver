[package]
name = "ww_stream"
version.workspace = true
authors.workspace = true
description = "Counted and reliable WireWeaver streams: positions, loss accounting, acknowledgements, stores, backfill"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true

[features]
default = []
# build against std instead of no_std: alloc, streams and a bigger CRC-32 table
std = [
    "alloc",
    "streams",
    "ww_client_server/std",
    "ww_si/std",
    "ww_crc?/table-slice16",
]
# counted and reliable streams and credit sinks (tx, rx, sink, codec): their wire messages are behind
# ww_client_server's `streams` too, so a firmware with only plain streams and observe doesn't carry them
streams = ["ww_client_server/streams"]
# sink::SinkTx, the host side of credit sinks
alloc = []
# typed per-stream instance counters (cnt::Counters<StreamCnt>)
cnt = ["dep:cnt"]
# RamRingError implements defmt::Format, so it can be logged on target without core::fmt::Debug (SW-69)
defmt = ["dep:defmt", "wire_weaver/defmt"]
# store::LogStore: a power-cut safe log on a block device
log-store = ["dep:ww_crc"]
# codec::ItemCodec for ww_lz4::Encoder: compressed counted streams (API-55)
lz4 = ["streams", "dep:ww_lz4"]
# store::PersistentRamRing: a RAM ring that survives a soft reset
persistent-ram = ["dep:ww_crc"]
# store::log::SdMedium on an embedded-sdmmc BlockDevice
sdmmc = ["log-store", "dep:embedded-sdmmc-types"]
# store::log::NorMedium on an embedded-storage-async NorFlash
nor-flash = ["log-store", "dep:embedded-storage-async"]

[dependencies]
atomic-waker.workspace = true
cnt = { workspace = true, optional = true }
defmt = { workspace = true, optional = true }
embedded-sdmmc-types = { workspace = true, optional = true }
embedded-storage-async = { workspace = true, optional = true }
portable-atomic.workspace = true
wire_weaver.workspace = true
ww_client_server.workspace = true
ww_crc = { workspace = true, optional = true }
ww_lz4 = { workspace = true, optional = true }
ww_si.workspace = true

[dev-dependencies]
ww_crc.workspace = true
ww_lz4 = { workspace = true, features = ["std"] }
ww_si = { workspace = true, features = ["std"] }

# The workspace lints, copied: this crate holds unsafe code (`unsafe = true` in layers.toml), which the workspace
# forbids. Every unsafe block has a `// SAFETY:` comment.
[lints.cargo]
unused_workspace_dependencies = "deny"

[lints.rust]
# `cargo fuzz` builds with `--cfg fuzzing`: ww_self and ww_stream gate their fuzz entry points on it
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(fuzzing)'] }
unsafe_code = "allow" # unsafe = true in layers.toml: the workspace forbids it elsewhere
