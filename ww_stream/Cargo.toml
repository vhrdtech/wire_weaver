[package]
name = "ww_stream"
version.workspace = true
authors.workspace = true
description = "Counted and reliable WireWeaver streams: positions, loss accounting, acknowledgements, stores, backfill"
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = []
std = ["alloc", "ww_client_server/std", "ww_si/std"]
# sink::SinkTx, the host side of credit sinks
alloc = []
# typed per-stream instance counters (cnt::Counters<StreamCnt>)
cnt = ["dep:cnt"]
# store::LogStore: a power-cut safe log on a block device
log-store = ["dep:crc"]
# codec::ItemCodec for ww_lz4::Encoder: compressed counted streams (API-55)
lz4 = ["dep:ww_lz4"]
# store::PersistentRamRing: a RAM ring that survives a soft reset
persistent-ram = ["dep:crc"]
# store::log::SdMedium on an embedded-sdmmc BlockDevice
sdmmc = ["log-store", "dep:embedded-sdmmc-types"]
# store::log::NorMedium on an embedded-storage-async NorFlash
nor-flash = ["log-store", "dep:embedded-storage-async"]

[dependencies]
atomic-waker.workspace = true
cnt = { workspace = true, optional = true }
crc = { workspace = true, optional = true }
embedded-sdmmc-types = { version = "0.1", optional = true }
embedded-storage-async = { workspace = true, optional = true }
portable-atomic.workspace = true
wire_weaver.workspace = true
ww_client_server.workspace = true
ww_lz4 = { workspace = true, optional = true }
ww_si.workspace = true

[dev-dependencies]
crc.workspace = true
ww_lz4 = { workspace = true, features = ["std"] }
ww_si = { workspace = true, features = ["std"] }

[lints.rust]
# `cargo fuzz` builds with `--cfg fuzzing`: the batch checks for fuzz/
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(fuzzing)'] }
