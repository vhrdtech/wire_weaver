[package]
name = "ww_tap"
version = "0.1.0"
authors.workspace = true
description = "Link tap: frames, messages and link events of a WireWeaver link, batched into tape blocks"
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = []
std = ["wire_weaver/std", "dep:ww_tape", "ww_tape/std", "dep:tracing"]

[dependencies]
tracing = { version = "0.1", optional = true }
wire_weaver.workspace = true
ww_tape = { workspace = true, optional = true }

# Wire version of the traits and types of this crate (EVO-26): `#[since]` in it names its revisions
[package.metadata.wire_weaver]
wire = "w1.0"
