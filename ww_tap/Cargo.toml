[package]
name = "ww_tap"
version = "0.1.0"
authors.workspace = true
description = "Link tap: the hook a transport reports frames, messages and link events of a WireWeaver link to"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true

# Wire version of the traits and types of this crate (EVO-26): `#[since]` in it names its revisions
[package.metadata.wire_weaver]
wire = "w1.0"

[features]
default = []
# `tape`: the ww_tape tracks and clock of a capture of link taps
std = ["wire_weaver/std", "dep:ww_tape", "ww_tape/std"]

[dependencies]
wire_weaver.workspace = true
ww_tape = { workspace = true, optional = true }

[lints]
workspace = true
