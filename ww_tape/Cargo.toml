[package]
name = "ww_tape"
version = "0.1.0"
authors.workspace = true
description = "Tape blocks: tracks of ShrinkWrap records in self-checking, variable-length blocks, for live feeds and log files"
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = ["std"]
# the positional reader (TapeReader over a ByteSource) and the piece chain check, without std (WASM)
alloc = []
# owned describe records, DescribeSet, file reading and writing
std = ["alloc", "blake3/std", "exact_units/std", "shrink_wrap/std", "ww_version/std"]
# name paths of tracks from an API bundle (ww_self): name_path, key_in_bundle
bundle = ["std", "dep:anyhow", "dep:ww_self"]

[dependencies]
anyhow = { workspace = true, optional = true }
blake3.workspace = true
crc.workspace = true
exact_units = { workspace = true, features = ["counting", "information", "shrink_wrap", "time"] }
lz4_flex.workspace = true
shrink_wrap.workspace = true
ww_self = { workspace = true, optional = true }
ww_version.workspace = true

[dev-dependencies]
exact_units = { workspace = true, features = ["counting", "electrical", "shrink_wrap", "std", "time"] }

# exact_units' panic-class lints: no panic, overflow or unchecked index reachable from file bytes (STD-131).
# Every exception is an #[expect(.., reason = "..")] naming its invariant; tests may panic (lib.rs, tests/it).
[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
unreachable = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
indexing_slicing = "deny"
arithmetic_side_effects = "deny"
as_conversions = "deny"
cast_lossless = "deny"
cast_possible_truncation = "deny"
cast_possible_wrap = "deny"
cast_precision_loss = "deny"
cast_sign_loss = "deny"
undocumented_unsafe_blocks = "deny"
allow_attributes_without_reason = "deny"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"
