[package]
name = "ww_timebase"
version = "0.1.0"
authors.workspace = true
description = "Device clock and time synchronisation data types and API"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true

# Wire version of the traits and types of this crate (EVO-26): `#[since]` in it names its revisions
[package.metadata.wire_weaver]
wire = "w3.0"

[features]
default = ["std"]
# build against std instead of no_std
std = ["ww_api/std", "ww_date_time/std", "ww_si/std"]
# defmt formatting for the clock's types
defmt = ["dep:defmt", "ww_api/defmt", "ww_date_time/defmt", "ww_si/defmt"]

[dependencies]
defmt = { workspace = true, optional = true }
ww_api = { workspace = true, default-features = false }
ww_date_time = { workspace = true, default-features = false }
ww_si = { workspace = true, default-features = false, features = ["time", "dimensionless"] }

[lints]
workspace = true
