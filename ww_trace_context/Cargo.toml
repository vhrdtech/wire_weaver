[package]
name = "ww_trace_context"
version = "0.1.0"
authors.workspace = true
description = "W3C trace context types as WireWeaver requests carry them"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true

[features]
default = ["std"]
# the owned forms of the types, for hosts
std = ["shrink_wrap/std"]
# defmt formatting for the types
defmt = ["dep:defmt", "shrink_wrap/defmt"]

[dependencies]
defmt = { workspace = true, optional = true }
shrink_wrap = { workspace = true, default-features = false }

[lints]
workspace = true
