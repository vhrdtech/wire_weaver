[project.markdown_extensions]
abbr = {}
admonition = {}
attr_list = {}
def_list = {}
footnotes = {}
md_in_html = {}
toc = {
  permalink = true
}
pymdownx.arithmatex = {
  generic = true
}
pymdownx.betterem = {}
pymdownx.caret = {}
pymdownx.details = {}
pymdownx.emoji = {
  emoji_generator = "zensical.extensions.emoji.to_svg",
  emoji_index = "zensical.extensions.emoji.twemoji",
}
pymdownx.highlight = {
  anchor_linenums = true,
  line_spans = "__span",
  pygments_lang_class = true,
  extend_pygments_lang = [
    { name = "console", lang = "vz-console" },
    { name = "rust", lang = "vz-rust" },
  ],
}
pymdownx.inlinehilite = {}
pymdownx.keys = {}
pymdownx.magiclink = {}
pymdownx.mark = {}
pymdownx.smartsymbols = {}
# Pulls the repo root FEATURES.md into docs/features.md, keeping a single source
pymdownx.snippets = {
  base_path = ["."],
  check_paths = true,
  # a marked section inside an impl or a function shows from its own indentation
  dedent_subsections = true
}
# pymdownx.snippets = {
#   base_path = "includes",
# }
pymdownx.superfences = {
  custom_fences = [
    {
      name = "mermaid",
      class = "mermaid",
      format = "pymdownx.superfences.fence_code_format",
    },
    # bit layouts: coloured bits in byte cells and a table of the fields, checked against a `bytes` line
    # (docs_ext/ww_docs_ext/bits.py, docs/levels.md "For writers")
    {
      name = "bits",
      class = "ww-bits",
      format = "ww_docs_ext.bits.fence",
    },
  ],
}
pymdownx.tabbed = {
  alternate_style = true,
  combine_header_slug = true
}
pymdownx.tasklist = {
  custom_checkbox = true
}
pymdownx.tilde = {}
# `[[term]]`: a glossary term from docs/glossary.toml, its entry on hover; glossary.md lists every entry
"vhrd_zensical.glossary" = {}
# RTT, DFU and every abbreviation of docs/abbreviations.toml: its long form on hover, through `abbr` above
"vhrd_zensical.abbreviations" = {}
# [`Name`], [`file.rs`], [`file.rs:section`]: an item of these crates or any file git tracks, its code on hover,
# its lines on GitHub on click; a name that matches nothing fails the build. The crates are the framework's and
# the book's examples' (the thermometer's three)
"vhrd_zensical.code_refs" = { crates = ["wire_weaver", "wire_weaver_core", "wire_weaver_derive", "ww_api", "wire_weaver_client", "wire_weaver_cli", "wire_weaver_evolution", "thermometer_api", "thermometer_device", "thermometer"], on_crates_io = ["wire_weaver", "wire_weaver_core", "wire_weaver_derive"], sources = "target/vz/sources.toml" }
