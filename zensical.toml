# WireWeaver syntax highlighting on top of the Pygments-highlighted ```rust blocks (DOC-11): ww_highlight.js, its
# CSS and ww_tokens.json (fetched by the script itself) are vendored from ww_lsp's `ww_highlight` crate, checked by
# tests/docs_highlight.
# vz-refs.css and vz-refs.js: the cards of code links; vz-code.css: the code colours; all three written by
# `vz prep` (`just build-docs`), not in git. javascripts/vz-stamp-age.js: the footer stamp's age script, also
# `vz prep`'s.
extra_css = ["stylesheets/vhrd.css", "stylesheets/ww_highlight.css", "stylesheets/vz-refs.css", "stylesheets/vz-code.css"]
extra_javascript = ["javascripts/ww_highlight.js", "javascripts/vz-refs.js", "javascripts/vz-stamp-age.js"]

[project.theme]
# variant = "classic"
custom_dir = "overrides"
favicon = "assets/wire_weaver_favicon.svg"
language = "en"
features = [
  "announce.dismiss",
  # "content.action.edit",
  # "content.action.view",
  "content.code.annotate",
  "content.code.copy",
  "content.code.select",
  "content.footnote.tooltips",
  "content.tabs.link",
  "content.tooltips",
  # "header.autohide",
  # "navigation.expand",
  "navigation.footer",
  "navigation.indexes",
  "navigation.instant",
  "navigation.instant.prefetch",
  # "navigation.instant.progress",
  "navigation.path",
  # "navigation.prune",
  "navigation.sections",
  "navigation.tabs",
  # "navigation.tabs.sticky",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
  # "toc.follow",
  # "toc.integrate",
]

logo = "assets/wire_weaver_icon_small.svg"

# [project.theme.icon]
# logo = "lucide/smile"

[project.theme.font]
text = "IBM Plex Sans"
code = "IBM Plex Mono"

[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "lucide/sun-moon"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"
primary = "custom"
accent = "custom"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to system preference"
primary = "custom"
accent = "custom"

