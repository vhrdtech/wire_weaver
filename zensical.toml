[project]
site_url = "https://ww.vhrd.tech/"
site_name = "WireWeaver"
site_description = "Wire format and API code generator with rich type system and no alloc for embedded systems"
site_author = "Roman Isaikin"

copyright = "Copyright &copy; 2026 vhrdtech"

repo_url = "https://github.com/vhrdtech/wire_weaver"
repo_name = "vhrdtech/wire_weaver"
edit_uri = "edit/master/docs/"

nav = [
    { "Home" = [
            "index.md",
            "levels.md"
        ]
    },
    { "Features" = "features_today.md" },
    # Each section lists its Basic pages first, then Advanced and Nomicon (docs/levels.md)
    { "SerDes" = [
            "serdes/shrink_wrap.md",
            "serdes/derive.md",
            "types.md",
            { "Advanced" = [
                    { "Size assumptions" = "serdes/size_assumptions.md" },
                    "serdes/derive_reference.md",
                    "serdes/special_types.md",
                    "serdes/layouts.md",
                    "serdes/showcase.md",
                    "serdes/use_cases.md",
                    "c.md"
                ]
            },
            { "Nomicon" = [
                    "serdes/wire_format.md",
                    "serdes/code_size.md"
                ]
            }
        ]
    },
    { "API" = [
            { "Getting started" = "api/overview.md" },
            "api/folder_structure.md",
            "api/methods.md",
            "api/properties.md",
            "api/streams.md",
            "api/traits.md",
            "api/errors.md",
            { "Advanced" = [
                    "api/arrays.md",
                    "api/optional_items.md",
                    "api/multi_requests.md",
                    "api/observing.md",
                    "api/versioning.md",
                    "api/settings.md",
                    { "ECC-safe flash" = "api/ecc_flash.md" }
                ]
            },
            { "Nomicon" = [
                    "api/counted_streams.md",
                    { "Stream delivery" = "api/stream_reliability.md" },
                    "api/stream_stores.md",
                    "api/credit_sinks.md",
                    "api/stream_protocol.md",
                    "api/trait_attachments.md",
                    { "Addressing" = "api/addressing.md" }
                ]
            }
        ]
    },
    { "Evolution" = [
            "evolution/rules.md",
            "evolution/checker_tool.md",
            { "Advanced" = [
                    "evolution/crate_layers.md"
                ]
            }
        ]
    },
    # Grouped by family instead of by level; each page's badge tells its level, Basic pages first in a family
    { "Standard library" = [
            "std_library/overview.md",
            { "I/O" = [
                    "std_library/io_family.md",
                    "std_library/ww_gpio.md",
                    "std_library/ww_uart.md",
                    "std_library/ww_can_bus.md",
                    "std_library/ww_i2c.md",
                    "std_library/ww_spi.md",
                    "std_library/ww_onewire.md",
                    "std_library/ww_adc.md",
                    "std_library/ww_pwm.md",
                    "std_library/ww_timebase.md",
                    "std_library/ww_logic_analyzer.md",
                    "std_library/ww_signal_generator.md",
                    "std_library/ww_memory.md",
                    "std_library/ww_can_bus_reference.md"
                ]
            },
            { "Device contract" = [
                    "std_library/device_contract.md",
                    "std_library/ww_firmware_info.md",
                    "std_library/ww_board_info.md",
                    "std_library/ww_uid.md",
                    "std_library/ww_user_info.md",
                    "std_library/ww_log.md",
                    "std_library/ww_indication.md",
                    { "ww_dfu" = "std_library/ww_dfu.md" },
                    "std_library/ww_counters.md",
                    { "ww_dfu: A/B" = "std_library/ww_dfu_ab.md" },
                    { "ww_dfu: one slot" = "std_library/ww_dfu_one_slot.md" },
                    { "ww_dfu: internals" = "std_library/ww_dfu_internals.md" }
                ]
            },
            { "Data types" = [
                    "std_library/ww_si.md",
                    "std_library/ww_error.md",
                    "std_library/ww_date_time.md",
                    "std_library/ww_numeric.md"
                ]
            },
            { "Framework" = [
                    "std_library/ww_version.md",
                    "std_library/ww_client_server.md",
                    "std_library/ww_self.md"
                ]
            }
        ]
    },
    { "Transport protocols" = [
            { "Overview" = "transport/overview.md" },
            "transport/usb.md",
            "transport/rtt.md",
            "transport/websocket.md",
            "transport/udp.md",
            { "Advanced" = [
                    { "USB inside" = "transport/usb_internals.md" },
                    "transport/ww_link.md",
                    "transport/ww_framer.md",
                    { "Following a reboot" = "transport/follow_reboot.md" }
                ]
            },
            { "Nomicon" = [
                    "transport/ww_framer_wire.md"
                ]
            }
        ]
    },
    { "Examples and templates" = [
            "examples/examples.md",
            { "wire_weaver_template repo" = "https://github.com/vhrdtech/wire_weaver_template" },
            { "Advanced" = [
                    "examples/motor_demo.md"
                ]
            }
        ]
    },
    { "Dev tools" = [
            "cli.md",
            "python.md",
            { "Advanced" = [
                    { "CLI reference" = "cli_reference.md" },
                    { "Python: more" = "python_advanced.md" },
                    "dev_tool.md"
                ]
            }
        ]
    },
    { "Feature tracker" = "features.md" }
]

extra_css = ["stylesheets/vhrd.css"]
# extra_javascript = ["javascripts/extra.js"]

[project.theme]
# variant = "classic"
custom_dir = "overrides"
favicon = "assets/wire_weaver_favicon.svg"
language = "en"
features = [
  "announce.dismiss",
  # "content.action.edit",
  # "content.action.view",
  "content.code.annotate",
  "content.code.copy",
  "content.code.select",
  "content.footnote.tooltips",
  "content.tabs.link",
  "content.tooltips",
  # "header.autohide",
  # "navigation.expand",
  "navigation.footer",
  "navigation.indexes",
  "navigation.instant",
  "navigation.instant.prefetch",
  # "navigation.instant.progress",
  "navigation.path",
  # "navigation.prune",
  "navigation.sections",
  "navigation.tabs",
  # "navigation.tabs.sticky",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
  # "toc.follow",
  # "toc.integrate",
]

logo = "assets/wire_weaver_icon_small.svg"

# [project.theme.icon]
# logo = "lucide/smile"

[project.theme.font]
text = "IBM Plex Sans"
code = "IBM Plex Mono"

[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "lucide/sun-moon"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"
primary = "custom"
accent = "custom"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to system preference"
primary = "custom"
accent = "custom"

[[project.extra.social]]
icon = "fontawesome/brands/github"
link = "https://github.com/vhrdtech"
name = "vhrdtech on GitHub"

[[project.extra.social]]
icon = "fontawesome/brands/linkedin"
link = "https://www.linkedin.com/company/vhrdtech/"
name = "vhrdtech on LinkedIn"

[[project.extra.social]]
icon = "fontawesome/solid/globe"
link = "https://vhrd.tech"
name = "vhrd.tech website"

[project.markdown_extensions]
abbr = {}
admonition = {}
attr_list = {}
def_list = {}
footnotes = {}
md_in_html = {}
toc = {
  permalink = true
}
pymdownx.arithmatex = {
  generic = true
}
pymdownx.betterem = {}
pymdownx.caret = {}
pymdownx.details = {}
pymdownx.emoji = {
  emoji_generator = "zensical.extensions.emoji.to_svg",
  emoji_index = "zensical.extensions.emoji.twemoji",
}
pymdownx.highlight = {
  anchor_linenums = true,
  line_spans = "__span",
  pygments_lang_class = true,
}
pymdownx.inlinehilite = {}
pymdownx.keys = {}
pymdownx.magiclink = {}
pymdownx.mark = {}
pymdownx.smartsymbols = {}
# Pulls the repo root FEATURES.md into docs/features.md, keeping a single source
pymdownx.snippets = {
  base_path = ["."],
  check_paths = true
}
# pymdownx.snippets = {
#   base_path = "includes",
# }
pymdownx.superfences = {
  custom_fences = [
    {
      name = "mermaid",
      class = "mermaid",
      format = "pymdownx.superfences.fence_code_format",
    },
  ],
}
pymdownx.tabbed = {
  alternate_style = true,
  combine_header_slug = true
}
pymdownx.tasklist = {
  custom_checkbox = true
}
pymdownx.tilde = {}
